# Local toolchain for this repo: `mise install` (https://mise.jdx.dev).
#
# Single source of tool versions: CI reads these pins via scripts/tool-versions.sh, and
# Renovate's mise manager bumps them. flux2 must stay on the FluxInstance minor
# (gitops/infrastructure/flux-instance/flux-instance.yaml) and kubectl on the k3s minor;
# scripts/check-tool-versions.sh enforces both, and Renovate only proposes patches for them.
[tools]
opentofu    = "1.13.2"
kubectl     = "1.37.1"
kustomize   = "5.8.3"
helm        = "4.3.1"
kubeconform = "0.8.0"
tflint      = "0.65.0"
flux2       = "2.9.6"
sops        = "3.13.3"
age         = "1.3.2"
