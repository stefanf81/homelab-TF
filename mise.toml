# Local toolchain for this repo: `mise install` (https://mise.jdx.dev).
#
# Versions match what CI and the cluster use: kubectl/kubeconform/tflint/OpenTofu are the
# pins in .github/workflows/validate-gitops.yaml (keep them equal), flux2 is the FluxInstance
# distribution minor (gitops/infrastructure/flux-instance/flux-instance.yaml), kubectl follows
# the k3s minor. Renovate's mise manager keeps this file current.
[tools]
opentofu    = "1.12.9"
kubectl     = "1.37.1"
kustomize   = "5.8.1"
helm        = "4.3.1"
kubeconform = "0.8.0"
tflint      = "0.65.0"
flux2       = "2.9.6"
sops        = "3.13.3"
age         = "1.3.2"
