name: Build and Push abuseipdb-sync

on:
  push:
    branches:
      - main
    paths:
      - 'gitops/images/abuseipdb-sync/**'
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/images/abuseipdb-sync/**'
      - '.github/workflows/build-abuseipdb-sync.yaml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GitHub Container Registry (GHCR)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail

          APP_VER=$(grep '^ARG APP_VERSION=' gitops/images/abuseipdb-sync/Dockerfile | cut -d= -f2 | tr -d ' "')
          REV=$(grep '^ARG IMAGE_REVISION=' gitops/images/abuseipdb-sync/Dockerfile | cut -d= -f2 | tr -d ' "')
          GO_VER=$(grep '^ARG GO_VERSION=' gitops/images/abuseipdb-sync/Dockerfile | cut -d= -f2 | tr -d ' "')
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          [[ "$APP_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid app version: $APP_VER" >&2; exit 1; }
          [[ "$REV" =~ ^r[0-9]+$ ]] || { echo "Invalid image revision: $REV" >&2; exit 1; }
          [[ "$GO_VER" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "Invalid Go version: $GO_VER" >&2; exit 1; }

          IMAGE_TAG="${APP_VER}-${REV}"

          echo "app_version=${APP_VER}" >> "$GITHUB_OUTPUT"
          echo "go_version=${GO_VER}" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Extracted values:"
          echo "  App: ${APP_VER}"
          echo "  Revision: ${REV}"
          echo "  Go: ${GO_VER}"
          echo "  Target tag: ${IMAGE_TAG}"
          echo "  Repository owner: ${REPO_OWNER}"

      - name: Run Go tests
        run: |
          set -euo pipefail
          cd gitops/images/abuseipdb-sync
          go vet ./...
          go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ steps.versions.outputs.repo_owner }}/abuseipdb-sync
          tags: |
            type=raw,value=${{ steps.versions.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=${{ steps.versions.outputs.image_tag }}-

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: gitops/images/abuseipdb-sync
          file: gitops/images/abuseipdb-sync/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ steps.versions.outputs.go_version }}
            APP_VERSION=${{ steps.versions.outputs.app_version }}
            IMAGE_REVISION=${{ steps.versions.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE="ghcr.io/${{ steps.versions.outputs.repo_owner }}/abuseipdb-sync"
          TAG="${{ steps.versions.outputs.image_tag }}"

          echo "### abuseipdb-sync build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DIGEST" ]; then
            echo "- **Digest**: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Pin the GitOps manifest to:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "image: ${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
