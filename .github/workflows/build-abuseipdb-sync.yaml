name: Build and Push abuseipdb-sync

on:
  push:
    branches:
      - main
    paths:
      - 'gitops/images/abuseipdb-sync/**'
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/images/abuseipdb-sync/**'
      - '.github/workflows/build-abuseipdb-sync.yaml'
      - '.github/actions/install-trivy/**'
      - '.github/workflows/publish-image.yaml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GitHub Container Registry (GHCR); only runs on main'
        required: true
        default: true
        type: boolean

# renovate: datasource=github-releases depName=aquasecurity/trivy
env:
  TRIVY_VERSION: v0.76.2

# Pull requests cancel superseded runs; a publication from main is never
# cancelled halfway (the image would be pushed but not signed or tagged).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, tests and the Trivy gate on a local build, on pull requests and on
  # main. No registry token: publication is the `publish` job below.
  test:
    name: Test Image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.versions.outputs.image_tag }}
      app_version: ${{ steps.versions.outputs.app_version }}
      revision: ${{ steps.versions.outputs.revision }}
      extra_tags: ${{ steps.tags.outputs.extra_tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # revision guard compares the image source across the push
          persist-credentials: false # nothing in this job pushes with git

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: gitops/images/abuseipdb-sync/Dockerfile

      # A changed image recipe or Go source must ship under a new APP_VERSION or
      # IMAGE_REVISION so published version tags are never overwritten in GHCR.
      - name: Require a new version or IMAGE_REVISION when source changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          DOCKERFILE=gitops/images/abuseipdb-sync/Dockerfile
          base=""
          if [ "${EVENT_NAME:-}" = "pull_request" ] && [ -n "${PR_BASE:-}" ] && git rev-parse --verify --quiet "$PR_BASE" >/dev/null; then
            base="$PR_BASE"
          elif [ -n "${BEFORE:-}" ] && git rev-parse --verify --quiet "$BEFORE" >/dev/null; then
            base="$BEFORE"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            base="HEAD^"
          fi
          if [ -z "$base" ]; then
            echo "no base commit; skipping revision guard"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD -- 'gitops/images/abuseipdb-sync/' | grep -v '_test\.go$' || true)
          if [ -z "$changed" ]; then
            echo "only tests (or nothing) changed since $base; no revision bump required"
            exit 0
          fi
          old_ver=$(git show "$base:$DOCKERFILE" | grep '^ARG APP_VERSION=' | cut -d= -f2 | tr -d ' "')
          old_rev=$(git show "$base:$DOCKERFILE" | grep '^ARG IMAGE_REVISION=' | cut -d= -f2 | tr -d ' "')
          new_ver=$(grep '^ARG APP_VERSION=' "$DOCKERFILE" | cut -d= -f2 | tr -d ' "')
          new_rev=$(grep '^ARG IMAGE_REVISION=' "$DOCKERFILE" | cut -d= -f2 | tr -d ' "')
          if [ "${old_ver}-${old_rev}" = "${new_ver}-${new_rev}" ]; then
            echo "::error::abuseipdb-sync source changed ($changed) but tag is still '${new_ver}-${new_rev}'; bump APP_VERSION or IMAGE_REVISION"
            exit 1
          fi
          echo "source changed and tag bumped: ${old_ver}-${old_rev} -> ${new_ver}-${new_rev}"

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail

          APP_VER=$(grep '^ARG APP_VERSION=' gitops/images/abuseipdb-sync/Dockerfile | cut -d= -f2 | tr -d ' "')
          REV=$(grep '^ARG IMAGE_REVISION=' gitops/images/abuseipdb-sync/Dockerfile | cut -d= -f2 | tr -d ' "')
          # The Go version is the tag of the digest-pinned builder image
          # (ARG GO_IMAGE=golang:<version>-alpine@sha256:<digest>), so the tests
          # below and the image build use the same toolchain version.
          GO_VER=$(sed -n 's/^ARG GO_IMAGE=golang:\([0-9][0-9.]*\)-alpine@sha256:[0-9a-f]\{64\}$/\1/p' gitops/images/abuseipdb-sync/Dockerfile)
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          [[ "$APP_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid app version: $APP_VER" >&2; exit 1; }
          [[ "$REV" =~ ^r[0-9]+$ ]] || { echo "Invalid image revision: $REV" >&2; exit 1; }
          [[ "$GO_VER" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid Go version: $GO_VER" >&2; exit 1; }

          IMAGE_TAG="${APP_VER}-${REV}"

          echo "app_version=${APP_VER}" >> "$GITHUB_OUTPUT"
          echo "go_version=${GO_VER}" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Extracted values:"
          echo "  App: ${APP_VER}"
          echo "  Revision: ${REV}"
          echo "  Go: ${GO_VER}"
          echo "  Target tag: ${IMAGE_TAG}"
          echo "  Repository owner: ${REPO_OWNER}"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
          cache-dependency-path: gitops/images/abuseipdb-sync/go.sum

      - name: Run Go tests
        run: |
          set -euo pipefail
          cd gitops/images/abuseipdb-sync
          go vet ./...
          go test -race ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built into the local daemon for the scan, before any registry login. The
      # push step below rebuilds from the same cache, so it reuses these layers.
      - name: Build image for scan (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gitops/images/abuseipdb-sync
          file: gitops/images/abuseipdb-sync/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: abuseipdb-sync:scan
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.app_version }}
            IMAGE_REVISION=${{ steps.versions.outputs.revision }}
          # Own cache scope: the default `buildkit` scope is shared with the WAF image
          # build, and each gha export replaces the scope's cache.
          cache-from: type=gha,scope=abuseipdb-sync
          cache-to: type=gha,mode=max,scope=abuseipdb-sync

      # Hard gate on the image this run would publish: HIGH/CRITICAL findings
      # with a released fix fail the build (OS packages and the Go binary's modules).
      - name: Install Trivy
        uses: ./.github/actions/install-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan image (Trivy, HIGH/CRITICAL with a fix)
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress abuseipdb-sync:scan

      - name: Publication tags
        id: tags
        env:
          TAG: ${{ steps.versions.outputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The revision tag stays immutable; these move with every publication.
          {
            echo "extra_tags<<EOF"
            echo "latest"
            echo "${TAG}-${SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  ###########################################################
  # Publish from main: push by digest, scan, sign, attest, tag
  ###########################################################

  # The reusable workflow holds the write, signing and attestation tokens, each
  # in its own job; this job only grants the most any of them needs. Its
  # signing identity is publish-image.yaml@refs/heads/main, which the Kyverno
  # policy verify-homelab-images pins.
  publish:
    name: Publish
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yaml
    with:
      image: abuseipdb-sync
      context: gitops/images/abuseipdb-sync
      tag: ${{ needs.test.outputs.image_tag }}
      extra-tags: ${{ needs.test.outputs.extra_tags }}
      # No Go build-arg: the builder image is pinned by digest in the
      # Dockerfile (GO_IMAGE).
      build-args: |
        APP_VERSION=${{ needs.test.outputs.app_version }}
        IMAGE_REVISION=${{ needs.test.outputs.revision }}
