name: Build and Push abuseipdb-sync

on:
  push:
    branches:
      - main
    paths:
      - 'gitops/images/abuseipdb-sync/**'
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/images/abuseipdb-sync/**'
      - '.github/workflows/build-abuseipdb-sync.yaml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GitHub Container Registry (GHCR)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # revision guard compares the image source across the push
          persist-credentials: false # nothing in this job pushes with git

      # A changed image recipe or Go source must ship under a new APP_VERSION or
      # IMAGE_REVISION so published version tags are never overwritten in GHCR.
      - name: Require a new version or IMAGE_REVISION when source changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          DOCKERFILE=gitops/images/abuseipdb-sync/Dockerfile
          base=""
          if [ "${EVENT_NAME:-}" = "pull_request" ] && [ -n "${PR_BASE:-}" ] && git rev-parse --verify --quiet "$PR_BASE" >/dev/null; then
            base="$PR_BASE"
          elif [ -n "${BEFORE:-}" ] && git rev-parse --verify --quiet "$BEFORE" >/dev/null; then
            base="$BEFORE"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            base="HEAD^"
          fi
          if [ -z "$base" ]; then
            echo "no base commit; skipping revision guard"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD -- 'gitops/images/abuseipdb-sync/' | grep -v '_test\.go$' || true)
          if [ -z "$changed" ]; then
            echo "only tests (or nothing) changed since $base; no revision bump required"
            exit 0
          fi
          old_ver=$(git show "$base:$DOCKERFILE" | grep '^ARG APP_VERSION=' | cut -d= -f2 | tr -d ' "')
          old_rev=$(git show "$base:$DOCKERFILE" | grep '^ARG IMAGE_REVISION=' | cut -d= -f2 | tr -d ' "')
          new_ver=$(grep '^ARG APP_VERSION=' "$DOCKERFILE" | cut -d= -f2 | tr -d ' "')
          new_rev=$(grep '^ARG IMAGE_REVISION=' "$DOCKERFILE" | cut -d= -f2 | tr -d ' "')
          if [ "${old_ver}-${old_rev}" = "${new_ver}-${new_rev}" ]; then
            echo "::error::abuseipdb-sync source changed ($changed) but tag is still '${new_ver}-${new_rev}'; bump APP_VERSION or IMAGE_REVISION"
            exit 1
          fi
          echo "source changed and tag bumped: ${old_ver}-${old_rev} -> ${new_ver}-${new_rev}"

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail

          APP_VER=$(grep '^ARG APP_VERSION=' gitops/images/abuseipdb-sync/Dockerfile | cut -d= -f2 | tr -d ' "')
          REV=$(grep '^ARG IMAGE_REVISION=' gitops/images/abuseipdb-sync/Dockerfile | cut -d= -f2 | tr -d ' "')
          GO_VER=$(grep '^ARG GO_VERSION=' gitops/images/abuseipdb-sync/Dockerfile | cut -d= -f2 | tr -d ' "')
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          [[ "$APP_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid app version: $APP_VER" >&2; exit 1; }
          [[ "$REV" =~ ^r[0-9]+$ ]] || { echo "Invalid image revision: $REV" >&2; exit 1; }
          [[ "$GO_VER" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid Go version: $GO_VER" >&2; exit 1; }

          IMAGE_TAG="${APP_VER}-${REV}"

          echo "app_version=${APP_VER}" >> "$GITHUB_OUTPUT"
          echo "go_version=${GO_VER}" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Extracted values:"
          echo "  App: ${APP_VER}"
          echo "  Revision: ${REV}"
          echo "  Go: ${GO_VER}"
          echo "  Target tag: ${IMAGE_TAG}"
          echo "  Repository owner: ${REPO_OWNER}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
          cache-dependency-path: gitops/images/abuseipdb-sync/go.sum

      - name: Run Go tests
        run: |
          set -euo pipefail
          cd gitops/images/abuseipdb-sync
          go vet ./...
          go test -race ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published revision tags are immutable: never silently overwrite one.
      - name: Check whether the revision tag is already published
        id: tagcheck
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ steps.versions.outputs.repo_owner }}/abuseipdb-sync"
          TAG="${{ steps.versions.outputs.image_tag }}"
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${IMAGE}:${TAG} is already published; skipping push. Bump APP_VERSION or IMAGE_REVISION to publish a new revision."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ steps.versions.outputs.repo_owner }}/abuseipdb-sync
          tags: |
            type=raw,value=${{ steps.versions.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=${{ steps.versions.outputs.image_tag }}-

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: gitops/images/abuseipdb-sync
          file: gitops/images/abuseipdb-sync/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) && steps.tagcheck.outputs.exists != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ steps.versions.outputs.go_version }}
            APP_VERSION=${{ steps.versions.outputs.app_version }}
            IMAGE_REVISION=${{ steps.versions.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE="ghcr.io/${{ steps.versions.outputs.repo_owner }}/abuseipdb-sync"
          TAG="${{ steps.versions.outputs.image_tag }}"
          PUSHED="${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) && steps.tagcheck.outputs.exists != 'true' }}"

          echo "### abuseipdb-sync build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pushed to GHCR**: \`${PUSHED}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DIGEST" ]; then
            echo "- **Digest**: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Pin the GitOps manifest to:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "image: ${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
