name: Validate GitOps manifests

# Renders every path a Flux Kustomization reconciles and schema-validates it.
# validate-waf-config.yaml covers the WAF/dashboard specifics, validate-opentofu.yaml
# the OpenTofu root and modules (split out so a gitops/ change, e.g. every Flux
# image-automation bump, does not also run tofu init and tflint).

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/**'
      - 'scripts/bootstrap-foundation.sh'
      - 'scripts/validate-gitops.sh'
      - 'scripts/check-tool-versions.sh'
      - 'scripts/check-observability-config.rb'
      - 'scripts/tool-versions.sh'
      - 'scripts/flux-postbuild.rb'
      - 'scripts/check-sops-secrets.rb'
      - '.sops.yaml'
      - 'mise.toml'
      - '.github/workflows/validate-gitops.yaml'
  push:
    branches:
      - main
    paths:
      - 'gitops/**'
      - 'scripts/bootstrap-foundation.sh'
      - 'scripts/validate-gitops.sh'
      - 'scripts/check-tool-versions.sh'
      - 'scripts/check-observability-config.rb'
      - 'scripts/tool-versions.sh'
      - 'scripts/flux-postbuild.rb'
      - 'scripts/check-sops-secrets.rb'
      - '.sops.yaml'
      - 'mise.toml'
      - '.github/workflows/validate-gitops.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitops:
    name: Build and schema-validate Flux paths
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tool versions come from mise.toml (single source; Renovate bumps it).
      - name: Read tool versions from mise.toml
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"

      - name: Install pinned kubectl (with embedded Kustomize)
        run: |
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo /tmp/kubectl.sha256 "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Install pinned Helm
        run: |
          curl -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo /tmp/helm.sha256sum "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          (cd /tmp && sed 's|  helm-.*|  helm.tar.gz|' helm.sha256sum | sha256sum --check)
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      # Release binary checked against the release's CHECKSUMS, like kubectl and Helm
      # above (`go install` compiled it from source on every run).
      - name: Install pinned kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          curl -fsSLo /tmp/kubeconform-linux-amd64.tar.gz "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo /tmp/kubeconform.CHECKSUMS "$base/CHECKSUMS"
          (cd /tmp && grep ' kubeconform-linux-amd64.tar.gz$' kubeconform.CHECKSUMS | sha256sum --check)
          tar -xzf /tmp/kubeconform-linux-amd64.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Build and validate
        run: scripts/validate-gitops.sh

      - name: Dry-run fresh-cluster foundation bootstrap
        run: scripts/bootstrap-foundation.sh --dry-run

      - name: Check telemetry and security filter boundaries
        run: ruby scripts/check-observability-config.rb

      - name: Check that secrets are SOPS-encrypted
        run: ruby scripts/check-sops-secrets.rb

      - name: Check toolchain pins against the cluster
        run: scripts/check-tool-versions.sh
