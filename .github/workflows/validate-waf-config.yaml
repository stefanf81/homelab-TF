name: Validate WAF config and dashboards

# ConfigMap-only changes do not trigger the image build workflow, so validate the
# shipped WAF Caddyfiles (real trusted_proxies list and zones) and the Grafana
# dashboard structure and LogQL syntax here.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/apps/taskflow/*-waf.yaml'
      - 'gitops/monitoring/logging/loki-datasource.yaml'
      - 'gitops/monitoring/logging/kustomization.yaml'
      - 'gitops/monitoring/logging/dashboards/**'
      - 'gitops/monitoring/app/**'
      - 'gitops/monitoring/logging/loki-release.yaml'
      - 'gitops/monitoring/logging/repositories.yaml'
      - 'gitops/monitoring/platform/release.yaml'
      - 'gitops/images/taskflow-caddy-coraza/tests/validate-*'
      - 'gitops/images/taskflow-caddy-coraza/tests/loki-validation.yaml'
      - '.github/workflows/validate-waf-config.yaml'
  push:
    branches:
      - main
    paths:
      - 'gitops/apps/taskflow/*-waf.yaml'
      - 'gitops/monitoring/logging/loki-datasource.yaml'
      - 'gitops/monitoring/logging/kustomization.yaml'
      - 'gitops/monitoring/logging/dashboards/**'
      - 'gitops/monitoring/app/**'
      - 'gitops/monitoring/logging/loki-release.yaml'
      - 'gitops/monitoring/logging/repositories.yaml'
      - 'gitops/monitoring/platform/release.yaml'
      - 'gitops/images/taskflow-caddy-coraza/tests/validate-*'
      - 'gitops/images/taskflow-caddy-coraza/tests/loki-validation.yaml'
      - '.github/workflows/validate-waf-config.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned so the embedded Kustomize version does not drift with the runner
      # image. Update deliberately alongside the repo's toolchain.
      - name: Install pinned kubectl (with embedded Kustomize)
        env:
          KUBECTL_VERSION: v1.37.0
        run: |
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo /tmp/kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client --output=yaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate WAF ConfigMaps and dashboards
        run: gitops/images/taskflow-caddy-coraza/tests/validate-configs.sh
