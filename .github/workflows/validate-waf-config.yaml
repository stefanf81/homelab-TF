name: Validate WAF config and dashboards

# ConfigMap-only changes do not trigger the image build workflow, so validate the
# shipped WAF Caddyfiles (real trusted_proxies list and zones) and the Grafana
# dashboard JSON here.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/apps/taskflow/*-waf.yaml'
      - 'gitops/monitoring/logging/grafana-provisioning.yaml'
      - 'gitops/images/taskflow-caddy-coraza/tests/validate-configs.sh'
      - '.github/workflows/validate-waf-config.yaml'
  push:
    branches:
      - main
    paths:
      - 'gitops/apps/taskflow/*-waf.yaml'
      - 'gitops/monitoring/logging/grafana-provisioning.yaml'
      - 'gitops/images/taskflow-caddy-coraza/tests/validate-configs.sh'
      - '.github/workflows/validate-waf-config.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate WAF ConfigMaps and dashboards
        run: gitops/images/taskflow-caddy-coraza/tests/validate-configs.sh
