name: Validate WAF config and dashboards

# ConfigMap-only changes do not trigger the image build workflow, so validate the
# shipped WAF Caddyfiles (real trusted_proxies list and zones) and the Grafana
# dashboard structure and LogQL syntax here.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/apps/taskflow/*-waf.yaml'
      - 'gitops/apps/taskflow/frontend.yaml'
      - 'gitops/infrastructure/controllers/coredns/release.yaml'
      - 'gitops/infrastructure/controllers/trivy-operator/**'
      - 'gitops/clusters/taskflow/cluster-vars.yaml'
      - 'gitops/clusters/taskflow/monitoring-logging.yaml'
      - 'gitops/platform/abuseipdb/**'
      - 'gitops/images/abuseipdb-sync/config.go'
      - 'gitops/monitoring/logging/loki-datasource.yaml'
      - 'gitops/monitoring/logging/kustomization.yaml'
      - 'gitops/monitoring/logging/dashboards/**'
      - 'gitops/monitoring/app/**'
      - 'gitops/monitoring/logging/loki-release.yaml'
      - 'gitops/monitoring/logging/alloy-release.yaml'
      - 'gitops/monitoring/logging/repositories.yaml'
      - 'gitops/monitoring/platform/release.yaml'
      - 'gitops/monitoring/platform/network-policies.yaml'
      - 'gitops/images/taskflow-caddy-coraza/tests/validate-*'
      - 'gitops/monitoring/tests/**'
      - '.github/workflows/validate-waf-config.yaml'
      - 'mise.toml'
  push:
    branches:
      - main
    paths:
      - 'gitops/apps/taskflow/*-waf.yaml'
      - 'gitops/apps/taskflow/frontend.yaml'
      - 'gitops/infrastructure/controllers/coredns/release.yaml'
      - 'gitops/infrastructure/controllers/trivy-operator/**'
      - 'gitops/clusters/taskflow/cluster-vars.yaml'
      - 'gitops/clusters/taskflow/monitoring-logging.yaml'
      - 'gitops/platform/abuseipdb/**'
      - 'gitops/images/abuseipdb-sync/config.go'
      - 'gitops/monitoring/logging/loki-datasource.yaml'
      - 'gitops/monitoring/logging/kustomization.yaml'
      - 'gitops/monitoring/logging/dashboards/**'
      - 'gitops/monitoring/app/**'
      - 'gitops/monitoring/logging/loki-release.yaml'
      - 'gitops/monitoring/logging/alloy-release.yaml'
      - 'gitops/monitoring/logging/repositories.yaml'
      - 'gitops/monitoring/platform/release.yaml'
      - 'gitops/monitoring/platform/network-policies.yaml'
      - 'gitops/images/taskflow-caddy-coraza/tests/validate-*'
      - 'gitops/monitoring/tests/**'
      - '.github/workflows/validate-waf-config.yaml'
      - 'mise.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Tool versions come from mise.toml (single source; Renovate bumps it).
      - name: Read tool versions from mise.toml
        run: scripts/tool-versions.sh >> "$GITHUB_ENV"

      # Pinned so the embedded Kustomize version does not drift with the runner image.
      - name: Install pinned kubectl (with embedded Kustomize)
        run: |
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLo /tmp/kubectl.sha256 "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client --output=yaml

      - name: Install pinned Helm
        run: |
          curl -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo /tmp/helm.sha256sum "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          (cd /tmp && sed 's|  helm-.*|  helm.tar.gz|' helm.sha256sum | sha256sum --check)
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate WAF ConfigMaps and dashboards
        run: gitops/images/taskflow-caddy-coraza/tests/validate-configs.sh
