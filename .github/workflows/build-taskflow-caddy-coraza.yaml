name: Build and Push taskflow-caddy-coraza

on:
  push:
    branches:
      - main
    paths:
      - 'gitops/images/taskflow-caddy-coraza/**'
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/images/taskflow-caddy-coraza/**'
      - '.github/workflows/build-taskflow-caddy-coraza.yaml'
      - '.github/actions/install-trivy/**'
      - '.github/workflows/publish-image.yaml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GitHub Container Registry (GHCR); only runs on main'
        required: true
        default: true
        type: boolean

# renovate: datasource=github-releases depName=aquasecurity/trivy
env:
  TRIVY_VERSION: v0.76.2

# Pull requests cancel superseded runs; a publication from main is never
# cancelled halfway (the image would be pushed but not signed or tagged).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, tests and the Trivy gate on a local build, on pull requests and on
  # main. No registry token: publication is the `publish` job below.
  test:
    name: Test Image
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.versions.outputs.image_tag }}
      extra_tags: ${{ steps.tags.outputs.extra_tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the revision guard compares the Dockerfile across the push
          persist-credentials: false # git is only used read-only here

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: gitops/images/taskflow-caddy-coraza/Dockerfile

      # A changed build recipe must ship under a new revision tag; otherwise the
      # "revision tag already published" check below would silently keep the old
      # image. Compare the Dockerfile across the pushed range (or the PR diff).
      - name: Require a new IMAGE_REVISION when the Dockerfile changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          DOCKERFILE=gitops/images/taskflow-caddy-coraza/Dockerfile
          base=""
          if [ "${EVENT_NAME:-}" = "pull_request" ] && [ -n "${PR_BASE:-}" ] && git rev-parse --verify --quiet "$PR_BASE" >/dev/null; then
            base="$PR_BASE"
          elif [ -n "${BEFORE:-}" ] && git rev-parse --verify --quiet "$BEFORE" >/dev/null; then
            base="$BEFORE"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            base="HEAD^"
          fi
          if [ -z "$base" ]; then
            echo "no base commit; skipping revision guard"
            exit 0
          fi
          if ! git diff --name-only "$base" HEAD -- "$DOCKERFILE" | grep -q .; then
            echo "Dockerfile unchanged since $base; no revision bump required"
            exit 0
          fi
          old=$(git show "$base:$DOCKERFILE" | grep '^ARG IMAGE_REVISION=' | cut -d= -f2 | tr -d ' "')
          new=$(grep '^ARG IMAGE_REVISION=' "$DOCKERFILE" | cut -d= -f2 | tr -d ' "')
          if [ "$old" = "$new" ]; then
            echo "::error::Dockerfile changed but IMAGE_REVISION is still '$new'; bump it so the image is republished"
            exit 1
          fi
          echo "recipe changed and IMAGE_REVISION bumped: $old -> $new"

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail

          # The Caddy version is the builder image's tag. The pattern also requires
          # the digest pin: without it nothing is extracted and the check below fails.
          CADDY_VER=$(sed -n 's/^FROM caddy:\([0-9][0-9.]*\)-builder-alpine@sha256:[0-9a-f]\{64\} AS builder$/\1/p' gitops/images/taskflow-caddy-coraza/Dockerfile)
          CORAZA_VER=$(grep '^ARG CORAZA_CADDY_VERSION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "' | sed 's/^v//')
          REV=$(grep '^ARG IMAGE_REVISION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "')
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          [[ "$CADDY_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cannot read the Caddy version from a digest-pinned 'FROM caddy:<version>-builder-alpine@sha256:... AS builder' line: '$CADDY_VER'" >&2; exit 1; }
          head -n 1 gitops/images/taskflow-caddy-coraza/Dockerfile | grep -Eq '^# syntax=docker/dockerfile:[0-9.]+@sha256:[0-9a-f]{64}$' \
            || { echo "The '# syntax=' line must pin docker/dockerfile by tag and digest" >&2; exit 1; }
          [[ "$CORAZA_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Coraza version: $CORAZA_VER" >&2; exit 1; }
          [[ "$REV" =~ ^r[0-9]+$ ]] || { echo "Invalid image revision: $REV" >&2; exit 1; }

          IMAGE_TAG="${CADDY_VER}-coraza${CORAZA_VER}-${REV}"

          echo "caddy_version=${CADDY_VER}" >> "$GITHUB_OUTPUT"
          echo "coraza_version=${CORAZA_VER}" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Extracted values:"
          echo "  Caddy: ${CADDY_VER}"
          echo "  Coraza: ${CORAZA_VER}"
          echo "  Revision: ${REV}"
          echo "  Target tag: ${IMAGE_TAG}"
          echo "  Repository owner: ${REPO_OWNER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # PyYAML from the distribution's signed archive instead of an unpinned
      # PyPI download, and before any registry login: nothing that runs before
      # the tests can see the GHCR write credentials.
      - name: Ensure python3-yaml
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Build image for tests (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gitops/images/taskflow-caddy-coraza
          file: gitops/images/taskflow-caddy-coraza/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: taskflow-caddy-coraza:test
          # Each image has its own cache scope: both workflows default to `buildkit`,
          # and a gha export replaces that scope's cache, so the abuseipdb-sync build
          # used to evict the xcaddy layers (and the other way round).
          cache-from: type=gha,scope=taskflow-caddy-coraza
          cache-to: type=gha,mode=max,scope=taskflow-caddy-coraza

      - name: Run identity and rate-limit tests
        env:
          TEST_IMAGE: taskflow-caddy-coraza:test
        run: gitops/images/taskflow-caddy-coraza/tests/run-tests.sh

      # Hard gate on the image this run would publish: HIGH/CRITICAL findings
      # with a released fix fail the build (OS packages and the Go modules compiled into Caddy).
      - name: Install Trivy
        uses: ./.github/actions/install-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan image (Trivy, HIGH/CRITICAL with a fix)
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress taskflow-caddy-coraza:test

      - name: Publication tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          CADDY: ${{ steps.versions.outputs.caddy_version }}
          CORAZA: ${{ steps.versions.outputs.coraza_version }}
        run: |
          set -euo pipefail
          # The revision tag stays immutable; these move with every publication.
          {
            echo "extra_tags<<EOF"
            echo "${CADDY}-coraza${CORAZA}"
            echo "latest"
            echo "${CADDY}-coraza${CORAZA}-${SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  ###########################################################
  # Publish from main: push by digest, scan, sign, attest, tag
  ###########################################################

  # The reusable workflow holds the write, signing and attestation tokens, each
  # in its own job; this job only grants the most any of them needs. Its
  # signing identity is publish-image.yaml@refs/heads/main, which the Kyverno
  # policy verify-homelab-images pins.
  publish:
    name: Publish
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yaml
    with:
      image: taskflow-caddy-coraza
      context: gitops/images/taskflow-caddy-coraza
      tag: ${{ needs.test.outputs.image_tag }}
      extra-tags: ${{ needs.test.outputs.extra_tags }}
