name: Build and Push taskflow-caddy-coraza

on:
  push:
    branches:
      - main
    paths:
      - 'gitops/images/taskflow-caddy-coraza/**'
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/images/taskflow-caddy-coraza/**'
      - '.github/workflows/build-taskflow-caddy-coraza.yaml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GitHub Container Registry (GHCR)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail

          CADDY_VER=$(grep '^ARG CADDY_VERSION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "')
          CORAZA_VER=$(grep '^ARG CORAZA_CADDY_VERSION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "' | sed 's/^v//')
          REV=$(grep '^ARG IMAGE_REVISION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "')
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          [[ "$CADDY_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Caddy version: $CADDY_VER" >&2; exit 1; }
          [[ "$CORAZA_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Coraza version: $CORAZA_VER" >&2; exit 1; }
          [[ "$REV" =~ ^r[0-9]+$ ]] || { echo "Invalid image revision: $REV" >&2; exit 1; }

          IMAGE_TAG="${CADDY_VER}-coraza${CORAZA_VER}-${REV}"

          echo "caddy_version=${CADDY_VER}" >> "$GITHUB_OUTPUT"
          echo "coraza_version=${CORAZA_VER}" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Extracted values:"
          echo "  Caddy: ${CADDY_VER}"
          echo "  Coraza: ${CORAZA_VER}"
          echo "  Revision: ${REV}"
          echo "  Target tag: ${IMAGE_TAG}"
          echo "  Repository owner: ${REPO_OWNER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up test Python (PyYAML)
        run: |
          python3 -m venv "$RUNNER_TEMP/testvenv"
          "$RUNNER_TEMP/testvenv/bin/pip" install --quiet pyyaml
          echo "$RUNNER_TEMP/testvenv/bin" >> "$GITHUB_PATH"

      - name: Build image for tests (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: gitops/images/taskflow-caddy-coraza
          file: gitops/images/taskflow-caddy-coraza/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: taskflow-caddy-coraza:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run identity and rate-limit tests
        env:
          TEST_IMAGE: taskflow-caddy-coraza:test
        run: gitops/images/taskflow-caddy-coraza/tests/run-tests.sh

      # Published revision tags are immutable: never silently overwrite one.
      # If the tag already exists the image was published before (e.g. a manual
      # publish, or a change that did not touch the build recipe), so the push is
      # skipped. To publish a genuinely new image, bump IMAGE_REVISION.
      - name: Check whether the revision tag is already published
        id: tagcheck
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ steps.versions.outputs.repo_owner }}/taskflow-caddy-coraza"
          TAG="${{ steps.versions.outputs.image_tag }}"
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${IMAGE}:${TAG} is already published; skipping push. Bump IMAGE_REVISION to publish a new revision."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ steps.versions.outputs.repo_owner }}/taskflow-caddy-coraza
          tags: |
            type=raw,value=${{ steps.versions.outputs.image_tag }}
            type=raw,value=${{ steps.versions.outputs.caddy_version }}-coraza${{ steps.versions.outputs.coraza_version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=${{ steps.versions.outputs.caddy_version }}-coraza${{ steps.versions.outputs.coraza_version }}-

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: gitops/images/taskflow-caddy-coraza
          file: gitops/images/taskflow-caddy-coraza/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) && steps.tagcheck.outputs.exists != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE="ghcr.io/${{ steps.versions.outputs.repo_owner }}/taskflow-caddy-coraza"
          TAG="${{ steps.versions.outputs.image_tag }}"
          PUSHED="${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) && steps.tagcheck.outputs.exists != 'true' }}"

          echo "### Container Image Build Succeeded 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platform**: \`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pushed to GHCR**: \`${PUSHED}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$DIGEST" ]; then
            echo "- **Digest**: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### GitOps Manifest Reference" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`yaml" >> "$GITHUB_STEP_SUMMARY"
            echo "image: ${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
