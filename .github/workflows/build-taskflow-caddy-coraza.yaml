name: Build and Push taskflow-caddy-coraza

on:
  push:
    branches:
      - main
    paths:
      - 'gitops/images/taskflow-caddy-coraza/**'
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/images/taskflow-caddy-coraza/**'
      - '.github/workflows/build-taskflow-caddy-coraza.yaml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GitHub Container Registry (GHCR)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail

          CADDY_VER=$(grep '^ARG CADDY_VERSION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "')
          CORAZA_VER=$(grep '^ARG CORAZA_CADDY_VERSION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "' | sed 's/^v//')
          REV=$(grep '^ARG IMAGE_REVISION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "')
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          [[ "$CADDY_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Caddy version: $CADDY_VER" >&2; exit 1; }
          [[ "$CORAZA_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Coraza version: $CORAZA_VER" >&2; exit 1; }
          [[ "$REV" =~ ^r[0-9]+$ ]] || { echo "Invalid image revision: $REV" >&2; exit 1; }

          IMAGE_TAG="${CADDY_VER}-coraza${CORAZA_VER}-${REV}"

          echo "caddy_version=${CADDY_VER}" >> "$GITHUB_OUTPUT"
          echo "coraza_version=${CORAZA_VER}" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Extracted values:"
          echo "  Caddy: ${CADDY_VER}"
          echo "  Coraza: ${CORAZA_VER}"
          echo "  Revision: ${REV}"
          echo "  Target tag: ${IMAGE_TAG}"
          echo "  Repository owner: ${REPO_OWNER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ steps.versions.outputs.repo_owner }}/taskflow-caddy-coraza
          tags: |
            type=raw,value=${{ steps.versions.outputs.image_tag }}
            type=raw,value=${{ steps.versions.outputs.caddy_version }}-coraza${{ steps.versions.outputs.coraza_version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=${{ steps.versions.outputs.caddy_version }}-coraza${{ steps.versions.outputs.coraza_version }}-

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: gitops/images/taskflow-caddy-coraza
          file: gitops/images/taskflow-caddy-coraza/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE="ghcr.io/${{ steps.versions.outputs.repo_owner }}/taskflow-caddy-coraza"
          TAG="${{ steps.versions.outputs.image_tag }}"

          echo "### Container Image Build Succeeded 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platform**: \`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pushed to GHCR**: \`${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$DIGEST" ]; then
            echo "- **Digest**: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### GitOps Manifest Reference" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`yaml" >> "$GITHUB_STEP_SUMMARY"
            echo "image: ${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
