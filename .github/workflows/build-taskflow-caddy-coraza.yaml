name: Build and Push taskflow-caddy-coraza

on:
  push:
    branches:
      - main
    paths:
      - 'gitops/images/taskflow-caddy-coraza/**'
  pull_request:
    branches:
      - main
    paths:
      - 'gitops/images/taskflow-caddy-coraza/**'
      - '.github/workflows/build-taskflow-caddy-coraza.yaml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GitHub Container Registry (GHCR); only runs on main'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the revision guard compares the Dockerfile across the push
          persist-credentials: false # git is only used read-only here

      # A changed build recipe must ship under a new revision tag; otherwise the
      # "revision tag already published" check below would silently keep the old
      # image. Compare the Dockerfile across the pushed range (or the PR diff).
      - name: Require a new IMAGE_REVISION when the Dockerfile changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          DOCKERFILE=gitops/images/taskflow-caddy-coraza/Dockerfile
          base=""
          if [ "${EVENT_NAME:-}" = "pull_request" ] && [ -n "${PR_BASE:-}" ] && git rev-parse --verify --quiet "$PR_BASE" >/dev/null; then
            base="$PR_BASE"
          elif [ -n "${BEFORE:-}" ] && git rev-parse --verify --quiet "$BEFORE" >/dev/null; then
            base="$BEFORE"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            base="HEAD^"
          fi
          if [ -z "$base" ]; then
            echo "no base commit; skipping revision guard"
            exit 0
          fi
          if ! git diff --name-only "$base" HEAD -- "$DOCKERFILE" | grep -q .; then
            echo "Dockerfile unchanged since $base; no revision bump required"
            exit 0
          fi
          old=$(git show "$base:$DOCKERFILE" | grep '^ARG IMAGE_REVISION=' | cut -d= -f2 | tr -d ' "')
          new=$(grep '^ARG IMAGE_REVISION=' "$DOCKERFILE" | cut -d= -f2 | tr -d ' "')
          if [ "$old" = "$new" ]; then
            echo "::error::Dockerfile changed but IMAGE_REVISION is still '$new'; bump it so the image is republished"
            exit 1
          fi
          echo "recipe changed and IMAGE_REVISION bumped: $old -> $new"

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          set -euo pipefail

          CADDY_VER=$(grep '^ARG CADDY_VERSION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "')
          CORAZA_VER=$(grep '^ARG CORAZA_CADDY_VERSION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "' | sed 's/^v//')
          REV=$(grep '^ARG IMAGE_REVISION=' gitops/images/taskflow-caddy-coraza/Dockerfile | cut -d= -f2 | tr -d ' "')
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          [[ "$CADDY_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Caddy version: $CADDY_VER" >&2; exit 1; }
          [[ "$CORAZA_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Coraza version: $CORAZA_VER" >&2; exit 1; }
          [[ "$REV" =~ ^r[0-9]+$ ]] || { echo "Invalid image revision: $REV" >&2; exit 1; }

          IMAGE_TAG="${CADDY_VER}-coraza${CORAZA_VER}-${REV}"

          echo "caddy_version=${CADDY_VER}" >> "$GITHUB_OUTPUT"
          echo "coraza_version=${CORAZA_VER}" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Extracted values:"
          echo "  Caddy: ${CADDY_VER}"
          echo "  Coraza: ${CORAZA_VER}"
          echo "  Revision: ${REV}"
          echo "  Target tag: ${IMAGE_TAG}"
          echo "  Repository owner: ${REPO_OWNER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # PyYAML from the distribution's signed archive instead of an unpinned
      # PyPI download, and before any registry login: nothing that runs before
      # the tests can see the GHCR write credentials.
      - name: Ensure python3-yaml
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-yaml
          fi
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Build image for tests (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: gitops/images/taskflow-caddy-coraza
          file: gitops/images/taskflow-caddy-coraza/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: taskflow-caddy-coraza:test
          # Each image has its own cache scope: both workflows default to `buildkit`,
          # and a gha export replaces that scope's cache, so the abuseipdb-sync build
          # used to evict the xcaddy layers (and the other way round).
          cache-from: type=gha,scope=taskflow-caddy-coraza
          cache-to: type=gha,mode=max,scope=taskflow-caddy-coraza

      - name: Run identity and rate-limit tests
        env:
          TEST_IMAGE: taskflow-caddy-coraza:test
        run: gitops/images/taskflow-caddy-coraza/tests/run-tests.sh

      # Logged in only after the tests: the write token is never present while
      # test code runs.
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published revision tags are immutable: never silently overwrite one.
      # If the tag already exists the image was published before (e.g. a manual
      # publish, or a change that did not touch the build recipe), so the push is
      # skipped. To publish a genuinely new image, bump IMAGE_REVISION.
      - name: Check whether the revision tag is already published
        id: tagcheck
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ steps.versions.outputs.repo_owner }}/taskflow-caddy-coraza"
          TAG="${{ steps.versions.outputs.image_tag }}"
          # Only a definite "not found" means unpublished. Any other failure (auth,
          # network, registry outage) used to read as "not published" and let the
          # push overwrite an existing, supposedly immutable tag.
          if err=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" 2>&1 >/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${IMAGE}:${TAG} is already published; skipping push. Bump IMAGE_REVISION to publish a new revision."
          elif printf '%s\n' "$err" | grep -qF "${IMAGE}:${TAG}: not found"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::cannot tell whether ${IMAGE}:${TAG} is published: $err"
            exit 1
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ steps.versions.outputs.repo_owner }}/taskflow-caddy-coraza
          tags: |
            type=raw,value=${{ steps.versions.outputs.image_tag }}
            type=raw,value=${{ steps.versions.outputs.caddy_version }}-coraza${{ steps.versions.outputs.coraza_version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=${{ steps.versions.outputs.caddy_version }}-coraza${{ steps.versions.outputs.coraza_version }}-

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: gitops/images/taskflow-caddy-coraza
          file: gitops/images/taskflow-caddy-coraza/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.push) && steps.tagcheck.outputs.exists != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same builder as the test build above, so its layers are already local;
          # the test build exported them to the cache, no second export needed.
          cache-from: type=gha,scope=taskflow-caddy-coraza

      - name: Generate build summary
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE="ghcr.io/${{ steps.versions.outputs.repo_owner }}/taskflow-caddy-coraza"
          TAG="${{ steps.versions.outputs.image_tag }}"
          PUSHED="${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.push) && steps.tagcheck.outputs.exists != 'true' }}"

          echo "### Container Image Build Succeeded 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Platform**: \`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pushed to GHCR**: \`${PUSHED}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$DIGEST" ]; then
            echo "- **Digest**: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### GitOps Manifest Reference" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`yaml" >> "$GITHUB_STEP_SUMMARY"
            echo "image: ${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
