# SOPS Configuration File
# This file defines encryption rules for SOPS.
# To generate an age key: age-keygen -o key.txt
# To encrypt your secrets file: sops -e -i gitops/apps/taskflow/taskflow-secrets.yaml
#
# KEY ROTATION: the age public key below is the RECIPIENT. If you rotate it (new key.txt),
# re-wrap every *-secrets.yaml for it with the old key still loaded
# (sops updatekeys <file>; `sops -r` keeps the old recipients) and replace the
# flux-system/sops-age Secret, or Flux decryption fails. See docs/SOPS.md §4.
# Never commit key.txt (see .gitignore); only this public key belongs here.

creation_rules:
  - path_regex: .*-secrets\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: "age14tnw8z266962s0guenumuyqht55kt68grrx204wsle8u8p8ph9vscxnm22"
