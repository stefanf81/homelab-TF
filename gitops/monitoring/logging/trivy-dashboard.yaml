apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: taskflow-observability
data:
  trivy.json: |
    {
      "uid": "trivy-operator",
      "title": "Trivy Operator",
      "description": "Trivy vulnerability, compliance, and operator health metrics.",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {"from": "now-24h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Compliance Failing Checks",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum by (title) (trivy_cluster_compliance{status=\"Fail\"})", "legendFormat": "{{title}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Compliance Passing Checks",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "sum by (title) (trivy_cluster_compliance{status=\"Pass\"})", "legendFormat": "{{title}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Trivy Controller Reconcile Errors",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 8},
          "targets": [{"expr": "sum(controller_runtime_reconcile_errors_total{job=~\".*trivy.*\"})", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value"}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Reconciliations by Controller",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 8},
          "targets": [{"expr": "sum by (controller, result) (rate(controller_runtime_reconcile_total{job=~\".*trivy.*\"}[5m]))", "legendFormat": "{{controller}} / {{result}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "ops", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        }
      ]
    }
