apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: taskflow-observability
data:
  trivy.json: |
    {
      "uid": "trivy-operator",
      "title": "Trivy Operator",
      "description": "Trivy vulnerability, misconfiguration, RBAC, exposed secret, compliance, and operator health metrics. Based on Aqua's Grafana dashboard 17813.",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "1m",
      "time": {"from": "now-24h", "to": "now"},
      "templating": {"list": [{"name": "namespace", "label": "Namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"}, "query": "label_values(trivy_image_vulnerabilities, namespace)", "includeAll": true, "multi": true, "allValue": ".*", "refresh": 1}]},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Security Issues by Type",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 0},
          "targets": [
            {"expr": "sum(trivy_image_vulnerabilities{namespace=~\"$namespace\"})", "instant": true, "legendFormat": "Vulnerabilities", "refId": "A"},
            {"expr": "sum(trivy_resource_configaudits{namespace=~\"$namespace\"})", "instant": true, "legendFormat": "Misconfiguration", "refId": "B"},
            {"expr": "sum(trivy_role_rbacassessments{namespace=~\"$namespace\"}) + sum(trivy_clusterrole_clusterrbacassessments)", "instant": true, "legendFormat": "RBAC", "refId": "C"},
            {"expr": "sum(trivy_image_exposedsecrets{namespace=~\"$namespace\"})", "instant": true, "legendFormat": "Exposed Secrets", "refId": "D"},
            {"expr": "sum(trivy_resource_infraassessments{namespace=~\"$namespace\"})", "instant": true, "legendFormat": "Infrastructure", "refId": "E"}
          ],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name"}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Vulnerabilities by Severity",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "targets": [{"expr": "sum by (severity) (trivy_image_vulnerabilities{namespace=~\"$namespace\"})", "legendFormat": "{{severity}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Vulnerabilities by Namespace",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "targets": [{"expr": "topk(15, sum by (namespace) (trivy_image_vulnerabilities{namespace=~\"$namespace\"}))", "legendFormat": "{{namespace}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 4,
          "type": "table",
          "title": "Vulnerabilities by Image",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 14},
          "targets": [{"expr": "sum by (image_repository, image_tag, namespace, severity) (trivy_image_vulnerabilities{namespace=~\"$namespace\"})", "format": "table", "instant": true, "refId": "A"}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"image_repository": "Image", "image_tag": "Tag", "namespace": "Namespace", "severity": "Severity", "Value": "Findings"}}}],
          "fieldConfig": {"defaults": {"custom": {"align": "auto", "filterable": true}, "unit": "short"}, "overrides": []},
          "options": {"showHeader": true, "footer": {"show": false}, "frameIndex": 0}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Misconfiguration by Severity",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "targets": [{"expr": "sum by (severity) (trivy_resource_configaudits{namespace=~\"$namespace\"})", "legendFormat": "{{severity}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Misconfiguration by Namespace",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "targets": [{"expr": "topk(15, sum by (namespace) (trivy_resource_configaudits{namespace=~\"$namespace\"}))", "legendFormat": "{{namespace}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "RBAC Findings by Severity",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "targets": [{"expr": "sum by (severity) (trivy_role_rbacassessments{namespace=~\"$namespace\"}) + on (severity) sum by (severity) (trivy_clusterrole_clusterrbacassessments)", "legendFormat": "{{severity}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Exposed Secrets by Namespace",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "targets": [{"expr": "topk(15, sum by (namespace) (trivy_image_exposedsecrets{namespace=~\"$namespace\"}))", "legendFormat": "{{namespace}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Compliance Failing Checks",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 40},
          "targets": [{"expr": "sum by (title) (trivy_cluster_compliance{status=\"Fail\"})", "legendFormat": "{{title}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Compliance Passing Checks",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 40},
          "targets": [{"expr": "sum by (title) (trivy_cluster_compliance{status=\"Pass\"})", "legendFormat": "{{title}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Controller Reconcile Errors",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 48},
          "targets": [{"expr": "sum(controller_runtime_reconcile_errors_total{job=~\".*trivy.*\"})", "instant": true, "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "value", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Reconciliations by Controller",
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 48},
          "targets": [{"expr": "sum by (controller, result) (rate(controller_runtime_reconcile_total{job=~\".*trivy.*\"}[5m]))", "legendFormat": "{{controller}} / {{result}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "ops", "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        }
      ]
    }
