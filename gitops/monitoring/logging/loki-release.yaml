apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: taskflow-observability
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: 20.2.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
  install:
    createNamespace: false
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    deploymentMode: Monolithic

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
        bucketNames:
          chunks: chunks
          ruler: ruler
          admin: admin
      limits_config:
        retention_period: 720h
        allow_structured_metadata: true
        volume_enabled: true
        # Bound stream/query cardinality and per-stream ingest so a single noisy
        # producer cannot exhaust the monolithic instance. The effective stream
        # limit is the lower of this and max_global_streams_per_user (Loki default
        # 5000, unset here), so new streams are rejected above 5000. The Logging
        # pipeline dashboard draws that 5000; keep the two in sync.
        max_streams_per_user: 10000
        max_label_names_per_series: 30
        max_label_value_length: 2048
        max_entries_limit_per_query: 5000
        # The top-client-IP dashboard tables group by IP, so a distributed scan with
        # more than 5000 distinct addresses in the range failed the whole panel.
        max_query_series: 20000
        # Tenant-wide limits were left at Loki's default (4 MB/s, 6 MB burst), which
        # made the 15MB per-stream burst above unreachable.
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
        per_stream_rate_limit: 3MB
        per_stream_rate_limit_burst: 15MB
      # Results cache inside the Loki process (no memcached pod). Repeated range
      # queries from auto-refreshing dashboards reuse the cached split results.
      query_range:
        cache_results: true
        results_cache:
          cache:
            embedded_cache:
              enabled: true
              max_size_mb: 100
      compactor:
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      affinity: ~
      persistence:
        enabled: true
        storageClass: proxmox-csi
        accessModes:
          - ReadWriteOnce
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          # Steady working set ~65-80Mi; 7d peak 231Mi (2026-10-15).
          memory: 128Mi
        limits:
          # Memory stays the protective limit (~2.2x the measured peak). No CPU
          # limit: Loki splits a range query into parallel sub-queries, which a
          # CPU cap serialised.
          memory: 512Mi

    gateway:
      enabled: true
      replicas: 1
      # Disable chart default hard anti-affinity which blocks pods on single-node homelab clusters
      affinity: ~
      service:
        type: ClusterIP
      # Without requests the gateway pod was BestEffort (first eviction
      # candidate). 14d peaks (2026-10-22): nginx 16Mi, exporter 14Mi, ~1m CPU.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      metrics:
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi

    # loki-sc-rules sidecar. 14d peak 97Mi, CPU bursts to ~32m on resync.
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi

    # The chart enables large Memcached caches by default. They are unnecessary
    # for one local Loki replica and exceed the available node memory.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false

    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0
