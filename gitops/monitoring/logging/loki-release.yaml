apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: taskflow-observability
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: 18.13.5
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
  install:
    createNamespace: false
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    deploymentMode: Monolithic

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
        bucketNames:
          chunks: chunks
          ruler: ruler
          admin: admin
      limits_config:
        retention_period: 720h
        allow_structured_metadata: true
        volume_enabled: true
        # Bound stream/query cardinality and per-stream ingest so a single noisy
        # producer cannot exhaust the monolithic instance.
        max_streams_per_user: 10000
        max_label_names_per_series: 30
        max_label_value_length: 2048
        max_entries_limit_per_query: 5000
        max_query_series: 5000
        per_stream_rate_limit: 3MB
        per_stream_rate_limit_burst: 15MB
      compactor:
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      affinity: ~
      persistence:
        enabled: true
        storageClass: proxmox-csi
        accessModes:
          - ReadWriteOnce
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 768Mi

    gateway:
      enabled: true
      replicas: 1
      # Disable chart default hard anti-affinity which blocks pods on single-node homelab clusters
      affinity: ~
      service:
        type: ClusterIP

    # The chart enables large Memcached caches by default. They are unnecessary
    # for one local Loki replica and exceed the available node memory.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false

    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0

    minio:
      enabled: false
