apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-rate-limits-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: taskflow-rate-limits
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: taskflow-observability
data:
  taskflow-rate-limits.json: |
    {
      "uid": "taskflow-rate-limits",
      "title": "Taskflow Rate Limits",
      "description": "Caddy HTTP rate-limit activity (HTTP 429) for the Taskflow WAFs, derived from Caddy access logs in Loki. Counts show zero while WAF logs are arriving; breakdowns and recent requests are empty when no rejections occurred. Individual client IPs and URIs are parsed at query time and are not Loki labels.",
      "schemaVersion": 39,
      "version": 5,
      "refresh": "1m",
      "tags": ["taskflow", "security", "loki"],
      "links": [{"title": "WAF detections", "type": "link", "url": "/d/taskflow-waf", "keepTime": true, "includeVars": true}, {"title": "Access logs", "type": "link", "url": "/d/taskflow-access-logs", "keepTime": true, "includeVars": true}],
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Application",
            "type": "query",
            "datasource": {"type": "loki", "uid": "loki"},
            "query": "label_values({job=\"coraza-waf\", container=\"waf\"}, application)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "429 responses — 5 min",
          "description": "All HTTP 429 responses in Caddy access logs (last 5 minutes). Zero means no 429s while WAF logs are arriving; no data means no WAF logs in that window. The rejection-mix panel below separates rate-limiter 429s from other sources.",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 6},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} |= \"\\\"handled request\\\"\" |= \"\\\"status\\\":429\" | json status=\"status\" | __error__=\"\" | status=429 [5m])) or (0 * sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"}[5m])))", "queryType": "instant"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0, "noValue": "No WAF logs", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "429 responses — 1 h",
          "description": "All HTTP 429 responses in Caddy access logs (last hour). Zero means no 429s while WAF logs are arriving; no data means no WAF logs in that window. The rejection-mix panel below separates rate-limiter 429s from other sources.",
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 6},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} |= \"\\\"handled request\\\"\" |= \"\\\"status\\\":429\" | json status=\"status\" | __error__=\"\" | status=429 [1h])) or (0 * sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"}[1h])))", "queryType": "instant"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0, "noValue": "No WAF logs", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "429 responses — 24 h",
          "description": "All HTTP 429 responses in Caddy access logs (last 24 hours). Zero means no 429s while WAF logs are arriving; no data means no WAF logs in that window. The rejection-mix panel below separates rate-limiter 429s from other sources.",
          "gridPos": {"x": 16, "y": 0, "w": 8, "h": 6},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} |= \"\\\"handled request\\\"\" |= \"\\\"status\\\":429\" | json status=\"status\" | __error__=\"\" | status=429 [24h])) or (0 * sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"}[24h])))", "queryType": "instant"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0, "noValue": "No WAF logs", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Rate-limited responses",
          "description": "Caddy rate-limiter 429s per displayed interval (minimum 5 minutes), split by application. Zones are frontend general and backend api/authentication. These carry rate_limit_zone; upstream/application 429s appear as Other 429 in the rejection mix.",
          "gridPos": {"x": 0, "y": 6, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (application) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} |= \"\\\"handled request\\\"\" |= \"\\\"status\\\":429\" | json status=\"status\", rate_limit_zone=\"rate_limit_zone\" | __error__=\"\" | status=429 | rate_limit_zone!=\"\" [$__interval])) or on (application) (0 * sum by (application) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"}[$__interval])))", "legendFormat": "{{application}}"}],
          "interval": "5m",
          "maxDataPoints": 300,
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
