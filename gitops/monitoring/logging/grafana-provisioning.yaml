apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-waf-loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: taskflow-observability
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-waf-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: taskflow-waf
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: taskflow-observability
data:
  taskflow-waf.json: |
    {
      "uid": "taskflow-waf",
      "title": "Taskflow WAF",
      "description": "Coraza and Caddy telemetry for the Taskflow frontend and backend WAFs.",
      "schemaVersion": 39,
      "version": 5,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Application",
            "type": "query",
            "datasource": {"type": "loki", "uid": "loki"},
            "query": "label_values({job=\"coraza-waf\"}, application)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "WAF audit events",
          "description": "All Coraza audit records. Relevant HTTP responses can be audited without a matched WAF rule.",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (application) (count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"transaction\\\"\" [5m]))", "legendFormat": "{{application}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "WAF rule detections",
          "description": "Audit records that contain Coraza messages[] rule matches; excludes relevant responses without a WAF detection.",
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (application) (count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" [5m]))", "legendFormat": "{{application}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 3,
          "type": "bargauge",
          "title": "Top triggered CRS rules",
          "description": "The rule_id label is added by Alloy for newly ingested Coraza audit records.",
          "gridPos": {"x": 16, "y": 0, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (rule_id) (count_over_time({job=\"coraza-waf\", application=~\"$application\", rule_id=~\".+\"}[${__range}])) )", "legendFormat": "{{rule_id}}", "instant": true}],
          "options": {"orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showUnfilled": false},
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}}, "overrides": []}
        },
        {
          "id": 4,
          "type": "piechart",
          "title": "Detection categories",
          "gridPos": {"x": 0, "y": 8, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", application=~\"$application\", rule_id=~\"94[0-9]{4}\"}[$__range]))", "legendFormat": "SQL injection", "instant": true},
            {"refId": "B", "expr": "sum(count_over_time({job=\"coraza-waf\", application=~\"$application\", rule_id=~\"941[0-9]{3}\"}[$__range]))", "legendFormat": "Cross-site scripting", "instant": true},
            {"refId": "C", "expr": "sum(count_over_time({job=\"coraza-waf\", application=~\"$application\", rule_id=~\"93[0-1][0-9]{3}\"}[$__range]))", "legendFormat": "Path traversal", "instant": true},
            {"refId": "D", "expr": "sum(count_over_time({job=\"coraza-waf\", application=~\"$application\", rule_id=~\"93[2-4][0-9]{3}\"}[$__range]))", "legendFormat": "Command injection", "instant": true}
          ],
          "options": {"displayLabels": ["name", "percent"], "legend": {"displayMode": "list", "placement": "right", "showLegend": true}, "pieType": "donut", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "tooltip": {"mode": "single", "sort": "none"}},
          "fieldConfig": {
            "defaults": {"unit": "short"},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Value #A"}, "properties": [{"id": "displayName", "value": "SQL injection"}]},
              {"matcher": {"id": "byName", "options": "Value #B"}, "properties": [{"id": "displayName", "value": "Cross-site scripting"}]},
              {"matcher": {"id": "byName", "options": "Value #C"}, "properties": [{"id": "displayName", "value": "Path traversal"}]},
              {"matcher": {"id": "byName", "options": "Value #D"}, "properties": [{"id": "displayName", "value": "Command injection"}]}
            ]
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Detections by HTTP method",
          "gridPos": {"x": 8, "y": 8, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (method) (count_over_time({job=\"coraza-waf\", application=~\"$application\", method=~\".+\"} |= \"\\\"messages\\\"\" [5m]))", "legendFormat": "{{method}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 15,
          "type": "piechart",
          "title": "Detections by paranoia level",
          "description": "OWASP CRS rule matches grouped by paranoia level tag. PL2+ rules are detections that would have been ignored on PL1.",
          "gridPos": {"x": 16, "y": 8, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" |= \"paranoia-level/1\" [$__range]))", "legendFormat": "PL 1 (Standard)", "instant": true},
            {"refId": "B", "expr": "sum(count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" |= \"paranoia-level/2\" [$__range]))", "legendFormat": "PL 2 (Elevated)", "instant": true},
            {"refId": "C", "expr": "sum(count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" |= \"paranoia-level/3\" [$__range]))", "legendFormat": "PL 3 (High)", "instant": true},
            {"refId": "D", "expr": "sum(count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" |= \"paranoia-level/4\" [$__range]))", "legendFormat": "PL 4 (Extreme)", "instant": true}
          ],
          "options": {"displayLabels": ["name", "percent"], "legend": {"displayMode": "list", "placement": "right", "showLegend": true}, "pieType": "donut", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "tooltip": {"mode": "single", "sort": "none"}},
          "fieldConfig": {
            "defaults": {"unit": "short"},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Value #A"}, "properties": [{"id": "displayName", "value": "PL 1 (Standard)"}]},
              {"matcher": {"id": "byName", "options": "Value #B"}, "properties": [{"id": "displayName", "value": "PL 2 (Elevated)"}]},
              {"matcher": {"id": "byName", "options": "Value #C"}, "properties": [{"id": "displayName", "value": "PL 3 (High)"}]},
              {"matcher": {"id": "byName", "options": "Value #D"}, "properties": [{"id": "displayName", "value": "PL 4 (Extreme)"}]}
            ]
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Top source IPs",
          "description": "Client IP is parsed at query time, so it is not indexed as a Loki label.",
          "gridPos": {"x": 0, "y": 16, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (transaction_client_ip) (count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" | json [$__range])))", "instant": true}],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 7,
          "type": "logs",
          "title": "Recent WAF detections",
          "description": "Formatted audit records that contain a matched Coraza rule with description. Open a row for the unmodified JSON evidence.",
          "gridPos": {"x": 8, "y": 16, "w": 16, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "{job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" | json | regexp `\\[msg \\\\\"(?P<rule_msg>[^\\\\\"]+)\\\\\"\\]` | line_format `{{.transaction_request_method}} {{.transaction_request_uri}} [rule={{.rule_id}}: {{.rule_msg}}] ip={{.transaction_client_ip}}`"}],
          "options": {"showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLines": true, "prettifyLogMessage": false, "enableLogDetails": true}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "SQL injection family detections",
          "gridPos": {"x": 0, "y": 24, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (application) (count_over_time({job=\"coraza-waf\", application=~\"$application\", rule_id=~\"94[0-9]{4}\"}[5m]))", "legendFormat": "{{application}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "XSS, command injection, and path traversal",
          "gridPos": {"x": 12, "y": 24, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (application) (count_over_time({job=\"coraza-waf\", application=~\"$application\", rule_id=~\"941[0-9]{3}|93[0-4][0-9]{3}\"}[5m]))", "legendFormat": "{{application}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 16,
          "type": "stat",
          "title": "WAF block rate",
          "description": "Percentage of detected threats that resulted in an active block (403 Forbidden).",
          "gridPos": {"x": 0, "y": 32, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "(sum(count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"is_interrupted\\\":true\" [$__range])) / sum(count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" [$__range]))) * 100"}],
          "fieldConfig": {"defaults": {"unit": "percent", "color": {"mode": "thresholds"}}, "overrides": []}
        },
        {
          "id": 17,
          "type": "table",
          "title": "Top targeted URIs",
          "description": "Request URIs triggering the highest volume of WAF rule matches.",
          "gridPos": {"x": 8, "y": 32, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (transaction_request_uri) (count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" | json [$__range])))", "instant": true}],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 18,
          "type": "table",
          "title": "Top attacking user agents",
          "description": "User-Agents sending traffic that triggers WAF rules.",
          "gridPos": {"x": 16, "y": 32, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (user_agent) (count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"messages\\\"\" | json | user_agent := transaction_request_headers_user_agent [$__range])))", "instant": true}],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "WAF inspection latency (p95)",
          "description": "95th percentile Coraza rule processing duration in milliseconds extracted from audit log stopwatch metadata.",
          "gridPos": {"x": 0, "y": 40, "w": 24, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "quantile_over_time(0.95, {job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"stopwatch\\\"\" | regexp \"combined=(?P<waf_latency_ns>[0-9]+)\" | unwrap waf_latency_ns / 1000000 [$__interval])"}],
          "fieldConfig": {"defaults": {"unit": "ms"}, "overrides": []}
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "WAF pod CPU",
          "gridPos": {"x": 0, "y": 48, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"taskflow\", pod=~\"taskflow-(frontend|backend)-waf-.*\", container=\"waf\"}[5m]))", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []}
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "WAF pod memory",
          "gridPos": {"x": 12, "y": 48, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"taskflow\", pod=~\"taskflow-(frontend|backend)-waf-.*\", container=\"waf\"})", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "WAF pod restarts",
          "gridPos": {"x": 0, "y": 56, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"taskflow\", pod=~\"taskflow-(frontend|backend)-waf-.*\"}[1h]))", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Loki ingester append timeouts",
          "gridPos": {"x": 12, "y": 56, "w": 6, "h": 8},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "sum(rate(loki_distributor_ingester_append_timeouts_total[5m]))"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}}, "overrides": []}
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Alloy forwarding errors",
          "gridPos": {"x": 18, "y": 56, "w": 6, "h": 8},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "sum(rate(loki_write_dropped_bytes_total[5m]))"}],
          "fieldConfig": {"defaults": {"unit": "Bps", "color": {"mode": "thresholds"}}, "overrides": []}
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-access-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: taskflow-access-logs
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: taskflow-observability
data:
  taskflow-access-logs.json: |
    {
      "uid": "taskflow-access-logs",
      "title": "Taskflow Access Logs",
      "description": "Caddy access-log activity for normal Taskflow traffic. Coraza audit records and WAF detections are shown separately on the Taskflow WAF dashboard.",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Application",
            "type": "query",
            "datasource": {"type": "loki", "uid": "loki"},
            "query": "label_values({job=\"coraza-waf\", container=\"waf\"}, application)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {"type": "loki", "uid": "loki"},
            "query": "label_values({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"}, pod)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Scope",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 3},
          "options": {"mode": "markdown", "content": "Shows Caddy access logs from the `waf` container and excludes `/waf-healthz` probes. URIs and credential headers are redacted before Loki ingestion. `client_ip` is Caddy's resolved visitor address from `X-Forwarded-For`; it is parsed at query time and is not a Loki label."}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Requests by application",
          "gridPos": {"x": 0, "y": 3, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (application) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\", pod=~\"$pod\"} | json | msg=\"handled request\" | request_uri != \"/waf-healthz\" | request_uri=~\".+\" [5m]))", "legendFormat": "{{application}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Responses by status",
          "gridPos": {"x": 12, "y": 3, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (status) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\", pod=~\"$pod\"} | json | msg=\"handled request\" | request_uri != \"/waf-healthz\" | status=~\".+\" [5m]))", "legendFormat": "{{status}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Requests by HTTP method",
          "gridPos": {"x": 0, "y": 11, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (request_method) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\", pod=~\"$pod\"} | json | msg=\"handled request\" | request_uri != \"/waf-healthz\" | request_method=~\".+\" [5m]))", "legendFormat": "{{request_method}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 5,
          "type": "bargauge",
          "title": "Top request URIs",
          "description": "URIs are sanitized by Caddy before storage. This is a query-time aggregation, so URI values are not Loki labels.",
          "gridPos": {"x": 12, "y": 11, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (request_uri) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\", pod=~\"$pod\"} | json | msg=\"handled request\" | request_uri != \"/waf-healthz\" | request_uri=~\".+\" [$__range])))", "legendFormat": "{{request_uri}}", "instant": true}],
          "options": {"orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showUnfilled": false},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 6,
          "type": "table",
          "title": "Request outcomes",
          "gridPos": {"x": 0, "y": 19, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (application, status) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\", pod=~\"$pod\"} | json | msg=\"handled request\" | request_uri != \"/waf-healthz\" | status=~\".+\" [$__range]))", "instant": true}],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 7,
          "type": "table",
          "title": "Top client IPs",
          "description": "Resolved visitor IPs from Caddy access logs. Parsed at query time to avoid a high-cardinality Loki label.",
          "gridPos": {"x": 8, "y": 19, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (client_ip) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\", pod=~\"$pod\"} | json | msg=\"handled request\" | __error__=\"\" | request_uri != \"/waf-healthz\" | client_ip != \"\" [$__range])))", "instant": true}],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Recent access logs",
          "gridPos": {"x": 16, "y": 19, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "{job=\"coraza-waf\", container=\"waf\", application=~\"$application\", pod=~\"$pod\"} | json | msg=\"handled request\" | __error__=\"\" | request_uri != \"/waf-healthz\" | request_uri=~\".+\" | line_format `{{.status}} {{.request_method}} {{.request_uri}} ip={{.client_ip}} duration={{.duration}}s`"}],
          "options": {"showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLines": true, "prettifyLogMessage": false, "enableLogDetails": true}
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-rate-limits-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: taskflow-rate-limits
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: taskflow-observability
data:
  taskflow-rate-limits.json: |
    {
      "uid": "taskflow-rate-limits",
      "title": "Taskflow Rate Limits",
      "description": "Caddy HTTP rate-limit activity (HTTP 429) for the Taskflow WAFs, derived from Caddy access logs in Loki. Individual client IPs and URIs are parsed at query time and are not Loki labels.",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Application",
            "type": "query",
            "datasource": {"type": "loki", "uid": "loki"},
            "query": "label_values({job=\"coraza-waf\", container=\"waf\"}, application)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "429 responses — 5 min",
          "description": "All HTTP 429 responses in Caddy access logs (last 5 minutes). The rejection-mix panel below separates rate-limiter 429s from other sources.",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 6},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 [5m]))"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "429 responses — 1 h",
          "description": "All HTTP 429 responses in Caddy access logs (last hour).",
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 6},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 [1h]))"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "429 responses — 24 h",
          "description": "All HTTP 429 responses in Caddy access logs (last 24 hours).",
          "gridPos": {"x": 16, "y": 0, "w": 8, "h": 6},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 [24h]))"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Rate-limited responses over time",
          "description": "Caddy rate-limiter 429s per 5 minutes, split by application (frontend `general` vs backend `api`). These carry the rate_limit_zone field; upstream/application 429s appear as \"Other 429\" on the rejection-mix panel.",
          "gridPos": {"x": 0, "y": 6, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (application) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 | rate_limit_zone=~\".+\" [5m]))", "legendFormat": "{{application}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Rejection mix: Coraza vs rate limit vs other 429",
          "description": "Coraza blocks come from the audit field transaction.is_interrupted (not HTTP 403: applications can return 403 themselves). Rate-limiter rejections are access-log 429s carrying the rate_limit_zone field; other 429s come from upstream/application code.",
          "gridPos": {"x": 12, "y": 6, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", application=~\"$application\"} |= \"\\\"is_interrupted\\\":true\" [5m]))", "legendFormat": "Coraza block (audit)"},
            {"refId": "B", "expr": "sum by (rate_limit_zone) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 | rate_limit_zone=~\".+\" [5m]))", "legendFormat": "Rate limit ({{rate_limit_zone}})"},
            {"refId": "C", "expr": "sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 | rate_limit_zone=\"\" [5m]))", "legendFormat": "Other 429 (upstream/app)"}
          ],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Caddy request rate",
          "description": "Requests per second handled by both WAFs, from access logs only (msg=handled request), excluding /waf-healthz probes.",
          "gridPos": {"x": 0, "y": 14, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (application) (rate({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | request_uri != \"/waf-healthz\" [5m]))", "legendFormat": "{{application}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "id": 7,
          "type": "table",
          "title": "Top paths receiving 429",
          "description": "Request paths (query string stripped by a line regexp) most often rejected. Aggregated at query time; paths are not Loki labels.",
          "gridPos": {"x": 12, "y": 14, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (request_path) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 | regexp \"\\\"uri\\\":\\\"(?P<request_path>[^?\\\"]+)\" [${__range}])))", "instant": true}],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 8,
          "type": "table",
          "title": "Top client IPs receiving 429",
          "description": "Caddy's resolved visitor IP. Parsed at query time to avoid a high-cardinality Loki label; no per-IP Prometheus time series exist.",
          "gridPos": {"x": 0, "y": 22, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (client_ip) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 | client_ip != \"\" [${__range}])))", "instant": true}],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 9,
          "type": "table",
          "title": "Top hosts receiving 429",
          "description": "Currently all public TaskFlow traffic uses www.jokelab.dev; the panel is kept for future hostnames on this Gateway.",
          "gridPos": {"x": 8, "y": 22, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (request_host) (count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 | request_host != \"\" [${__range}])))", "instant": true}],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Recent rate-limited requests",
          "description": "Access-log lines for Caddy rate-limiter rejections (rate_limit_zone set), including the resolved client IP and the Retry-After response header. Upstream/application 429s are excluded.",
          "gridPos": {"x": 16, "y": 22, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "{job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | status=429 | rate_limit_zone=~\".+\" | line_format `{{.status}} {{.request_method}} {{.request_uri}} ip={{.client_ip}} zone={{.rate_limit_zone}} duration={{.duration}}s`"}],
          "options": {"showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLines": true, "prettifyLogMessage": false, "enableLogDetails": true}
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Identity drift — client_ip in pod CIDR",
          "description": "Requests resolving into the pod CIDR (probes excluded). Legitimate in-cluster Gateway clients appear here occasionally; a sustained value that is not a known internal client means the trusted cilium_host peer changed, so per-client buckets are shared — re-run runbook Stage 0 and update trusted_proxies.",
          "gridPos": {"x": 0, "y": 30, "w": 8, "h": 6},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum(count_over_time({job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | request_uri != \"/waf-healthz\" | client_ip=~\"10\\.42\\..*\" [5m]))"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 12,
          "type": "logs",
          "title": "Pod-CIDR identity samples (client_ip in pod CIDR)",
          "description": "Access-log samples whose resolved client_ip is in the pod CIDR: known in-cluster clients, or the trusted-peer fallback after a node change.",
          "gridPos": {"x": 8, "y": 30, "w": 16, "h": 6},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "{job=\"coraza-waf\", container=\"waf\", application=~\"$application\"} | json | __error__=\"\" | msg=\"handled request\" | request_uri != \"/waf-healthz\" | client_ip=~\"10\\.42\\..*\" | line_format `{{.status}} {{.request_method}} {{.request_uri}} ip={{.client_ip}} zone={{.rate_limit_zone}}`"}],
          "options": {"showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLines": true, "prettifyLogMessage": false, "enableLogDetails": true}
        }
      ]
    }
