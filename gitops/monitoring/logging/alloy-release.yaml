apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: taskflow-observability
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  install:
    createNamespace: false
  values:
    controller:
      type: deployment
      replicas: 1
    serviceAccount:
      create: true
      name: grafana-alloy
    rbac:
      create: true
      namespaces:
        - taskflow
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/log"]
          verbs: ["get", "list", "watch"]
      clusterRules: []
    alloy:
      configMap:
        create: true
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
            namespaces {
              names = ["taskflow"]
            }
          }

          discovery.relabel "taskflow_wafs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
              regex = "waf"
              action = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"]
              regex = "taskflow"
              action = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_protects"]
              target_label = "application"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label = "pod"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label = "container"
              action = "replace"
            }

            rule {
              target_label = "job"
              replacement = "coraza-waf"
              action = "replace"
            }
          }

           loki.source.kubernetes "taskflow_wafs" {
             targets = discovery.relabel.taskflow_wafs.output
             forward_to = [loki.process.coraza_audit.receiver]
           }

           loki.process "coraza_audit" {
             forward_to = [loki.write.local.receiver]

             // Caddy access logs and Coraza audit records share stdout. Process only
             // audit records so Caddy's unrelated JSON fields never become labels.
             stage.match {
               selector = "{job=\"coraza-waf\"} |= \"\\\"transaction\\\"\""

               stage.json {
                 expressions = {
                   method = "transaction.request.method",
                 }
               }

                // Coraza stores matches in messages[].error_message; Loki skips arrays,
                // so extract the first matching CRS rule ID from the raw record.
                stage.regex {
                  expression = "\"messages\":\\[.*?\\[id [^0-9]*(?P<rule_id>[0-9]+)"
                }

               // Both values are bounded: HTTP methods and installed CRS rule IDs.
               // Request URIs and client IPs remain in the log body to avoid
               // high-cardinality Loki labels.
               stage.labels {
                 values = {
                   method  = "method",
                   rule_id = "rule_id",
                 }
               }
             }
           }

          loki.write "local" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            }

            external_labels = {
              cluster = "homelab",
              source = "coraza",
            }
          }
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 250m
          memory: 256Mi
