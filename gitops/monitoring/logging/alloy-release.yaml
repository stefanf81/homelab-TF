apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: taskflow-observability
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.14.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  install:
    createNamespace: false
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    # Use strategic merge to remove old rollingUpdate defaults on migration.
    serverSideApply: disabled
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    controller:
      type: deployment
      replicas: 1
      # RWO allows two pods on the same node. Never overlap writers to this
      # PVC's WAL/position files during a pod-template or image upgrade.
      updateStrategy:
        type: Recreate
      volumes:
        extra:
          - name: alloy-data
            persistentVolumeClaim:
              claimName: alloy-data
          # Hubble flow-log export written by cilium-agent on the node
          # (hubble.export.static). Read-only; Alloy only tails the file.
          - name: hubble-flows
            hostPath:
              path: /var/run/cilium/hubble
              type: DirectoryOrCreate
    serviceAccount:
      create: true
      name: grafana-alloy
    rbac:
      create: true
      namespaces:
        - taskflow
        - abuseipdb
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/log"]
          verbs: ["get", "list", "watch"]
      clusterRules: []
    alloy:
      # Persist the position database so a restart neither re-tails old lines nor
      # skips new ones (default is /tmp/alloy, which is lost on every restart).
      storagePath: /var/lib/alloy-data
      # Alloy v1.21 gates the loki.write WAL behind the experimental stability
      # level. Keep the WAL: it buffers logs across Loki outages.
      stabilityLevel: experimental
      mounts:
        extra:
          - name: alloy-data
            mountPath: /var/lib/alloy-data
          - name: hubble-flows
            mountPath: /var/run/cilium/hubble
            readOnly: true
      configMap:
        create: true
        # The chart renders `content` through Helm's tpl (ConfigMap and checksum), so
        # it must not contain a double opening brace: Helm would evaluate it and the release fails
        # to render. The Alloy metrics test refuses a config that does.
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
            namespaces {
              names = ["taskflow"]
            }
          }

          // ---- WAF containers: Coraza audit records + Caddy access logs ---------
          discovery.relabel "taskflow_wafs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
              regex = "waf"
              action = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"]
              regex = "taskflow"
              action = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_protects"]
              target_label = "application"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label = "pod"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label = "container"
              action = "replace"
            }

            rule {
              target_label = "job"
              replacement = "coraza-waf"
              action = "replace"
            }
          }

          // ---- Spring Boot backend: dedicated pipeline for multiline handling ---
          discovery.relabel "taskflow_backend" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex = "taskflow-backend"
              action = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label = "pod"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label = "container"
              action = "replace"
            }

            rule {
              target_label = "job"
              replacement = "taskflow-app"
              action = "replace"
            }
          }

          // ---- All other TaskFlow workloads (frontend, PostgreSQL, Redis, ...) --
          discovery.relabel "taskflow_apps" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"]
              regex = "taskflow"
              action = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
              regex = "waf"
              action = "drop"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex = "taskflow-backend"
              action = "drop"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label = "application"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label = "pod"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label = "container"
              action = "replace"
            }

            rule {
              target_label = "job"
              replacement = "taskflow-app"
              action = "replace"
            }
          }

          loki.source.kubernetes "taskflow_wafs" {
            targets = discovery.relabel.taskflow_wafs.output
            forward_to = [
              loki.process.coraza_audit.receiver,
              loki.process.waf_requests.receiver,
              loki.process.waf_audit.receiver,
              loki.process.waf_rules.receiver,
            ]
          }

          loki.source.kubernetes "taskflow_backend" {
            targets = discovery.relabel.taskflow_backend.output
            forward_to = [loki.process.taskflow_backend.receiver]
          }

          loki.source.kubernetes "taskflow_apps" {
            targets = discovery.relabel.taskflow_apps.output
            forward_to = [loki.process.taskflow_apps.receiver]
          }

          // ---- AbuseIPDB synchronizer controller logs ----------------------------
          discovery.kubernetes "abuseipdb" {
            role = "pod"
            namespaces {
              names = ["abuseipdb"]
            }
          }

          discovery.relabel "abuseipdb_sync" {
            targets = discovery.kubernetes.abuseipdb.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex = "abuseipdb-sync"
              action = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label = "namespace"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label = "pod"
              action = "replace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label = "container"
              action = "replace"
            }

            rule {
              target_label = "job"
              replacement = "abuseipdb-sync"
              action = "replace"
            }
          }

          loki.source.kubernetes "abuseipdb_sync" {
            targets = discovery.relabel.abuseipdb_sync.output
            forward_to = [loki.process.abuseipdb_sync.receiver]
          }

          loki.process "abuseipdb_sync" {
            forward_to = [loki.write.local.receiver]

            // Structured JSON logs. Only bounded labels are added; feed contents
            // and individual addresses stay in the log body to avoid cardinality.
            stage.static_labels {
              values = { source = "abuseipdb-sync" }
            }
          }

          // ---- Cilium Hubble flow logs (dropped/error flows only) ----------------
          // Written by cilium-agent (hubble.export.static) to the node and mounted
          // read-only into Alloy. Bounded labels only; the flow JSON body carries
          // source IPs, ports and drop reasons, parsed at query time in Grafana.
          local.file_match "hubble_flows" {
            path_targets = [{
              __path__ = "/var/run/cilium/hubble/events.log",
              job      = "hubble-flows",
              cluster  = "homelab",
            }]
          }

          loki.source.file "hubble_flows" {
            targets    = local.file_match.hubble_flows.targets
            forward_to = [loki.process.hubble_flows.receiver]
          }

          loki.process "hubble_flows" {
            forward_to = [loki.write.local.receiver]

            stage.static_labels {
              values = { source = "cilium" }
            }
          }

          loki.process "coraza_audit" {
            forward_to = [loki.write.local.receiver]

            stage.static_labels {
              values = { source = "coraza" }
            }

            // Caddy access logs and Coraza audit records share stdout. Process only
            // audit records so Caddy's unrelated JSON fields never become labels.
            stage.match {
              selector = "{job=\"coraza-waf\"} |= \"\\\"transaction\\\":{\""

              // Coraza writes audit JSON straight to stdout (there is no sidecar
              // redactor anymore), so credential redaction happens here.
              // stage.replace replaces CAPTURE GROUPS, not the whole regexp.
              // Capture the entire sensitive header value array, not its key.
              // JSON strings may contain escaped quotes, backslashes and ']'.
              // Also remove response Set-Cookie (audit part F).
              stage.replace {
                expression = `(?i)"(?:authorization|proxy-authorization|cookie|set-cookie)"\s*:\s*(\[\s*(?:"(?:\\.|[^"\\])*"\s*(?:,\s*"(?:\\.|[^"\\])*"\s*)*)?\])`
                replace    = "[\"REDACTED\"]"
              }

              // 2) secrets passed as query parameters
              stage.replace {
                expression = `(?i)(?:access_token|refresh_token|id_token|code|state|password|secret)=((?:\\.|[^"\\&\s])+)`
                replace    = "REDACTED"
              }

              stage.json {
                // Fail closed rather than forwarding malformed audit evidence
                // that cannot be safely parsed after redaction.
                drop_malformed = true
                expressions = {
                  method = "transaction.request.method",
                }
              }

              stage.regex {
                source     = "method"
                expression = "^(?P<known_method>GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$"
              }

              // Coraza stores matches in messages[].error_message; Loki skips arrays,
              // so extract the first matching CRS rule ID from the raw record.
              stage.regex {
                expression = "\"messages\":\\[.*?\\[id [^0-9]*(?P<rule_id>[0-9]+)"
              }

              // Only normalised methods and installed CRS rule IDs become labels.
              // Request URIs and client IPs remain in the log body to avoid
              // high-cardinality Loki labels.
              stage.labels {
                values = {
                  method  = "known_method",
                  rule_id = "rule_id",
                }
              }

              stage.match {
                selector = "{job=\"coraza-waf\", method=\"\"}"
                stage.static_labels {
                  values = { method = "OTHER" }
                }
              }
            }
          }

          loki.process "taskflow_backend" {
            forward_to = [loki.write.local.receiver]

            // Reassemble Java stack traces. Multiline must be the first processing
            // stage; every default Spring Boot log line starts with an ISO timestamp.
            stage.multiline {
              firstline     = "^\\d{4}-\\d{2}-\\d{2}"
              max_wait_time = "2s"
              max_lines     = 256
            }

            stage.static_labels {
              values = { source = "app" }
            }
          }

          loki.process "taskflow_apps" {
            forward_to = [loki.write.local.receiver]

            stage.static_labels {
              values = { source = "app" }
            }
          }

          // ---- WAF logs -> metrics -------------------------------------------------------
          // Dashboards read these instead of scanning every access/audit line in Loki. The
          // components below receive a copy of the WAF stream and are never forwarded to
          // Loki, so they cannot change what is stored. Alloy turns every entry label into a
          // metric label, so each match first keeps only `application` and then promotes
          // the few bounded values it wants (status, normalised method, zone, rule ID).
          // Client IPs, URIs and pods never become metric labels. Custom metrics are
          // exposed by Alloy as loki_process_custom_<name>; max_idle_duration is long so a
          // quiet series is not recreated from zero (which would hide its first event).

          // Caddy access records, probes excluded.
          loki.process "waf_requests" {
            forward_to = []

            stage.match {
              selector = "{job=\"coraza-waf\"} |= \"\\\"msg\\\":\\\"handled request\\\"\""

              stage.label_keep {
                values = ["application"]
              }

              stage.json {
                expressions = {
                  status   = "status",
                  method   = "request.method",
                  uri      = "request.uri",
                  duration = "duration",
                }
              }

              stage.drop {
                source = "uri"
                value  = "/waf-healthz"
              }

              // The method is client controlled: only the usual methods become label
              // values, everything else is labelled OTHER below, so a scanner cannot
              // create unbounded series. No Go template (stage.template) here: the
              // Alloy chart renders this whole config through Helm's tpl, and any
              // double opening brace breaks the release (the Alloy test rejects it).
              stage.regex {
                source     = "method"
                expression = "^(?P<known_method>GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$"
              }

              // Histogram first, while only `application` is a label.
              stage.metrics {
                metric.histogram {
                  name              = "taskflow_waf_request_duration_seconds"
                  description       = "Caddy request duration in the Taskflow WAFs, probes excluded."
                  source            = "duration"
                  buckets           = [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
                  max_idle_duration = "168h"
                }
              }

              stage.labels {
                values = {
                  status = "",
                  method = "known_method",
                }
              }

              stage.match {
                selector = "{application=~\".+\", method=\"\"}"

                stage.static_labels {
                  values = {
                    method = "OTHER",
                  }
                }
              }

              stage.metrics {
                metric.counter {
                  name              = "taskflow_waf_requests_total"
                  description       = "Caddy requests handled by the Taskflow WAFs, probes excluded, by status and normalised method."
                  match_all         = true
                  action            = "inc"
                  max_idle_duration = "168h"
                }
              }

              // Requests rejected by the Caddy rate limiter, from the same parse.
              // Caddy logs "rate_limit_zone":null for requests that were not limited
              // (log_append of an unset placeholder) and probes carry no field.
              // stage.drop cannot drop a null or missing value, so only lines whose
              // zone is a non-empty string enter this match. It runs after the
              // request counter, so dropping status and method here does not affect it.
              stage.match {
                selector = "{application=~\".+\"} |~ \"\\\"rate_limit_zone\\\":\\\"[^\\\"]+\\\"\""

                stage.json {
                  expressions = {
                    zone = "rate_limit_zone",
                  }
                }

                stage.label_keep {
                  values = ["application"]
                }

                stage.labels {
                  values = {
                    zone = "",
                  }
                }

                stage.metrics {
                  metric.counter {
                    name              = "taskflow_waf_rate_limited_total"
                    description       = "Requests rejected by the Caddy rate limiter, by rejecting zone."
                    match_all         = true
                    action            = "inc"
                    max_idle_duration = "168h"
                  }
                }
              }
            }
          }

          // Coraza audit records (RelevantOnly auditing: matched rules and response criteria).
          loki.process "waf_audit" {
            forward_to = []

            stage.match {
              selector = "{job=\"coraza-waf\"} |= \"\\\"transaction\\\":{\""

              stage.label_keep {
                values = ["application"]
              }

              stage.json {
                drop_malformed = true
                expressions = {
                  interrupted = "transaction.is_interrupted",
                }
              }

              stage.labels {
                values = {
                  interrupted = "",
                }
              }

              stage.metrics {
                metric.counter {
                  name              = "taskflow_waf_audit_records_total"
                  description       = "Coraza audit records, by whether the transaction was interrupted."
                  match_all         = true
                  action            = "inc"
                  max_idle_duration = "168h"
                }
              }

              // Records that carry rule matches (what the dashboards call detections).
              stage.match {
                selector = "{application=~\".+\"} |= \"\\\"messages\\\":[\""

                stage.metrics {
                  metric.counter {
                    name              = "taskflow_waf_detection_records_total"
                    description       = "Coraza audit records containing rule matches, by whether the transaction was interrupted."
                    match_all         = true
                    action            = "inc"
                    max_idle_duration = "168h"
                  }
                }
              }
            }
          }

          // First matching CRS rule of every detection record (a bounded set of rule IDs).
          loki.process "waf_rules" {
            forward_to = []

            stage.match {
              selector = "{job=\"coraza-waf\"} |= \"\\\"messages\\\":[\""

              stage.label_keep {
                values = ["application"]
              }

              stage.regex {
                expression = "\"messages\":\\[.*?\\[id [^0-9]*(?P<rule_id>[0-9]+)"
              }

              stage.labels {
                values = {
                  rule_id = "",
                }
              }

              stage.metrics {
                metric.counter {
                  name              = "taskflow_waf_first_rule_total"
                  description       = "First matching CRS rule of Coraza detection records."
                  source            = "rule_id"
                  action            = "inc"
                  max_idle_duration = "168h"
                }
              }
            }
          }

          loki.write "local" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            }

            // Entries go to a write-ahead log on the alloy-data PVC first, so a slow or
            // unreachable Loki no longer back-pressures the sources: the WAF metrics
            // components share the WAF source's synchronous fan-out and used to stall
            // once the in-memory queue filled. Buffered entries are sent when Loki is
            // back. Segments older than 30m are eventually deleted. This bounds
            // age, NOT bytes: sustained ~0.57 MiB/s can fill the 1Gi PVC before
            // expiry. Watch alloy-data usage; size it for peak ingress/outages.
            wal {
              enabled         = true
              max_segment_age = "30m"
            }

            external_labels = {
              cluster = "homelab",
            }
          }
      # The chart reads the Alloy container's resources from `alloy.resources`; the
      # previous top-level `resources` block was silently ignored, so Alloy ran with
      # no requests or limits. First memory cap, deliberately generous: tighten it to
      # ~1.3x the observed max working set (docs/PERF_DEEP_DIVE_2026-10.md §3.6).
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
