apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  # Keep the imported dashboard UID so provisioning adopts the existing Falco
  # dashboard rather than creating a duplicate. The sidecar reloads on updates.
  - name: falco-dashboard
    files:
      - falco-official.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: falco
        app.kubernetes.io/component: security
        app.kubernetes.io/part-of: taskflow-observability
