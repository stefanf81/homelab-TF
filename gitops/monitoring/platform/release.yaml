apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.96.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    # CSA's strategic merge honours DeploymentStrategy retainKeys when changing
    # RollingUpdate -> Recreate. SSA retains server-defaulted rollingUpdate.
    serverSideApply: disabled
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # ---------------------------------------------------------------------
    # Trimmed stack for a 14 GiB single-node homelab. Replaces Prometheus with
    # the dramatically lighter VictoriaMetrics (VMSingle + vmagent).
    # ---------------------------------------------------------------------
    # Evaluate the recording rules required by the bundled Kubernetes dashboards.
    # Alert delivery remains intentionally disabled (no Alertmanager/notifier).
    vmalert:
      enabled: true
      spec:
        evaluationInterval: 60s
        extraArgs:
          notifier.blackhole: "true"
        # Measured peak 36Mi (7d to 2026-10-20).
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: true
      # Homelab-sized resource budget — kube-state-metrics is extremely lean.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    # Node Exporter — host-level CPU/memory/disk/network metrics from every node.
    # On a single-node cluster this is one pod, negligible overhead.
    prometheus-node-exporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      # Skip pseudo-filesystems that produce no useful metrics
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$

    # Disable control-plane scraping (irrelevant on k3s / single-node)
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeDNS:
      enabled: false

    # k3s runs the control plane inside the kubelet process, so kubelet /metrics
    # re-exposed every apiserver/etcd/scheduler series already scraped by the
    # apiserver job (~81k duplicate series). Drop those prefixes here; kubelet_*,
    # rest_client_*, storage and volume metrics stay. The list replaces the chart
    # default, so its three rules are repeated first.
    kubelet:
      vmScrape:
        spec:
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            - action: drop
              source_labels: [__name__]
              regex: (apiserver|etcd|scheduler|apiextensions|watch|workqueue|kine|aggregator|authentication|authorization)_.+

    # Drop apiserver histograms no dashboard or recording rule reads (~58k series).
    # Kept: apiserver_request_sli_duration_seconds_bucket (burn-rate/availability
    # rules), workqueue_queue_duration_seconds_bucket (apiserver dashboard) and all
    # _count/_sum series. The endpoint list replaces the chart default, so it is
    # repeated in full.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  source_labels: [__name__]
                  regex: (etcd_request_duration_seconds|apiserver_request_duration_seconds|apiserver_watch_events_dispatch_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_request_body_size_bytes|apiserver_storage_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_cache_initialization_duration_seconds|apiserver_response_sizes|apiserver_watch_events_sizes)_bucket

    # CoreDNS is scraped by the custom `coredns` VMServiceScrape in
    # gitops/monitoring/app/vmservicescrapes.yaml. The stack's own scrape selects
    # the same pods (the CoreDNS chart sets k8s-app: kube-dns), so every CoreDNS
    # series was ingested twice under two different job labels.
    coreDns:
      enabled: false

    # The bundled CoreDNS dashboard is gated on coreDns.enabled by default; keep it
    # synced, since the custom coredns scrape still provides its metrics (the
    # dashboard discovers the job name from coredns_build_info).
    defaultDashboards:
      sources:
        kubernetes-system-coredns:
          enabled: true

    # VMSingle — the TSDB
    vmsingle:
      enabled: true
      spec:
        # Keep two weeks of history while retaining VictoriaMetrics' compact footprint.
        retentionPeriod: "14d"
        # 1Gi left too little room: RSS steadies at 650-810Mi, ad-hoc 7d queries
        # pushed it to 1000Mi (2026-10-20 06:07Z), and a rollout pod OOMKilled at
        # 1065Mi. 1.5Gi absorbs query/merge spikes; the request reflects steady use.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            # Memory (not CPU) protects the node. No CPU limit: a cap throttled
            # background merges and multi-series dashboard queries.
            memory: 1536Mi
        extraArgs:
          # Fixed cache budget (not a percentage of the limit), so raising the limit
          # adds RSS headroom instead of growing the caches. 358Mi (35% of 1Gi) was
          # fully used; caches are not a process RSS cap.
          memory.allowedBytes: "384MiB"
          search.maxConcurrentRequests: "4"
          search.maxMemoryPerQuery: "64MiB"
          # Refuse ingestion/writes when the PVC is nearly full instead of filling the disk
          storage.minFreeDiskSpaceBytes: "2GB"
          # Serve VMSingle UI from a sub-path so we can route it via Gateway API
          http.pathPrefix: "/vmsingle"
        # Persist TSDB on Proxmox CSI
        storage:
          storageClassName: proxmox-csi
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi

    # vmagent — does the scraping (replaces Prometheus scrape loops)
    vmagent:
      enabled: true
      spec:
        # Discover VMServiceScrapes (and VMProbes/VMRules) in ALL namespaces
        selectAllByDefault: true
        # Preserve pending remote-write data when the pod is replaced while
        # VMSingle is unavailable. The operator manages the StatefulSet rollout.
        statefulMode: true
        statefulStorage:
          volumeClaimTemplate:
            spec:
              storageClassName: proxmox-csi
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
        extraArgs:
          # Leave headroom on the queue PVC instead of consuming its full size.
          remoteWrite.maxDiskUsagePerURL: "1073741824"
          # Bound internal queues/caches below the process limit; other scrape
          # allocations and filesystem-backed queue activity need headroom.
          memory.allowedBytes: "128MiB"
        resources:
          requests:
            cpu: 50m
            # Average working set was 194Mi (peak 290Mi) against a 128Mi request.
            memory: 192Mi
          limits:
            # 256Mi OOMKilled the persistent collector during startup/backlog.
            memory: 512Mi

    victoria-metrics-operator:
      image:
        # Keep the image aligned with the operator chart bundled by stack 0.96.0
        # (chart 0.68.0 => operator v0.75.0). v0.75.0 adds the VTAgent CRD and
        # controller; the chart ships its RBAC rules and Flux applies the new
        # CRDs via `upgrade.crds: CreateReplace`. Pods roll once on this bump.
        # renovate: datasource=docker depName=victoriametrics/operator
        tag: v0.75.1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

    # Datasources provisioned by the stack. The list replaces the chart default, so
    # both default entries are repeated; only `jsonData.timeInterval` is new. Most
    # scrapes run every 30s (postgres, redis, Trivy, cilium-operator, cert-manager,
    # Kyverno and Policy Reporter every 60s), but Grafana assumes 15s unless told
    # otherwise, which makes $__rate_interval and the auto step ask for more points
    # than exist.
    defaultDatasources:
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            isDefault: true
            jsonData:
              timeInterval: 30s
          - name: VictoriaMetrics (DS)
            isDefault: false
            access: proxy
            uid: VictoriaMetricsDS
            type: victoriametrics-metrics-datasource
            plugin: true

    grafana:
      enabled: true
      # One SQLite database on one PVC: do not run old/new Grafana concurrently.
      deploymentStrategy:
        type: Recreate
      image:
        # renovate: datasource=docker depName=grafana/grafana
        tag: 13.2.4
      persistence:
        enabled: true
        storageClassName: proxmox-csi
        accessModes:
          - ReadWriteOnce
        size: 2Gi
      plugins:
        - victoriametrics-metrics-datasource
      serviceMonitor:
        path: /metrics
      envValueFrom:
        GF_AUTH_GITHUB_CLIENT_ID:
          secretKeyRef:
            name: grafana-github-oauth
            key: clientId
        GF_AUTH_GITHUB_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-github-oauth
            key: clientSecret
      grafana.ini:
        security:
          cookie_secure: true
          # GitHub OAuth needs cross-site navigation back to Grafana.
          cookie_samesite: lax
        server:
          domain: grafana.jokelab.dev
          root_url: "https://%(domain)s/"
          serve_from_sub_path: false
        analytics:
          # No update/version-check egress needed in a single-node homelab.
          check_for_updates: false
        plugins:
          # Grafana 13 preinstalls 18 plugins and runs every backend datasource as
          # its own process (~21-27Mi RSS each) inside this container's memory
          # limit. Only prometheus, loki and victoriametrics-metrics-datasource are
          # provisioned, so the rest are disabled; disable_plugins also stops them
          # from being preinstalled. The Logs/Metrics Drilldown apps stay: they are
          # frontend-only and work with the provisioned datasources.
          disable_plugins: "influxdb,mssql,mysql,grafana-postgresql-datasource,elasticsearch,opentsdb,stackdriver,zipkin,tempo,jaeger,grafana-pyroscope-datasource,grafana-pyroscope-app,grafana-exploretraces-app,grafana-advisor-app"
        auth:
          disable_login_form: true
        "auth.github":
          enabled: true
          # SECURITY: public Grafana + open sign-up previously granted any GitHub
          # account the Admin role (and datasource proxy access to VMSingle/Loki).
          allow_sign_up: false
          auto_assign_org: true
          auto_assign_org_role: Viewer
          # Only stefanf81 can authenticate via GitHub: the role expression yields a
          # role solely for that login, and role_attribute_strict denies everyone
          # else. The local `grafana-admin` account remains the break-glass login.
          role_attribute_path: "[login=='stefanf81'][0] && 'GrafanaAdmin'"
          role_attribute_strict: true
          # role_attribute_path returns GrafanaAdmin; without this flag Grafana
          # would grant only org-admin, not server admin.
          allow_assign_grafana_admin: true
          scopes: user:email,read:org
          auth_url: https://github.com/login/oauth/authorize
          token_url: https://github.com/login/oauth/access_token
          api_url: https://api.github.com/user
      sidecar:
        # Applies to both grafana-sc-dashboard and grafana-sc-datasources.
        # 14d peaks (2026-10-22): 96Mi / 84Mi, CPU bursts to ~40m on resync.
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi
        dashboards:
          reloadURL: "http://localhost:3000/api/admin/provisioning/dashboards/reload"
          # Grafana runs in `monitoring`; limit ConfigMap discovery to this
          # namespace instead of cluster-wide. The chart joins the list into the
          # sidecar's NAMESPACE env var (value name is `searchNamespace`).
          searchNamespace:
            - monitoring
          # Dashboard ConfigMaps request their Grafana folder through the
          # `grafana_folder` annotation (see gitops/monitoring/*/dashboards).
          folderAnnotation: grafana_folder
          provider:
            # Replicate the sidecar's folder structure in Grafana so annotated
            # ConfigMaps are imported into folders instead of one flat list.
            foldersFromFilesStructure: true
        datasources:
          reloadURL: "http://localhost:3000/api/admin/provisioning/datasources/reload"
          searchNamespace:
            - monitoring
      # Grafana is exposed via an HTTPRoute on the public Gateway
      ingress:
        enabled: false
      # Admin credentials from the SOPS-encrypted secret
      admin:
        existingSecret: grafana-admin
      resources:
        # Grafana idles ~350Mi and spikes past 500Mi (Go heap/GC + Bleve search
        # index). The old 512Mi limit sat below that peak and OOMKilled the
        # container repeatedly, so give it ~2x headroom over observed peaks.
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      # The chart sets GOMEMLIMIT for the grafana-server process only, but the
      # backend plugin processes share the container limit. 0.8 (819MiB) keeps
      # ~200Mi for the remaining plugins instead of the default 0.9 (921MiB).
      goMemLimit:
        factor: 0.8
