apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      # Pin a known-good chart version. Bump deliberately; the CRDs are large and
      # upgrades can be disruptive. Verify at artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
      version: 87.12.3
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    createNamespace: true
  # The chart installs its CRDs (ServiceMonitor, Prometheus, etc.) via its `crds`
  # subchart (values.crds.enabled defaults to true). We let Flux also manage CRDs
  # so upgrades replace them; harmless if the chart already did.
  upgrade:
    crds: CreateReplace
  values:
    # ---------------------------------------------------------------------
    # Trim the stack for a 14 GiB single-node homelab. We keep the pieces that
    # give us dashboards/metrics (Prometheus + Grafana + node + kube-state), and
    # drop Alertmanager (no routing configured for a homelab).
    # ---------------------------------------------------------------------
    alertmanager:
      enabled: false

    prometheusOperator:
      # Disable the admission webhook: avoids the cert-manager / webhook-certgen
      # dependency entirely. We are not creating invalid Prometheus/ServiceMonitor
      # CRs, so losing the validating webhook is acceptable here.
      admissionWebhooks:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

    kubeStateMetrics:
      # Memory-trimmed for a single-node homelab (it holds one series per k8s
      # object in RAM, so it's a notable consumer — see ARCHITECTURE.md S10.9).
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 192Mi

    nodeExporter:
      resources:
        requests:
          cpu: 50m
          memory: 48Mi
        limits:
          cpu: 150m
          memory: 96Mi

    grafana:
      enabled: true
      # No ingress: Grafana stays OFF the public Gateway, consistent with the
      # Jaeger-UI lockdown. Reach it via `kubectl -n monitoring port-forward
      # svc/kube-prometheus-stack-grafana 3000:80` (see ARCHITECTURE.md S10.9).
      ingress:
        enabled: false
      # Grafana admin credentials come from the SOPS-encrypted secret below.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 250m
          memory: 128Mi

    prometheus:
      prometheusSpec:
        # 3 days of history is plenty for a homelab; 7d was over-provisioned for
        # a 14 GiB node. retentionSize caps disk so the Longhorn volume stays small.
        retention: 3d
        retentionSize: 2Gi
        # Scrape/evaluate every 60s instead of 30s — halves WAL churn and CPU on
        # a single node; dashboards don't need 30s resolution here.
        scrapeInterval: 60s
        evaluationInterval: 60s
        # Discover ServiceMonitors (and PodMonitors) in ALL namespaces — including
        # the ones we define in gitops/monitoring/app for the taskflow services.
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorNamespaceSelector: {}
        resources:
          # Right-sized: ~5–15k series fits easily in 384Mi; 1024Mi limit leaves
          # headroom without the 1536Mi over-reservation from the initial scaffold.
          requests:
            cpu: 300m
            memory: 384Mi
          limits:
            cpu: "750m"
            memory: 1024Mi
        # Persist the TSDB on Longhorn. volumeClaimTemplate lets the operator
        # auto-provision a PVC from the `longhorn` StorageClass (single-replica
        # homelab profile). NOTE: `existingClaim` was REMOVED from StorageSpec, so
        # this is the supported way to pin Prometheus storage to Longhorn.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 4Gi
              selector: {}
