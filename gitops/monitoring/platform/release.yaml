apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.86.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: monitoring
  install:
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # ---------------------------------------------------------------------
    # Trimmed stack for a 14 GiB single-node homelab. Replaces Prometheus with
    # the dramatically lighter VictoriaMetrics (VMSingle + vmagent).
    # ---------------------------------------------------------------------
    # Disable unneeded components
    vmalert:
      enabled: false
    alertmanager:
      enabled: false
    kube-state-metrics:
      # Disabled to save ~150–250 MiB RSS. Re-enable (enabled: true) if you want
      # k8s-object dashboards (pods/deployments counts) back.
      enabled: false
    # Disable control-plane scraping (irrelevant on k3s / single-node)
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeDNS:
      enabled: false

    # VMSingle — the TSDB
    vmsingle:
      enabled: true
      spec:
        # 3 days of history is plenty for a homelab. VM is extremely compact.
        retentionPeriod: "3d"
        # Highly optimized RAM profile (VMSingle uses 1/3 to 1/5 the RAM of Prometheus)
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "500m"
            memory: 512Mi
        extraArgs:
          # Limit internal caches so the container doesn't OOM under pressure
          memory.allowedPercent: "60"
          # Serve VMSingle UI from a sub-path so we can route it via Gateway API
          http.pathPrefix: "/vmsingle"
        # Persist TSDB on Proxmox CSI
        storage:
          storageClassName: proxmox-csi
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi

    # vmagent — does the scraping (replaces Prometheus scrape loops)
    vmagent:
      enabled: true
      spec:
        # Discover VMServiceScrapes (and VMProbes/VMRules) in ALL namespaces
        selectAllByDefault: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

    victoria-metrics-operator:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    grafana:
      enabled: true
      plugins:
        - victoriametrics-metrics-datasource
      serviceMonitor:
        path: /grafana/metrics
      grafana.ini:
        server:
          domain: paintlab.duckdns.org
          root_url: "https://%(domain)s/grafana/"
          serve_from_sub_path: true
      sidecar:
        dashboards:
          reloadURL: "http://localhost:3000/grafana/api/admin/provisioning/dashboards/reload"
        datasources:
          reloadURL: "http://localhost:3000/grafana/api/admin/provisioning/datasources/reload"
      # Grafana is exposed via an HTTPRoute on the public Gateway
      ingress:
        enabled: false
      # Admin credentials from the SOPS-encrypted secret
      admin:
        existingSecret: grafana-admin
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 512Mi
