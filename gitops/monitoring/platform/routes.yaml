apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring-routes
  namespace: monitoring
spec:
  # Attach to the main TaskFlow Cilium Gateway
  parentRefs:
    - name: taskflow-gateway
      namespace: taskflow
  rules:
    # Grafana UI
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: victoria-metrics-k8s-stack-grafana
          port: 80

    # VictoriaMetrics (VMSingle) UI
    - matches:
        - path:
            type: PathPrefix
            value: /vmsingle
      backendRefs:
        - name: victoria-metrics-k8s-stack-vmsingle
          port: 8428
