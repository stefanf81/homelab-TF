apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring-routes
  namespace: monitoring
spec:
  # Attach to the main TaskFlow Cilium Gateway
  parentRefs:
    - name: taskflow-gateway
      namespace: taskflow
      sectionName: https # serve only on :443; plaintext :80 is redirected by http-to-https-redirect
  hostnames:
    - "grafana.${DOMAIN}"
  rules:
    # Grafana UI
    - matches:
        - path:
            type: PathPrefix
            value: /
      # No route timeout. Without one, Cilium leaves Envoy's implicit 15s default
      # in place, which answers panel queries slower than 15s with a 504 (Grafana's
      # own data proxy allows 30s). Envoy's 300s stream idle timeout still bounds
      # idle requests. docs/reports/NETWORK_REVIEW_2026-10.md §2.2
      timeouts:
        request: "0s"
      backendRefs:
        - name: victoria-metrics-k8s-stack-grafana
          port: 80
