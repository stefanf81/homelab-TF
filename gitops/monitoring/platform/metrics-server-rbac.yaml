# Fix: grant metrics-server SA access to the extension-apiserver-authentication ConfigMap in
# kube-system. The metrics-server aggregated API server reads this ConfigMap during startup
# to configure authentication delegation. Without this, it panics and enters CrashLoopBackOff.
#
# While the Helm chart (3.12.2+) creates a ClusterRole + RoleBinding for this, in some
# clusters (especially k3s) the binding may not take effect. This explicit ClusterRole +
# ClusterRoleBinding provides a reliable safety net.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-server-extension-apiserver-authentication-reader
  labels:
    app.kubernetes.io/name: metrics-server
    app.kubernetes.io/instance: metrics-server
    app.kubernetes.io/part-of: monitoring
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - extension-apiserver-authentication
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-server-extension-apiserver-authentication-reader
  labels:
    app.kubernetes.io/name: metrics-server
    app.kubernetes.io/instance: metrics-server
    app.kubernetes.io/part-of: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-server-extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: monitoring
