# Explicit RBAC for metrics-server.
#
# The Helm chart (3.12.2+) should create these via rbac.create=true, but in this
# k3s cluster the chart-generated ClusterRole/ClusterRoleBinding/RoleBinding are
# not taking effect — the metrics-server SA gets "forbidden" on every resource it
# needs (configmaps, pods, nodes, namespaces). These explicit resources provide a
# reliable safety net so the metrics-server can start and function correctly.
#
# Resources required by the metrics-server aggregated API server:
#   - nodes/metrics (get)        — scrape metrics from kubelets
#   - pods, nodes, namespaces,
#     configmaps (get/list/watch) — discover targets and read auth config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-server-core
  labels:
    app.kubernetes.io/name: metrics-server
    app.kubernetes.io/instance: metrics-server
    app.kubernetes.io/part-of: monitoring
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
      - namespaces
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes/metrics
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - nodes/stats
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-server-core
  labels:
    app.kubernetes.io/name: metrics-server
    app.kubernetes.io/instance: metrics-server
    app.kubernetes.io/part-of: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-server-core
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: monitoring
---
# Bind the metrics-server SA to the built-in system:auth-delegator ClusterRole.
# This grants the ability to create SubjectAccessReview and TokenReview
# resources, which the aggregated API server needs for authorization delegation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-server-auth-delegator
  labels:
    app.kubernetes.io/name: metrics-server
    app.kubernetes.io/instance: metrics-server
    app.kubernetes.io/part-of: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: monitoring
---
# RoleBinding in kube-system to read the extension-apiserver-authentication ConfigMap.
# This ConfigMap is auto-created by kube-apiserver and contains the requestheader
# client CA data that the aggregated API server needs to load. The built-in
# extension-apiserver-authentication-reader Role is created by the API server
# bootstrap process.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-server-auth-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: metrics-server
    app.kubernetes.io/instance: metrics-server
    app.kubernetes.io/part-of: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: monitoring
