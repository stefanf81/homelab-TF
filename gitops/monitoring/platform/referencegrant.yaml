# Authorizes the cross-namespace HTTPRoute `monitoring-routes` (namespace: monitoring)
# to attach to `taskflow-gateway` (namespace: taskflow).
#
# Without this ReferenceGrant, Gateway API silently rejects the parentRef and the
# route is never attached. /grafana and /vmsingle then fall through to the
# taskflow-route catch-all (PathPrefix: /) -> the Angular frontend SPA, whose
# router redirects the unknown /grafana path back to / (the reported symptom).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-monitoring-routes
  namespace: taskflow
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: taskflow-gateway
