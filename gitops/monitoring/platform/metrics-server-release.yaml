apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      # Pin the chart while overriding the Metrics Server image version explicitly.
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: monitoring
  # metrics-server runs in the monitoring namespace with explicit RBAC below.
  install:
    createNamespace: false
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # Single-node k3s: kubelets serve a self-signed cert, so metrics-server must
  # skip kubelet TLS verification.
  values:
    # RBAC is managed explicitly in metrics-server-rbac.yaml (reliable on k3s);
    # disable the chart copy so there is only one owner.
    rbac:
      create: false
    image:
      # renovate: datasource=docker depName=registry.k8s.io/metrics-server/metrics-server
      tag: v0.9.0
    args:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
