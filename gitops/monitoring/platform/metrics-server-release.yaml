apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      # Pin the chart while overriding the Metrics Server image version explicitly.
      version: 3.13.1
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: monitoring
  # metrics-server must run in kube-system (reads kubelet credentials from there).
  install:
    createNamespace: false
  # Single-node k3s: kubelets serve HTTP (not HTTPS) and use a self-signed cert,
  # so metrics-server must skip the TLS verify for both kubelet + API server.
  values:
    image:
      tag: v0.9.0
    args:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
      # v0.9.x requires configmaps RBAC in kube-system; tolerate lookup failure on
      # single-node k3s where the extension-apiserver-authentication RoleBinding
      # may not be updated by the Helm upgrade.
      - --authentication-tolerate-lookup-failure
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
