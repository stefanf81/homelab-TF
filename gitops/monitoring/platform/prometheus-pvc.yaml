# Persistent storage for the Prometheus TSDB, backed by Longhorn (single-replica,
# matching the homelab's single-node profile). Referenced by the kube-prometheus-stack
# HelmRelease via prometheus.prometheusSpec.storageSpec.existingClaim below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 8Gi
