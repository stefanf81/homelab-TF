# Ingress-only default-deny for the monitoring namespace.
#
# Egress is intentionally left open: vmagent's scrape fan-out spans kubelet,
# node-exporter, and app exporters in other namespaces, and ingress is the
# sensitive surface (VMSingle/Loki/Grafana/Alloy APIs are unauthenticated on the
# Pod network). Without these rules any pod in the cluster can read, push, or
# delete all telemetry.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-ingress-default-deny
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    # Same-namespace traffic: Grafana -> VMSingle/Loki, Alloy -> Loki,
    # vmagent -> kube-state-metrics, Loki internal memberlist.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    # Host processes: kubelet liveness/readiness probes, the kube-apiserver
    # proxying to aggregated APIs (metrics-server), and hostNetwork scrapes.
    - fromEntities:
        - host
---
# Cilium Gateway -> Grafana only (grafana.jokelab.dev, container port 3000).
# This used to be a namespace-wide rule: the Gateway identity could reach every
# pod here, so one HTTPRoute backendRef (or a route attached from another
# namespace) would have published the unauthenticated VMSingle, Loki or Alloy
# APIs. Grafana is the only Gateway backend in this namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-to-grafana
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: victoria-metrics-k8s-stack
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: reserved:ingress
              operator: Exists
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# The AbuseIPDB synchronizer ships Cloudflare Security Events to Loki directly:
# the Loki pod's HTTP port 3100 (there is no nginx gateway in front of it). Its
# egress side is abuseipdb-sync-egress in gitops/platform/abuseipdb/network-policy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-abuseipdb-sync-to-loki
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: single-binary
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: abuseipdb
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
