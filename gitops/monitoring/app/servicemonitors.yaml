# ServiceMonitors for the TaskFlow application components. These are discovered by
# Prometheus because the kube-prometheus-stack HelmRelease sets
#   prometheus.prometheusSpec.serviceMonitorSelector: {}   (match ALL)
#   prometheus.prometheusSpec.serviceMonitorNamespaceSelector: {}   (all namespaces)
#
# They live in a SEPARATE Kustomization (gitops/monitoring/app) that dependsOn the
# platform Kustomization, so the ServiceMonitor CRD already exists when these apply.
---
# --- Backend (Spring Boot Actuator /actuator/prometheus) -----------------------
# INERT UNTIL THE APP REPO ADDS micrometer-registry-prometheus. The ServiceMonitor
# is valid now; it just collects no series until the backend exposes that endpoint.
# See docs/BACKEND_INTEGRATION_CONTEXT.md for the exact backend change required.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskflow-backend
  namespace: monitoring
  labels:
    app: taskflow-backend
spec:
  namespaceSelector:
    matchNames:
      - taskflow
  selector:
    matchLabels:
      app: taskflow-backend
  endpoints:
    - port: 8080               # backend Service port (integer — no name needed)
      path: /actuator/prometheus
      interval: 30s
      scheme: http
---
# --- PostgreSQL exporter ------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskflow-postgres-exporter
  namespace: monitoring
  labels:
    app: postgres-exporter
spec:
  namespaceSelector:
    matchNames:
      - taskflow
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
    - port: metrics            # postgres-exporter Service port name
      path: /metrics
      interval: 30s
      scheme: http
---
# --- Redis exporter ----------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskflow-redis-exporter
  namespace: monitoring
  labels:
    app: redis-exporter
spec:
  namespaceSelector:
    matchNames:
      - taskflow
  selector:
    matchLabels:
      app: redis-exporter
  endpoints:
    - port: metrics            # redis-exporter Service port name
      path: /metrics
      interval: 30s
      scheme: http
