# VMServiceScrapes for the TaskFlow application components. These are discovered
# by vmagent because the victoria-metrics-k8s-stack HelmRelease sets
#   vmagent.spec.selectAllByDefault: true
#
# They live in a SEPARATE Kustomization (gitops/monitoring/app) that dependsOn the
# platform Kustomization, so the VMServiceScrape CRD already exists when these apply.
---
# --- Backend (Spring Boot Actuator /actuator/prometheus) -----------------------
# INERT UNTIL THE APP REPO ADDS micrometer-registry-prometheus.
# See docs/BACKEND_INTEGRATION_CONTEXT.md for the exact backend change required.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: taskflow-backend
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - taskflow
  selector:
    matchLabels:
      app: taskflow-backend
  endpoints:
    - port: http                 # Matches the named backend Service port.
      path: /actuator/prometheus
      interval: 30s
      scheme: http
---
# --- PostgreSQL exporter ------------------------------------------------------
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: taskflow-postgres-exporter
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - taskflow
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
    - port: metrics            # postgres-exporter Service port name
      path: /metrics
      # DB-level metrics (cache hit ratio, active connections) change slowly; 60s halves
      # vmagent's scrape load on the single-node cluster versus the default 30s.
      interval: 60s
      scheme: http
---
# --- Redis exporter ----------------------------------------------------------
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: taskflow-redis-exporter
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - taskflow
  selector:
    matchLabels:
      app: redis-exporter
  endpoints:
    - port: metrics            # redis-exporter Service port name
      path: /metrics
      # Cache hit rate / memory usage drift slowly; 60s reduces vmagent scrape pressure.
      interval: 60s
      scheme: http
---
# --- Falco Runtime Security ---------------------------------------------------
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: falco-metrics
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - falco
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  endpoints:
    - port: metrics            # Falco metrics service port name (port 8765)
      path: /metrics
      interval: 30s
      scheme: http
---
# --- Trivy Operator -----------------------------------------------------------
# Trivy exposes scan, compliance, and controller metrics on its operator service.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: trivy-operator
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - trivy-system
  selector:
    matchLabels:
      app.kubernetes.io/instance: trivy-operator
      app.kubernetes.io/name: trivy-operator
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scheme: http
---
# --- Cilium agent (eBPF datapath + policy metrics) ----------------------------
# Headless Service `cilium-agent` is only created with prometheus.metricsService=true.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cilium-agent
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-agent
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scheme: http
---
# --- Cilium operator ----------------------------------------------------------
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cilium-operator
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-operator
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scheme: http
---
# --- Hubble flow metrics (dns/drop/tcp/flow/httpV2) ---------------------------
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: hubble-metrics
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: hubble
  endpoints:
    - port: hubble-metrics
      path: /metrics
      interval: 30s
      scheme: http
---
# --- CoreDNS (override Corefile hosts/hairpin traffic included) ----------------
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: coredns
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: coredns
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scheme: http
---
# --- cert-manager controller (certificate expiry / renewal failures) ----------
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cert-manager
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - cert-manager
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scheme: http
---
# --- Kyverno (all four controller metrics Services share part-of=kyverno) -----
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kyverno
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/component
  namespaceSelector:
    matchNames:
      - kyverno
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  endpoints:
    - port: metrics-port
      path: /metrics
      interval: 60s
      scheme: http
---
# --- Policy Reporter (needs metrics.enabled: true in its HelmRelease) ----------
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: policy-reporter
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - policy-reporter
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-reporter
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scheme: http
