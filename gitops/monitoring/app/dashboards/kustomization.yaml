apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  # One ConfigMap per dashboard. Stable ConfigMap names and dashboard UIDs let
  # provisioning adopt the existing dashboards instead of creating duplicates;
  # the sidecar reloads on updates. The `grafana_folder` annotation places each
  # dashboard in a Grafana folder (sidecar.dashboards.folderAnnotation must be
  # set to `grafana_folder` in the stack HelmRelease).
  - name: abuseipdb-security-dashboard
    files:
      - abuseipdb-security.json
    options:
      disableNameSuffixHash: true
      annotations:
        grafana_folder: Security
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: abuseipdb-sync
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: taskflow-observability
  - name: blocked-sources-dashboard
    files:
      - blocked-sources.json
    options:
      disableNameSuffixHash: true
      annotations:
        grafana_folder: Security
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: abuseipdb-sync
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: taskflow-observability
  - name: taskflow-performance-dashboard
    files:
      - taskflow-performance.json
    options:
      disableNameSuffixHash: true
      annotations:
        grafana_folder: Taskflow
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: taskflow-observability
  - name: cert-manager-dashboard
    files:
      - cert-manager.json
    options:
      disableNameSuffixHash: true
      annotations:
        grafana_folder: Platform
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: taskflow-observability
  - name: kyverno-dashboard
    files:
      - kyverno.json
    options:
      disableNameSuffixHash: true
      annotations:
        grafana_folder: Security
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: kyverno
        app.kubernetes.io/component: security
        app.kubernetes.io/part-of: taskflow-observability
  # Vendored from the Cilium chart (see SOURCE.md for the version and local changes).
  - name: cilium-agent-dashboard
    files:
      - cilium-agent.json
    options:
      disableNameSuffixHash: true
      annotations:
        grafana_folder: Platform
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: cilium
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: taskflow-observability
  - name: hubble-dashboard
    files:
      - hubble.json
    options:
      disableNameSuffixHash: true
      annotations:
        grafana_folder: Platform
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: hubble
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: taskflow-observability
