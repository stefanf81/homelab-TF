# App-layer scrape for the AbuseIPDB synchronizer.
# Discovered by vmagent (selectAllByDefault: true on the VM k8s stack chart).
# Dashboards live in gitops/monitoring/app/dashboards (see SOURCE.md there).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: abuseipdb-sync
  namespace: monitoring
  labels:
    app.kubernetes.io/name: abuseipdb-sync
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: taskflow-observability
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - abuseipdb
  selector:
    matchLabels:
      app.kubernetes.io/name: abuseipdb-sync
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scheme: http
