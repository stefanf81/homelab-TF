# Flux itself, managed by the Flux Operator (REL-06). Replaced the CLI bootstrap
# manifests (flux-system/gotk-*.yaml); the operator marks every object it owns
# `kustomize.toolkit.fluxcd.io/ssa: Ignore` + `prune: Disabled`.
#
# The two image controllers used to be applied by hand and were lost on every
# regeneration of the bootstrap manifests; they are now part of the install.
#
# prune: disabled - deleting this object makes the operator uninstall the Flux
# controllers, so Flux must never garbage-collect it.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    # Patch releases roll out automatically; minor bumps are a reviewed change.
    # 2.10: object identity GA (token RBAC no longer granted; unused here),
    # notification APIs v1, ImageRepository tags in Flux storage (one rescan).
    version: "2.10.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  # Generates the flux-system GitRepository (1m) + Kustomization (10m),
  # authenticated with the HTTPS PAT secret that image automation also uses
  # to push.
  sync:
    kind: GitRepository
    url: https://github.com/stefanf81/homelab-TF.git
    ref: refs/heads/main
    path: ./gitops/clusters/taskflow
    pullSecret: flux-system
    interval: 1m
