apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: kube-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: coredns
  install:
    createNamespace: false
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      repository: coredns/coredns
      # renovate: datasource=docker depName=coredns/coredns
      tag: 1.15.0
      pullPolicy: IfNotPresent

    replicaCount: 1
    # Single replica: start the new pod before stopping the old one so DNS stays up.
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    priorityClassName: system-cluster-critical
    k8sAppLabelOverride: kube-dns

    deployment:
      selector:
        matchLabels:
          k8s-app: kube-dns

    resources:
      requests:
        cpu: 100m
        memory: 70Mi
      limits:
        memory: 170Mi

    serviceAccount:
      create: true
      name: coredns

    service:
      name: kube-dns
      clusterIP: 10.43.0.10
      selector:
        k8s-app: kube-dns

    prometheus:
      service:
        enabled: true

    nodeSelector:
      kubernetes.io/os: linux

    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            k8s-app: kube-dns
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      - labelSelector:
          matchLabels:
            k8s-app: kube-dns
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway

    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: hosts
            configBlock: |-
              ${NODE_IP} ubuntu
              ${GATEWAY_IP} ${DOMAIN} www.${DOMAIN} grafana.${DOMAIN} kyverno.${DOMAIN} hubble.${DOMAIN}
              ttl 60
              reload 15s
              fallthrough
          # `pods verified` answers pod A records only for pods that exist (CoreDNS
          # watches all pods; `insecure` is a kube-dns compatibility mode), and
          # autopath needs it.
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          # Pods resolve with ndots:5, so an external name (ghcr.io,
          # api.cloudflare.com) first walks every search domain, A and AAAA each.
          # autopath answers the first, namespace-suffixed query with a CNAME to
          # the final answer: one round trip instead of up to five.
          - name: autopath
            parameters: "@kubernetes"
          - name: prometheus
            parameters: 0.0.0.0:9153
          # No TTL cap: answers live for their own TTL (CoreDNS caps at 3600s, 1800s
          # for denials). prefetch refreshes names asked 20+ times before they
          # expire, serve_stale answers from cache while the upstream is down, and
          # servfail 0 stops caching upstream failures.
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
              servfail 0
          - name: log
            configBlock: |-
              class error
          - name: loop
          - name: reload
          - name: loadbalance
          - name: forward
            parameters: . /etc/resolv.conf
