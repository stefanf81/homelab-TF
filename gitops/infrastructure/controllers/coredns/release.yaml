apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: kube-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: coredns
  install:
    createNamespace: false
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      repository: coredns/coredns
      # renovate: datasource=docker depName=coredns/coredns
      tag: 1.15.0
      pullPolicy: IfNotPresent

    replicaCount: 1
    # Single replica: start the new pod before stopping the old one so DNS stays up.
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    priorityClassName: system-cluster-critical
    k8sAppLabelOverride: kube-dns

    deployment:
      selector:
        matchLabels:
          k8s-app: kube-dns

    resources:
      requests:
        cpu: 100m
        memory: 70Mi
      limits:
        memory: 170Mi

    serviceAccount:
      create: true
      name: coredns

    service:
      name: kube-dns
      clusterIP: 10.43.0.10
      selector:
        k8s-app: kube-dns

    prometheus:
      service:
        enabled: true

    nodeSelector:
      kubernetes.io/os: linux

    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            k8s-app: kube-dns
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      - labelSelector:
          matchLabels:
            k8s-app: kube-dns
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway

    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: hosts
            configBlock: |-
              192.168.50.55 ubuntu
              ${GATEWAY_IP} ${DOMAIN} www.${DOMAIN} grafana.${DOMAIN} kyverno.${DOMAIN} hubble.${DOMAIN}
              ttl 60
              reload 15s
              fallthrough
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods insecure
              fallthrough in-addr.arpa ip6.arpa
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance
          - name: forward
            parameters: . /etc/resolv.conf
