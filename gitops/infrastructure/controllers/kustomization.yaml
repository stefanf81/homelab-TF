apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Only controllers and CRD providers that everything else can depend on live here.
# Workloads that need the app tier (Gateway/HTTPRoute), SOPS secrets or their own
# ordering are reconciled from gitops/platform/ by dedicated cluster-root
# Kustomizations (abuseipdb, hubble-ui, policy-reporter, renovate), and
# trivy-operator and falco have their own Kustomizations (gitops/clusters/taskflow/
# trivy-operator.yaml, falco.yaml): a failed release of either must not block the
# Kustomizations that depend on infra-controllers.
resources:
  - gateway-api
  - cilium
  - cert-manager
  - coredns
  - proxmox-csi
  - kyverno
