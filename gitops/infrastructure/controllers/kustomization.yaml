apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Note: policy-reporter and trivy-operator are intentionally NOT listed here.
# They are reconciled by their own cluster-root Kustomizations
# (gitops/clusters/taskflow/policy-reporter.yaml, trivy-operator.yaml):
# policy-reporter additionally depends on taskflow-app (its Gateway/HTTPRoute)
# and trivy-operator (its CRDs), so it cannot be wired into this controller batch.
# hubble-ui and renovate also have dedicated cluster-root Kustomizations because
# they need SOPS decryption and/or taskflow-app ordering.
resources:
  - gateway-api
  - cilium
  - cert-manager
  - coredns
  - proxmox-csi
  - kyverno
  - falco
