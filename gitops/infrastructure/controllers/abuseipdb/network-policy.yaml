# The synchronizer needs no inbound traffic except Prometheus scrapes. Egress
# is limited to cluster DNS, the Kubernetes API and the AbuseIPDB HTTPS API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: abuseipdb
  labels:
    app.kubernetes.io/name: abuseipdb-sync
    app.kubernetes.io/component: ip-reputation-sync
    app.kubernetes.io/part-of: infrastructure
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: abuseipdb
  labels:
    app.kubernetes.io/name: abuseipdb-sync
    app.kubernetes.io/component: ip-reputation-sync
    app.kubernetes.io/part-of: infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: abuseipdb-sync
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
---
# DNS is allowed with L7 rules so Cilium's DNS proxy can resolve the FQDN below;
# the FQDN rule then confines outbound HTTPS to api.abuseipdb.com.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: abuseipdb-sync-egress
  namespace: abuseipdb
  labels:
    app.kubernetes.io/name: abuseipdb-sync
    app.kubernetes.io/component: ip-reputation-sync
    app.kubernetes.io/part-of: infrastructure
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: abuseipdb-sync
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.abuseipdb.com
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEntities:
        - kube-apiserver
