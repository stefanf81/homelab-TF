apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hubble-ui-oauth2-proxy
  namespace: hubble-ui
spec:
  interval: 30m
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: hubble-ui
      interval: 12h
  install:
    createNamespace: true
  upgrade:
    crds: Skip
  values:
    replicaCount: 1
    config:
        configFile: |-
          provider = "github"
          upstreams = ["http://hubble-ui.kube-system.svc.cluster.local:80"]
          http_address = "0.0.0.0:4180"
          cookie_secure = false
          cookie_domains = [".jokelab.dev"]
          whitelist_domains = [".jokelab.dev"]
          reverse_proxy = true
          set_xauthrequest = true
          email_domains = ["*"]
          scope = "user:email read:org"
    env:
      - name: OAUTH2_PROXY_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: hubble-ui-github-oauth
            key: clientId
      - name: OAUTH2_PROXY_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: hubble-ui-github-oauth
            key: clientSecret
      - name: OAUTH2_PROXY_COOKIE_SECRET
        valueFrom:
          secretKeyRef:
            name: hubble-ui-github-oauth
            key: cookieSecret
    ingress:
      enabled: false
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
