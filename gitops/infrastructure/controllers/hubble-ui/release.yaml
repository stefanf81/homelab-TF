apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hubble-ui-oauth2-proxy
  namespace: hubble-ui
spec:
  interval: 30m
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: hubble-ui
      interval: 12h
  install:
    createNamespace: true
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    replicaCount: 1
    # Single replica + chart default minAvailable: 1 blocks every node drain.
    podDisruptionBudget:
      enabled: false
    config:
      existingSecret: hubble-ui-github-oauth
      configFile: |-
        provider = "github"
        redirect_url = "https://hubble.jokelab.dev/oauth2/callback"
        upstreams = ["http://hubble-ui.kube-system.svc.cluster.local:80"]
        http_address = "0.0.0.0:4180"
        cookie_secure = true
        cookie_domains = [".jokelab.dev"]
        whitelist_domains = [".jokelab.dev"]
        reverse_proxy = true
        set_xauthrequest = true
        skip_provider_button = true
        email_domains = ["*"]
        # SECURITY: restrict logins to this GitHub username. With no org/repo
        # configured, oauth2-proxy rejects every user not listed here.
        github_users = ["stefanf81"]
        scope = "user:email read:org"
    ingress:
      enabled: false
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
