apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kyverno
  install:
    createNamespace: true
    # Chart v3 ships CRDs as templated resources owned by the release (crds.install below).
    # Do NOT set this to CreateReplace — it conflicts with Kyverno's owned CRDs
    # (error: "cannot be imported into the current release: invalid ownership metadata").
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # v3 CRD management: Kyverno templates + owns the CRDs (Helm/Flux applies them).
    crds:
      install: true
    # Resources: requests sized to real use, no CPU limits (a throttled admission
    # webhook adds latency to every apply). The admission controller's container
    # resources live under `container:` in chart 3.x; a top-level `resources` here is
    # silently ignored (it was, until this change).
    # Leader election: renew every 15s instead of 2s (Kyverno derives the lease
    # as 6x and the renew deadline as 5x the retry period: 90s / 75s). Each of the
    # four controllers renewed its Lease every 2s, ~1.7 of the ~7 writes/s to k3s's
    # SQLite datastore, which wrote ~59 GB/day to the only NVMe (2026-11-03,
    # docs/NODE_HOST_TUNING.md §4.5). Single replicas: a takeover after a crash
    # waits up to 90s instead of 12s; no effect in normal operation.
    admissionController:
      replicas: 1
      container:
        extraArgs:
          leaderElectionRetryPeriod: 15s
        resources:
          requests:
            # Sampled 14d working-set peak ~163Mi (2026-11-03).
            memory: "192Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
    # Background and cleanup controllers are off: both are optional and had no
    # work. The background controller only processes generate and mutate-existing
    # rules, the cleanup controller only DeletingPolicy/CleanupPolicy and the
    # `cleanup.kyverno.io/ttl` label; this repo has two ValidatingPolicies and
    # nothing else. Background *scans* of those policies are done by the reports
    # controller, which stays. Saves two pods, 2 x 128Mi of requests and two
    # Leases. Their settings below are kept so that re-enabling one (set
    # enabled: true together with the first policy that needs it) brings back the
    # 15s lease renewal instead of the 2s default.
    backgroundController:
      enabled: false
      replicas: 1
      extraArgs:
        leaderElectionRetryPeriod: 15s
      resources:
        requests:
          memory: "128Mi"
          cpu: "25m"
        limits:
          memory: "256Mi"
    cleanupController:
      enabled: false
      replicas: 1
      extraArgs:
        leaderElectionRetryPeriod: 15s
      resources:
        requests:
          memory: "128Mi"
          cpu: "25m"
        limits:
          memory: "256Mi"
    reportsController:
      replicas: 1
      extraArgs:
        leaderElectionRetryPeriod: 15s
      resources:
        requests:
          memory: "128Mi"
          cpu: "25m"
        limits:
          memory: "256Mi"
    # Metric label exposure. The chart's defaults key the counters with a `_total`
    # suffix (kyverno_policy_results_total, ...), but Kyverno matches these keys
    # against the OpenTelemetry instrument names, which have no suffix (the
    # Prometheus exporter adds `_total`), so those defaults never applied and
    # every label was exported. Null the dead keys and set the matching ones:
    # drop resource_namespace (and policy_namespace) from the per-result counters
    # to bound series cardinality. All policies here are CEL ValidatingPolicies and no
    # dashboard groups by these labels. Kyverno reads this at start-up, so the active
    # controller Deployments (admission + reports) need a restart after a change; the
    # old series then expire on their own.
    metricsConfig:
      metricsExposure:
        kyverno_policy_results_total: null
        kyverno_admission_requests_total: null
        kyverno_cleanup_controller_deletedobjects_total: null
        kyverno_validating_policy_results_total: null
        kyverno_mutating_policy_results_total: null
        kyverno_generating_policy_results_total: null
        kyverno_image_validating_policy_results_total: null
        kyverno_policy_results:
          disabledLabelDimensions: ["resource_namespace", "policy_namespace"]
        kyverno_admission_requests:
          disabledLabelDimensions: ["resource_namespace"]
        kyverno_cleanup_controller_deletedobjects:
          disabledLabelDimensions: ["resource_namespace", "policy_namespace"]
        kyverno_validating_policy_results:
          disabledLabelDimensions: ["resource_namespace", "policy_namespace"]
        kyverno_validating_policy_execution_duration:
          disabledLabelDimensions: ["resource_namespace", "policy_namespace", "resource_request_operation"]
        kyverno_validating_policy_execution_duration_seconds:
          disabledLabelDimensions: ["resource_namespace", "policy_namespace", "resource_request_operation"]
        kyverno_mutating_policy_results:
          disabledLabelDimensions: ["resource_namespace", "policy_namespace"]
        kyverno_generating_policy_results:
          disabledLabelDimensions: ["resource_namespace", "policy_namespace"]
        kyverno_image_validating_policy_results:
          disabledLabelDimensions: ["resource_namespace", "policy_namespace"]
    # Make Kyverno skip platform namespaces entirely. kube-system, kube-public,
    # kube-node-lease and Kyverno's own namespace are already in the chart's default
    # resourceFilters, so only the extra ones are listed.
    #
    # Do NOT use `resourceFiltersExcludeNamespaces` for this: despite the name it
    # REMOVES a namespace from those default filters (the template drops every filter
    # containing `,<ns>,`), i.e. it makes Kyverno evaluate that namespace.
    config:
      resourceFiltersIncludeNamespaces:
        - flux-system
        - cert-manager
    features:
      # No PolicyExceptions exist. Disable unused exception support; both active
      # policies already use CEL. Kyverno 1.19's compatibility controllers may
      # still watch the deprecated API even with this feature disabled.
      policyExceptions:
        enabled: false
        namespace: kyverno
      autoUpdateWebhooks:
        enabled: true
