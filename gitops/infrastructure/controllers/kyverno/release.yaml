apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      # Chart v3.9.0 ships Kyverno v1.19.0.
      # Cluster is k8s 1.36.2 (supported, k8s >= 1.25 required).
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 12h
  install:
    createNamespace: true
    # Chart v3 ships CRDs as templated resources owned by the release (crds.install below).
    # Do NOT set this to CreateReplace — it conflicts with Kyverno's owned CRDs
    # (error: "cannot be imported into the current release: invalid ownership metadata").
    crds: Skip
  upgrade:
    crds: Skip
  values:
    # v3 CRD management: Kyverno templates + owns the CRDs (Helm/Flux applies them).
    crds:
      install: true
    admissionController:
      replicas: 1
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    backgroundController:
      replicas: 1
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "200m"
    cleanupController:
      replicas: 1
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "200m"
    reportsController:
      replicas: 1
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "200m"
    # Exclude platform/system namespaces from all policy enforcement.
    config:
      resourceFiltersExcludeNamespaces:
        - kube-system
        - kyverno
        - flux-system
        - cert-manager
        - cilium
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
      autoUpdateWebhooks:
        enabled: true
