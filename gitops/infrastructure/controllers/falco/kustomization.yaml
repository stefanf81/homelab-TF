apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
# Migration, step 2 of 2 (step 1 added this annotation) (Flux FAQ "How can I safely move resources from one dir
# to another?"): Falco moves out of infra-controllers into its own Kustomization,
# so an unhealthy Falco no longer blocks every Kustomization that depends on
# infra-controllers. Keep this annotation until `flux tree ks falco` lists the
# namespace, OCIRepository and HelmRelease and `flux tree ks infra-controllers`
# no longer does; then remove it in a follow-up commit.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
