apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: falco
  namespace: falco
spec:
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Falco chart 9.2.0 -> Falco 0.45.0. Cluster runs Ubuntu 26.04 /
    # kernel 7.0, where Falco 0.44.1 (chart 9.1.0) crashes with
    # "could not parse param ... type 223 (clone)" (falcosecurity/falco#3955).
    # The fix landed in 0.45.0; do not go back below chart 9.2.0.
    tag: 9.2.2
  url: oci://ghcr.io/falcosecurity/charts/falco
