apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: falco
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Use modern eBPF driver which is fully supported on modern kernels (Ubuntu 26.04).
    driver:
      kind: modern_ebpf

    # Memory is capped; CPU is not: a throttled Falco falls behind the syscall stream
    # and drops events.
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        memory: "1024Mi"

    # Enable Prometheus metrics endpoint (port 8765 by default)
    metrics:
      enabled: true

    # Enable Falcosidekick to write native Kubernetes PolicyReports
    falcosidekick:
      enabled: true
      image:
        # renovate: datasource=docker depName=falcosecurity/falcosidekick
        tag: 2.35.0
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      config:
        policyreport:
          enabled: true
          minimumpriority: "notice"
