apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 30m
  chart:
    spec:
      chart: falco
      # Falco chart v9.2.0-rc1 -> Falco 0.45.0-rc2. Cluster runs Ubuntu 26.04 /
      # kernel 7.0, where Falco 0.44.1 (chart 9.1.0) crashes with
      # "could not parse param ... type 223 (clone)" (falcosecurity/falco#3955).
      # The fix landed in the 0.45.0 line; drop this RC pin once 0.45.0 GA ships.
      version: 9.2.0-rc1
      sourceRef:
        kind: HelmRepository
        name: falco
        namespace: falco
      interval: 12h
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Use modern eBPF driver which is fully supported on modern kernels (Ubuntu 26.04).
    driver:
      kind: modern_ebpf

    # Restrict Falco DaemonSet resource footprint to protect homelab CPU/memory
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"

    # Enable Prometheus metrics endpoint (port 8765 by default)
    metrics:
      enabled: true

    # Enable Falcosidekick to write native Kubernetes PolicyReports
    falcosidekick:
      enabled: true
      image:
        # renovate: datasource=docker depName=falcosecurity/falcosidekick
        tag: 2.35.0
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      config:
        policyreport:
          enabled: true
          minimumpriority: "notice"
