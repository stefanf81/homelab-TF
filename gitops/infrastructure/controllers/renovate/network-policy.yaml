apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-updater
    app.kubernetes.io/part-of: infrastructure
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Renovate needs cluster DNS plus HTTPS access to GitHub, registries, and Helm
# repositories. It has no inbound or Kubernetes API access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-https
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-updater
    app.kubernetes.io/part-of: infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: renovate
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
---
# The namespace-scoped operator needs only DNS and the Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-kubernetes-api
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-updater
    app.kubernetes.io/part-of: infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: renovate-operator
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.50.55/32
      ports:
        - port: 6443
          protocol: TCP
