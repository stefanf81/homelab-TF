apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-updater
    app.kubernetes.io/part-of: infrastructure
spec:
  # Evaluated in Europe/Brussels by the operator's TZ environment variable.
  schedule: "17 3 * * *"
  image: renovate/renovate:44.82.0
  provider:
    name: github
  discoveryFilters:
    - stefanf81/homelab-TF
  secretRef: renovate
  renovateConfig:
    configMapRef:
      name: renovate-config
      key: config.json
  extraEnv:
    - name: LOG_LEVEL
      value: info
  parallelism: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  serviceAccount:
    name: renovate
    automountServiceAccountToken: false
  metadata:
    labels:
      app.kubernetes.io/name: renovate
      app.kubernetes.io/component: dependency-updater
      app.kubernetes.io/part-of: infrastructure
  securityContext:
    pod:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
