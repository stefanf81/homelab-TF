apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-updater
    app.kubernetes.io/part-of: infrastructure
spec:
  interval: 30m
  chart:
    spec:
      chart: renovate-operator
      version: 6.3.0
      sourceRef:
        kind: HelmRepository
        name: mogenius
        namespace: renovate
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: renovate-operator
    crd:
      install: true
      mode: template
    deployment:
      podLabels:
        app.kubernetes.io/name: renovate-operator
    rbac:
      ownNamespaceOnly: true
    config:
      defaultJobBackoffLimit: 1
      defaultJobActiveDeadlineSeconds: 1800
      jobTTLSecondsAfterFinished: 86400
      globalParallelismLimit: 1
    policy:
      enabled: true
      allowedHosts:
        - api.github.com
        - github.com
      requireSecretRefOptIn: true
      allowedServiceAccounts:
        - renovate
      allowedImages:
        - renovate/renovate
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    extraEnv:
      - name: TZ
        value: Europe/Brussels
