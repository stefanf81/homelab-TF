apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.19.6
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    ipam:
      mode: "kubernetes"
    kubeProxyReplacement: true
    devices: "eth0" # Exclude tailscale0 to prevent any eBPF and Tailscale routing conflicts
    bpf:
      masquerade: false # Disabled: BPF masquerade SNATs Envoy→pod upstream connections which breaks conntrack matching for ingress-identity flows on single-node clusters. Pod internet egress falls back to iptables MASQUERADE via k3s.
    securityContext:
      capabilities:
        cleanCiliumState:
          - NET_ADMIN
    operator:
      replicas: 1 # Optimized for single-node cluster
    gatewayAPI:
      enabled: true # Enable the Gateway API controller inside Cilium
    l2announcements:
      enabled: true
