apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    ipam:
      mode: "kubernetes"
    kubeProxyReplacement: true
    devices: "eth0" # Exclude tailscale0 to prevent any eBPF and Tailscale routing conflicts
    bpf:
      masquerade: true # Offload SNAT to eBPF (requires kubeProxyReplacement: true, already set)
      hostLegacyRouting: false # Disable eBPF host routing to prevent routing loops for host-network Envoy proxies in single-node clusters
    securityContext:
      capabilities:
        cleanCiliumState:
          - NET_ADMIN
    operator:
      replicas: 1 # Optimized for single-node cluster
    gatewayAPI:
      enabled: true # Enable the Gateway API controller inside Cilium
    l2announcements:
      enabled: true
