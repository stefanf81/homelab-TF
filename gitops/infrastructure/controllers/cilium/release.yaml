apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cilium
  install:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    ipam:
      mode: "kubernetes"
    kubeProxyReplacement: true
    # Pin the API server endpoint explicitly. With kube-proxy replacement the agent
    # must not depend on the ClusterIP path it is itself providing; the node IP is
    # the documented k3s pattern (k3s exposes :6443 on all interfaces).
    k8sServiceHost: "${NODE_IP}"
    k8sServicePort: 6443
    devices: "eth0" # Exclude tailscale0 to prevent any eBPF and Tailscale routing conflicts
    bpf:
      masquerade: true # Offload SNAT to eBPF (requires kubeProxyReplacement: true, already set)
      # false => eBPF host routing is ENABLED (legacy host stack disabled). Kept false
      # to avoid routing loops for host-network Envoy proxies in single-node clusters.
      hostLegacyRouting: false
    # WireGuard adds no value until a second node exists (all traffic is node-local);
    # enable together with the first worker node.
    encryption:
      enabled: false
    # Restart the agents when cilium-config changes. Without this a Helm value change
    # updates the ConfigMap but the running agents keep the old configuration until
    # something else restarts them.
    rollOutCiliumPods: true
    # Agent resources (the chart ships none). No CPU limit: CFS throttling stretches
    # endpoint regeneration after policy/config changes (docs/reports/PERF_DEEP_DIVE_2026-10.md §3).
    resources:
      requests:
        cpu: 100m
        # Steady 300-490Mi, 14d peak 548Mi (2026-11-03).
        memory: 384Mi
      limits:
        memory: 1Gi
    operator:
      replicas: 1 # Optimized for single-node cluster
      rollOutPods: true
      # cilium-operator runs with hostNetwork: true and binds host ports (:9234, :9963).
      # With the chart default (maxSurge: 25%, maxUnavailable: 50%) Kubernetes tries to
      # schedule a surge pod before terminating the old one; on a single-node cluster
      # the new pod fails hostPort/anti-affinity scheduling and churns ReplicaSet pods.
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      # Leader election: renew every 15s instead of 2s. The operator's Lease was
      # rewritten every 2s, ~0.45 writes/s to k3s's SQLite datastore (~59 GB/day on
      # the only NVMe, 2026-11-03, docs/NODE_HOST_TUNING.md §4.5). The longer renew
      # deadline also rides out short k3s API restarts instead of losing the lease
      # (and restarting the operator) after 10s. client-go requires
      # renew-deadline > 1.2 x retry-period and lease-duration > renew-deadline.
      extraArgs:
        - --leader-election-lease-duration=60s
        - --leader-election-renew-deadline=40s
        - --leader-election-retry-period=15s
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      prometheus:
        enabled: true # operator metrics service (VMServiceScrape)
        metricsService: true # actually create the headless Service (enabled alone only opens the port)
    prometheus:
      enabled: true # agent metrics service (VMServiceScrape)
      metricsService: true
    # Per-node Envoy (DaemonSet, hostNetwork: true) terminates every Gateway request.
    # The chart sets no resources, which left the data plane without a CPU share
    # under contention and with the worst OOM score on the node.
    envoy:
      rollOutPods: true
      # Explicitly pin xdsMode so cilium-config (envoy-xds-mode) and
      # cilium-envoy-config (bootstrap-config.json) always agree across
      # chart upgrades even if SSA field ownership drifts.
      xdsMode: "split"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    # EDT/fq pacing plus BBR congestion control. The agent applies the sysctls in the
    # host namespace (net.core.default_qdisc=fq, tcp_congestion_control=bbr,
    # tcp_slow_start_after_idle=0), so they also cover the host-network Envoy's
    # connections to Cloudflare; pods get BBR on new sockets (kernel >= 5.18 and eBPF
    # host routing, both present). Existing sockets keep CUBIC: restart cilium-envoy
    # and the workloads after this rolls out (docs/reports/PERF_DEEP_DIVE_2026-10.md §4.4).
    bandwidthManager:
      enabled: true
      bbr: true
    gatewayAPI:
      enabled: true # Enable the Gateway API controller inside Cilium
      gatewayClass:
        # The `cilium` GatewayClass is managed by Git in
        # gitops/infrastructure/configs/gatewayclass.yaml; letting the chart create
        # it as well causes Helm/Flux ownership conflicts on upgrades.
        create: "false"
    l2announcements:
      enabled: true
      # The lease holder renews every leaseRetryPeriod (chart default 2s), which is
      # a Lease write to k3s's SQLite datastore every 2s per announced IP, forever.
      # With one node nothing fails over and a restarted agent re-acquires its own
      # lease at once, so longer timers cost nothing today. Once a second node
      # joins, leaseDuration is the worst-case ARP failover time.
      # docs/reports/CILIUM_REVIEW_2026-10.md §4.1
      # 2026-11-03: 60s/40s/15s like the other Leases (docs/NODE_HOST_TUNING.md §4.5).
      # Renewals follow leaseRetryPeriod (client-go leader election): at 5s this was
      # the busiest Lease left, 110 writes per window against the 10s node lease's 54.
      leaseDuration: 60s
      leaseRenewDeadline: 40s
      leaseRetryPeriod: 15s
    # Resources for the Hubble certificate jobs (hubble.tls.auto.method below). The
    # chart ships none; cilium-certgen runs for a few seconds.
    certgen:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    hubble:
      enabled: true
      # Hubble mTLS certificates (agent server cert, Relay client cert).
      # The chart default `method: helm` generates them once with 365 days validity
      # and then copies the existing Secrets on every upgrade (`lookup`), so nothing
      # ever renewed them: a year after the first install Relay can no longer
      # connect to the agent, and the UI and `hubble observe` go empty without any
      # other symptom. `cronJob` runs cilium-certgen as a Job when the release first
      # renders it (or its spec changes) and then on the schedule below; each run
      # issues new leaf certificates from the `cilium-ca` Secret, and the agent and
      # Relay reload them from the mounted Secrets without a restart. Three runs fit
      # into one validity period, so one missed run is harmless.
      # Not `certmanager`: scripts/bootstrap-foundation.sh installs Cilium before
      # cert-manager exists (and cert-manager needs the CNI to start), so a release
      # that renders Certificate objects could not be installed on a new node.
      # The certgen image is digest-pinned by the chart (certgen.image).
      # The CA (cilium-ca, created by certgen with 3 years validity) is reused and
      # not renewed; about two years in, the runs start failing on purpose (the CA
      # would expire before new 365-day leaves). Rotation: docs/HUBBLE_SETUP.md
      # "mTLS certificates". A failed run shows as a failed Job in kube-system.
      tls:
        auto:
          method: cronJob
          certValidityDuration: 365
          # 03:17 on the 1st of every fourth month (chart default is midnight).
          schedule: "17 3 1 */4 *"
      relay:
        enabled: true
        rollOutPods: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
      ui:
        enabled: true
        rollOutPods: true
        # The chart has no `hubble.ui.resources`; it reads one block per container.
        # The previous top-level block was silently ignored.
        backend:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
        frontend:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          # `http` is deprecated in Cilium 1.20; httpV2 supersedes it (cannot run both).
          - httpV2
      # Flow log export for per-IP drop visibility in Grafana. The agent writes
      # rotated JSON lines to /var/run/cilium/hubble/events.log, which Alloy
      # tails and ships to Loki (job=hubble-flows). Only DROPPED/ERROR flows are
      # exported to keep volume low.
      export:
        static:
          enabled: true
          filePath: /var/run/cilium/hubble/events.log
          fileMaxSizeMb: 10
          fileMaxBackups: 5
          fileCompress: false
          allowList:
            - '{"verdict":["DROPPED","ERROR"]}'
          fieldMask:
            - time
            - verdict
            - drop_reason_desc
            - is_reply
            - traffic_direction
            - IP
            - l4
            - source.identity
            - source.namespace
            - source.pod_name
            - destination.identity
            - destination.namespace
            - destination.pod_name
            - node_name
