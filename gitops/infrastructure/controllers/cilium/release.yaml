apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.19.6
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    ipam:
      mode: "kubernetes"
    kubeProxyReplacement: true
    devices: "eth0" # Exclude tailscale0 to prevent any eBPF and Tailscale routing conflicts
    bpf:
      masquerade: true # Offload SNAT to eBPF (requires kubeProxyReplacement: true, already set)
      hostRouting: true # Required for Cilium Gateway API: Envoy (running in host netns on 127.0.0.1:15058) needs eBPF host routing to deliver SYN-ACKs back to pod veth pairs during L7 proxy redirect. Setting this to false breaks Gateway traffic with a "SYN sent, no SYN-ACK returned" signature (confirmed via tcpdump on the pod veth).
    securityContext:
      capabilities:
        cleanCiliumState:
          - NET_ADMIN
    operator:
      replicas: 1 # Optimized for single-node cluster
    gatewayAPI:
      enabled: true # Enable the Gateway API controller inside Cilium
    l2announcements:
      enabled: true
