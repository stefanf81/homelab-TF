apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.16.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    ipam:
      mode: "kubernetes"
    kubeProxyReplacement: true
    securityContext:
      capabilities:
        cleanCiliumState:
          - NET_ADMIN
    operator:
      replicas: 1 # Optimized for single-node cluster
    gatewayAPI:
      enabled: true # Enable the Gateway API controller inside Cilium
    l2announcements:
      enabled: true
