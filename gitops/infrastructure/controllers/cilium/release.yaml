apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cilium
  install:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    ipam:
      mode: "kubernetes"
    kubeProxyReplacement: true
    # Pin the API server endpoint explicitly. With kube-proxy replacement the agent
    # must not depend on the ClusterIP path it is itself providing; the node IP is
    # the documented k3s pattern (k3s exposes :6443 on all interfaces).
    k8sServiceHost: "192.168.50.55"
    k8sServicePort: 6443
    devices: "eth0" # Exclude tailscale0 to prevent any eBPF and Tailscale routing conflicts
    bpf:
      masquerade: true # Offload SNAT to eBPF (requires kubeProxyReplacement: true, already set)
      # false => eBPF host routing is ENABLED (legacy host stack disabled). Kept false
      # to avoid routing loops for host-network Envoy proxies in single-node clusters.
      hostLegacyRouting: false
    # WireGuard adds no value until a second node exists (all traffic is node-local);
    # enable together with the first worker node.
    encryption:
      enabled: false
    # Restart the agents when cilium-config changes. Without this a Helm value change
    # updates the ConfigMap but the running agents keep the old configuration until
    # something else restarts them.
    rollOutCiliumPods: true
    # Agent resources (the chart ships none). No CPU limit: CFS throttling stretches
    # endpoint regeneration after policy/config changes (docs/reports/PERF_DEEP_DIVE_2026-10.md §3).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    operator:
      replicas: 1 # Optimized for single-node cluster
      rollOutPods: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      prometheus:
        enabled: true # operator metrics service (VMServiceScrape)
        metricsService: true # actually create the headless Service (enabled alone only opens the port)
    prometheus:
      enabled: true # agent metrics service (VMServiceScrape)
      metricsService: true
    # Per-node Envoy (DaemonSet, hostNetwork: true) terminates every Gateway request.
    # The chart sets no resources, which left the data plane without a CPU share
    # under contention and with the worst OOM score on the node.
    envoy:
      rollOutPods: true
      # Explicitly pin xdsMode so cilium-config (envoy-xds-mode) and
      # cilium-envoy-config (bootstrap-config.json) always agree across
      # chart upgrades even if SSA field ownership drifts.
      xdsMode: "split"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    # EDT/fq pacing plus BBR congestion control. The agent applies the sysctls in the
    # host namespace (net.core.default_qdisc=fq, tcp_congestion_control=bbr,
    # tcp_slow_start_after_idle=0), so they also cover the host-network Envoy's
    # connections to Cloudflare; pods get BBR on new sockets (kernel >= 5.18 and eBPF
    # host routing, both present). Existing sockets keep CUBIC: restart cilium-envoy
    # and the workloads after this rolls out (docs/reports/PERF_DEEP_DIVE_2026-10.md §4.4).
    bandwidthManager:
      enabled: true
      bbr: true
    gatewayAPI:
      enabled: true # Enable the Gateway API controller inside Cilium
      gatewayClass:
        # The `cilium` GatewayClass is managed by Git in
        # gitops/infrastructure/configs/gatewayclass.yaml; letting the chart create
        # it as well causes Helm/Flux ownership conflicts on upgrades.
        create: "false"
    l2announcements:
      enabled: true
    hubble:
      enabled: true
      relay:
        enabled: true
        rollOutPods: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
      ui:
        enabled: true
        rollOutPods: true
        # The chart has no `hubble.ui.resources`; it reads one block per container.
        # The previous top-level block was silently ignored.
        backend:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
        frontend:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          # `http` is deprecated in Cilium 1.20; httpV2 supersedes it (cannot run both).
          - httpV2
      # Flow log export for per-IP drop visibility in Grafana. The agent writes
      # rotated JSON lines to /var/run/cilium/hubble/events.log, which Alloy
      # tails and ships to Loki (job=hubble-flows). Only DROPPED/ERROR flows are
      # exported to keep volume low.
      export:
        static:
          enabled: true
          filePath: /var/run/cilium/hubble/events.log
          fileMaxSizeMb: 10
          fileMaxBackups: 5
          fileCompress: false
          allowList:
            - '{"verdict":["DROPPED","ERROR"]}'
          fieldMask:
            - time
            - verdict
            - drop_reason_desc
            - is_reply
            - traffic_direction
            - IP
            - l4
            - source.identity
            - source.namespace
            - source.pod_name
            - destination.identity
            - destination.namespace
            - destination.pod_name
            - node_name
