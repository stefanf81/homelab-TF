apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.19.6
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    ipam:
      mode: "kubernetes"
    kubeProxyReplacement: true
    devices: "eth0" # Exclude tailscale0 to prevent any eBPF and Tailscale routing conflicts
    bpf:
      masquerade: true # Offload SNAT to eBPF (requires kubeProxyReplacement: true, already set)
      hostRouting: true # Required for Cilium Gateway API in single-node cluster: Envoy upstream connections carry reserved:ingress identity. With hostRouting=false, the SYN-ACK return path from pod to host is broken for ingress-identified packets, causing Envoy upstream connect timeouts. The routing-loop concern was a Cilium 1.16-era bug; tested safe on 1.19.6.
    securityContext:
      capabilities:
        cleanCiliumState:
          - NET_ADMIN
    operator:
      replicas: 1 # Optimized for single-node cluster
    gatewayAPI:
      enabled: true # Enable the Gateway API controller inside Cilium
    l2announcements:
      enabled: true
