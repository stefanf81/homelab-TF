# Ingress default-deny for trivy-system.
#
# The built-in Trivy server (:4954) serves the vulnerability DB to the scan jobs,
# which run in this namespace; nothing outside it has a reason to connect.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-system-ingress-default-deny
  namespace: trivy-system
spec:
  endpointSelector: {}
  ingress:
    # Kubelet probes and admin `kubectl port-forward`.
    - fromEntities:
        - host
---
# Scan job pods (client/server mode) -> Trivy server.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-scan-jobs-to-trivy-server
  namespace: trivy-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": trivy-system
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
---
# vmagent -> operator metrics (VMServiceScrape `trivy-operator`, container port 8080).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vmagent-to-trivy-operator
  namespace: trivy-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": vmagent
            "k8s:app.kubernetes.io/instance": victoria-metrics-k8s-stack
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
