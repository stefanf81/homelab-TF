apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.38.1 # using a recent stable version
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: trivy-system
      interval: 12h
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Scan workload namespaces only: skip platform/system namespaces to save CPU
    # on the single node, cut report noise, and avoid scanning infra images.
    # (`security-scanning` is a leftover empty namespace, excluded defensively.)
    excludeNamespaces: "kube-system,kube-public,kube-node-lease,flux-system,cert-manager,kyverno,monitoring,policy-reporter,trivy-system,csi-proxmox,falco,hubble-ui,renovate,security-scanning"
    trivy:
      ignoreUnfixed: false
      storageClassEnabled: true
      storageClassName: proxmox-csi
      # Built-in Trivy server (vulnerability DB cache). Mostly idle, so a small
      # request; the CPU limit stays (scanners keep their caps, unlike long-running
      # services). Chart default: 200m / 512Mi request, 1 CPU / 1Gi limit.
      # 14d peak 91Mi (2026-10-22); the 1Gi limit stays for DB updates.
      server:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
    operator:
      vulnerabilityScannerEnabled: true
      sbomGenerationEnabled: false
      configAuditScannerEnabled: true
      configAuditScannerScanOnlyCurrentRevisions: true
      rbacAssessmentScannerEnabled: true
      infraAssessmentScannerEnabled: true
      exposedSecretScannerEnabled: true
      clusterComplianceEnabled: true
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      scanJobTimeout: 5m
      builtInTrivyServer: true
      scanJobsConcurrentLimit: 1
      scanNodeCollectorLimit: 1
      # Findings metrics (trivy_image_vulnerabilities, trivy_resource_configaudits,
      # trivy_image_exposedsecrets, ...) power the Grafana "Trivy Security" dashboard.
      # Without this they are absent and the dashboard is empty.
      metricsFindingsEnabled: true
      # Scan jobs run in trivy-system and cannot see the imagePullSecret in the
      # taskflow namespace; map the namespace to its registry credential so private
      # ghcr.io images can be pulled and scanned.
      privateRegistryScanSecretsNames:
        taskflow: ghcr-pull-secret
    compliance:
      failEntriesLimit: 10
      reportType: all
      cron: "0 */6 * * *"
      specs:
        - k8s-nsa-1.0
        - k8s-cis-1.23
        - k8s-pss-baseline-0.1
        - k8s-pss-restricted-0.1
    trivyOperator:
      reportRecordFailedChecksOnly: true
    targetNamespaces: ""
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
