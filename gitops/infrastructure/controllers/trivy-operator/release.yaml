apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.33.1 # using a recent stable version
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: trivy-system
      interval: 12h
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    trivy:
      ignoreUnfixed: false
      storageClassEnabled: true
      storageClassName: proxmox-csi
      # Limit scan job resources to increase stability/memory limits
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
    # Continuously scan workloads
    operator:
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      exposedSecretScannerEnabled: false # Disable secret scanning to reduce time & cache lock errors
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      # Continuous monitoring - rescan on schedule
      scanJobTimeout: 5m
      builtInTrivyServer: true # Enable built-in server
    targetNamespaces: "" # Scan all namespaces
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
