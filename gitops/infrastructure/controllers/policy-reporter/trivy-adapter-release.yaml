apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator-polr-adapter
  namespace: policy-reporter
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator-polr-adapter
      version: 0.11.5
      sourceRef:
        kind: HelmRepository
        name: trivy-operator-polr-adapter
        namespace: policy-reporter
      interval: 12h
  install:
    createNamespace: true
  values:
    # WatchList client (client-go >= v0.35) hangs cache sync on startup
    # (fjogeleit/trivy-operator-polr-adapter#394); fall back to List+Watch.
    useWatchList: false
    crds:
      # Kyverno already owns the wgpolicyk8s.io PolicyReport CRDs.
      install: false
    adapters:
      vulnerabilityReports:
        enabled: true
        timeout: 10
      configAuditReports:
        enabled: true
        timeout: 10
      rbacAssessmentReports:
        enabled: true
        timeout: 10
      exposedSecretReports:
        enabled: true
        timeout: 10
      complianceReports:
        enabled: true
        timeout: 10
      infraAssessmentReports:
        enabled: true
        timeout: 10
      clusterInfraAssessmentReports:
        enabled: true
        timeout: 10
      clusterVulnerabilityReports:
        enabled: true
        timeout: 10
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
