apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator-polr-adapter
  namespace: policy-reporter
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator-polr-adapter
      version: 0.11.5
      sourceRef:
        kind: HelmRepository
        name: trivy-operator-polr-adapter
        namespace: policy-reporter
      interval: 12h
  install:
    createNamespace: true
  values:
    useWatchList: true
    crds:
      # Kyverno already owns the wgpolicyk8s.io PolicyReport CRDs.
      install: false
    adapters:
      vulnerabilityReports:
        enabled: true
      configAuditReports:
        enabled: true
      rbacAssessmentReports:
        enabled: true
      exposedSecretReports:
        enabled: true
      complianceReports:
        enabled: true
      infraAssessmentReports:
        enabled: true
      clusterInfraAssessmentReports:
        enabled: true
      clusterVulnerabilityReports:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
