apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: policy-reporter
spec:
  interval: 30m
  chart:
    spec:
      chart: policy-reporter
      # Chart v3.10.0 -> Policy Reporter / UI app v3.10.0. Cluster is k8s 1.36.2.
      version: 3.10.0
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: policy-reporter
      interval: 12h
  install:
    createNamespace: true
    # PolicyReport CRDs (wgpolicyk8s.io) are already installed by Kyverno.
    # This chart provides none of its own, so skip CRD handling in Flux.
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    replicaCount: 1
    # Enable the REST API to receive external events (e.g. Falco alerts)
    rest:
      enabled: true
    # Expose /metrics for the VMServiceScrape (dashboard + alerting).
    metrics:
      enabled: true
      mode: detailed
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
    # Kyverno and Trivy plugins enrich the UI with descriptions & vulnerability data.
    plugin:
      kyverno:
        enabled: true
      trivy:
        enabled: true
    # Policy Reporter UI subchart (service: policy-reporter-ui:8080).
    # Leaving ui.clusters omitted allows Helm to generate the single 'default'
    # cluster secret dynamically containing Kyverno and Trivy plugins safely.
    ui:
      enabled: true
      sources:
        - name: Trivy Vulnerability
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy ConfigAudit
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy RbacAssessment
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy ExposedSecrets
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy Compliance
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy InfraAssessment
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
      oauth:
        # SECURITY: the built-in GitHub OAuth has no user/org allow-list, so it is
        # disabled. The UI is fronted by oauth2-proxy instead
        # (oauth2-proxy-release.yaml, github_users = ["stefanf81"]).
        # The old secret in policy-reporter-secrets.yaml is now unused.
        enabled: false
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
