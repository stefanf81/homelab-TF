apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: policy-reporter
spec:
  interval: 30m
  chart:
    spec:
      chart: policy-reporter
      # Chart v3.9.1 -> Policy Reporter / UI app v3.9.0. Cluster is k8s 1.36.2.
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: policy-reporter
      interval: 12h
  install:
    createNamespace: true
    # PolicyReport CRDs (wgpolicyk8s.io) are already installed by Kyverno.
    # This chart provides none of its own, so skip CRD handling in Flux.
    crds: Skip
  upgrade:
    crds: Skip
  values:
    replicaCount: 1
    # Enable the REST API to receive external events (e.g. Falco alerts)
    rest:
      enabled: true
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"
    # Kyverno and Trivy plugins enrich the UI with descriptions & vulnerability data.
    plugin:
      kyverno:
        enabled: true
      trivy:
        enabled: true
    # Policy Reporter UI subchart (service: policy-reporter-ui:8080).
    # Leaving ui.clusters omitted allows Helm to generate the single 'default'
    # cluster secret dynamically containing Kyverno and Trivy plugins safely.
    ui:
      enabled: true
      sources:
        - name: Trivy Vulnerability
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy ConfigAudit
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy RbacAssessment
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy ExposedSecrets
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy Compliance
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
        - name: Trivy InfraAssessment
          type: severity
          exceptions: false
          excludes:
            results:
              - pass
              - skip
      oauth:
        enabled: true
        provider: github
        callbackUrl: https://kyverno.jokelab.dev/callback
        secretRef: policy-reporter-github-oauth
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
