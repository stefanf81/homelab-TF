apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-reporter-ui
  namespace: policy-reporter
spec:
  # Attach to the main TaskFlow Cilium Gateway (sectionName https => :443 only).
  # TLS is terminated by the Gateway using taskflow-tls-secret, which now includes
  # the kyverno.jokelab.dev SAN (see gitops/apps/taskflow/certificate.yaml).
  parentRefs:
    - name: taskflow-gateway
      namespace: taskflow
      sectionName: https
  hostnames:
    - "kyverno.jokelab.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Front the UI with the user-restricted oauth2-proxy (its built-in GitHub
        # OAuth supports no allow-list).
        - name: policy-reporter-ui-oauth2-proxy
          port: 80
