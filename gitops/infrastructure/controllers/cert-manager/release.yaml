apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  install:
    createNamespace: true
    # The chart ships an EMPTY crds/ directory: CRDs are rendered as chart
    # templates. Flux therefore has nothing to manage (its crds option only reads
    # crds/), so let Helm own the CRDs via crds.enabled + crds.keep — an upgrade
    # can then never delete them.
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
      keep: true
    extraArgs:
      - --enable-gateway-api
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
    startupapicheck:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
