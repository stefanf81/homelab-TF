# Flux Operator: installs, upgrades and self-heals Flux from the FluxInstance in
# gitops/infrastructure/flux-instance/. Its CRDs carry helm.sh/resource-policy:
# keep, so uninstalling this release does not delete the FluxInstance.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    crds: Create
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # No Web UI: Flux state is already visible through the flux CLI and Grafana.
    web:
      enabled: false
    # Leader election: renew every 15s instead of 5s (lease 60s, renew 40s), ~0.2
    # writes/s less to k3s's SQLite datastore (2026-11-03, docs/NODE_HOST_TUNING.md
    # §4.5). Chart 0.62.1 renders extraArgs verbatim and sets no such flags.
    extraArgs:
      - --leader-election-lease-duration=60s
      - --leader-election-renew-deadline=40s
      - --leader-election-retry-period=15s
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: null
        memory: 512Mi
