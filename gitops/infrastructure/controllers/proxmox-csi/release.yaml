apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi-plugin
  namespace: csi-proxmox
spec:
  interval: 30m
  chart:
    spec:
      chart: proxmox-csi-plugin
      version: 0.5.12
      sourceRef:
        kind: HelmRepository
        name: proxmox-csi
        namespace: csi-proxmox
  install:
    createNamespace: true
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Pin the controller image to the latest plugin version (chart default may lag)
    controller:
      plugin:
        image:
          # renovate: datasource=docker depName=ghcr.io/sergelogvinov/proxmox-csi-controller
          tag: v0.20.0
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
    # Chart ships no requests/limits for the node plugin; cap it on the shared node.
    node:
      plugin:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
    existingConfigSecret: proxmox-csi-config
    storageClass:
      - name: proxmox-csi
        storage: local-lvm
        volumeBindingMode: WaitForFirstConsumer
        reclaimPolicy: Retain
        fstype: ext4
        cache: writethrough
        ssd: true
