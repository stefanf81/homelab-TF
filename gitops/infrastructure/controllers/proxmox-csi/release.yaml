apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi-plugin
  namespace: csi-proxmox
spec:
  interval: 30m
  chart:
    spec:
      chart: proxmox-csi-plugin
      version: 0.5.9
      sourceRef:
        kind: HelmRepository
        name: proxmox-csi
        namespace: csi-proxmox
  install:
    createNamespace: true
  values:
    # Pin the controller image to the latest plugin version (chart default may lag)
    controller:
      plugin:
        image:
          tag: v0.19.1
    existingConfigSecret: proxmox-csi-config
    storageClass:
      - name: proxmox-csi
        storage: local-lvm
        volumeBindingMode: WaitForFirstConsumer
        reclaimPolicy: Retain
        fstype: ext4
        cache: writethrough
        ssd: true
