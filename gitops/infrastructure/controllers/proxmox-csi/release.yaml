apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi-plugin
  namespace: csi-proxmox
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: proxmox-csi
  install:
    createNamespace: true
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Pin the controller image to the latest plugin version (chart default may lag)
    controller:
      plugin:
        image:
          # renovate: datasource=docker depName=ghcr.io/sergelogvinov/proxmox-csi-controller
          tag: v0.21.0
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
      # Leader election on the three sidecars: renew every 15s instead of 5s
      # (lease 60s, renew 40s; kubernetes-csi defaults 15s/10s/5s), ~0.4 writes/s
      # less to k3s's SQLite datastore (kine breakdown 2026-11-03,
      # docs/NODE_HOST_TUNING.md §4.5). Chart 0.5.13 appends controller.<sidecar>.args
      # after its own --leader-election flag.
      attacher:
        args:
          - --leader-election-lease-duration=60s
          - --leader-election-renew-deadline=40s
          - --leader-election-retry-period=15s
      provisioner:
        args:
          - --leader-election-lease-duration=60s
          - --leader-election-renew-deadline=40s
          - --leader-election-retry-period=15s
      resizer:
        args:
          - --leader-election-lease-duration=60s
          - --leader-election-renew-deadline=40s
          - --leader-election-retry-period=15s
    # Chart ships no requests/limits for the node plugin; cap it on the shared node.
    node:
      plugin:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
    existingConfigSecret: proxmox-csi-config
    storageClass:
      - name: proxmox-csi
        storage: local-lvm
        volumeBindingMode: WaitForFirstConsumer
        reclaimPolicy: Retain
        fstype: ext4
        cache: writethrough
        ssd: true
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
      # Database volumes. `cache: none` is the Proxmox default: no host page cache
      # (Postgres already caches in shared_buffers and the guest page cache), and
      # guest fsyncs are still honoured. `cache` cannot change on an existing
      # volume, so Postgres moves here when its data moves to a new PVC
      # (docs/reports/PERF_DEEP_DIVE_2026-10.md §5.3 has a pg_test_fsync benchmark Job).
      - name: proxmox-csi-db
        storage: local-lvm
        volumeBindingMode: WaitForFirstConsumer
        reclaimPolicy: Retain
        fstype: ext4
        cache: none
        ssd: true
        mountOptions:
          - noatime
