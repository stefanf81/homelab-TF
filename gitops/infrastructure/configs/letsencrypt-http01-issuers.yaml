apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01-staging
spec:
  acme:
    email: stefan_faes@hotmail.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-http01-staging-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: taskflow-gateway
                namespace: taskflow
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01-production
spec:
  acme:
    email: stefan_faes@hotmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-http01-production-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: taskflow-gateway
                namespace: taskflow
