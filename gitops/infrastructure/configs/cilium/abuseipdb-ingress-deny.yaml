# =============================================================================
# ACTIVE — AbuseIPDB ingress deny for direct-to-origin traffic
# =============================================================================
# Enabled after the synchronizer was verified (10,000 validated entries,
# Cloudflare edge block confirmed with a controlled IP, both sinks identical).
#
# Rollback is instant: `kubectl delete ciliumclusterwidenetworkpolicy
# deny-abuseipdb-ingress` (no Cilium/Gateway/Caddy restart required). To also
# stop Flux from re-applying it, remove this file from
# gitops/infrastructure/configs/cilium/kustomization.yaml.
#
# SCOPE: `reserved:ingress` is the shared per-node Cilium Envoy identity, so
# this policy applies cluster-wide to every Gateway/Ingress listener (here:
# www.jokelab.dev, grafana., kyverno. and hubble.jokelab.dev).
#
# SOURCE-IP LIMITATION: the public hostnames are proxied by Cloudflare, so
# Cilium sees Cloudflare edge addresses for Internet traffic. This policy
# therefore protects direct-to-origin traffic (e.g. scanners hitting the WAN
# address with a forged Host header), LAN traffic and any future non-proxied
# listener. The Cloudflare edge sink covers the proxied traffic where the real
# client IP is visible. See docs/ABUSEIPDB_CILIUM_BLOCKLIST.md.
# =============================================================================
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-abuseipdb-ingress
  labels:
    app.kubernetes.io/name: abuseipdb-sync
    app.kubernetes.io/component: ip-reputation-feed
    app.kubernetes.io/part-of: infrastructure
    security-source: abuseipdb
spec:
  description: >-
    Reject external ingress traffic originating from IP addresses supplied by
    the AbuseIPDB reputation feed. Deny rules take precedence over all allow
    policies. The referenced CiliumCIDRGroup is maintained at runtime by the
    abuseipdb-sync controller and is never stored in Git.
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  ingressDeny:
    - fromCIDRSet:
        - cidrGroupRef: abuseipdb
  # Deny policies can put the selected endpoint into ingress default-deny mode.
  # The allow-all below makes that irrelevant (deny still wins) and keeps this
  # policy a pure denylist for traffic that was previously allowed.
  ingress:
    - fromEntities:
        - all
  enableDefaultDeny:
    ingress: false
