apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2
spec:
  # Scope eligible L2 announcer nodes to the homelab region (Cilium elects a
  # single Lease holder per LoadBalancer IP across matching nodes).
  nodeSelector:
    matchLabels:
      topology.kubernetes.io/region: homelab
  loadBalancerIPs: true
  externalIPs: true
  interfaces:
    - ^eth[0-9]+
    - ^enp[0-9]+
    - ^ens[0-9]+
