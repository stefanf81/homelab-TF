apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: taskflow
data:
  SPRING_PROFILES_ACTIVE: "prod"
  # Origins the browser may call /api from.
  # - https://jokelab.dev          : bare apex (documented access URL in
  #                                  GATEWAY_ACCESS_GUIDE.md / ARCHITECTURE.md;
  #                                  cert includes this SAN, so it must be allowed
  #                                  even though the Gateway 301-redirects apex->www)
  # - https://www.jokelab.dev      : canonical prod hostname (HTTPRoute hostnames +
  #                                  Gateway TLS cert + apex->www redirect all land here)
  # NOTE: there is NO `taskflow.local` origin anywhere in the live routes/cert/DNS —
  # the earlier comment referencing it was stale. If you ever serve the app from a
  # new hostname, add it here AND to certificate.yaml's dnsNames AND httproute.yaml's
  # hostnames, or the browser's /api calls will be CORS-rejected.
  APP_CORS_ALLOWED_ORIGINS: "https://${DOMAIN},https://www.${DOMAIN}"
  # Client-IP resolution (the backend's 20/min per-IP auth limiter keys on it).
  # Required since the hardened image: the prod profile has no default and aborts
  # startup without it.
  # Chain: client -> Cloudflare (PROXIED=true) -> Cilium Envoy -> backend WAF
  # (Caddy) -> backend. The backend's immediate peer is the taskflow-backend-waf
  # pod, whose IP is assigned from the Pod CIDR 10.42.0.0/16. Only that WAF may
  # reach backend:8080 (allow-backend-waf-to-backend in namespace-default-deny.yaml),
  # so trusting the Pod CIDR here does not let other pods spoof headers.
  # Single quotes: the JVM must receive single backslashes. Never write `\\.`
  # inside single quotes; inside double quotes it would have to be `\\.`.
  APP_TRUSTED_PROXY_REGEX: '^10\.42\.[0-9]{1,3}\.[0-9]{1,3}$'
  # Read the client IP from X-Real-IP, not X-Forwarded-For. The WAF overwrites
  # X-Real-IP with its validated {client_ip}, which already walks X-Forwarded-For
  # past the Cloudflare ranges and the Envoy peer. With the image default
  # (x-forwarded-for) Tomcat trusts only APP_TRUSTED_PROXY_REGEX, so its
  # right-to-left walk would stop at the Cloudflare edge address and every
  # visitor behind one edge node would share a rate-limit bucket.
  # Overrides server.tomcat.remoteip.remote-ip-header from application-prod.properties.
  SERVER_TOMCAT_REMOTEIP_REMOTEIPHEADER: "x-real-ip"
  # Shop time zone for "past booking", today/tomorrow reminder mails, the 90-day
  # booking window and review eligibility. The backend defaults to UTC.
  APP_SHOP_TIME_ZONE: "Europe/Brussels"
  # --- HTTP server tuning (prod) ---------------------------------------------
  # Response compression: shrink /api JSON (and other text) payloads over the wire.
  # 1 KiB floor avoids wasting CPU on tiny responses; explicit mime list keeps the
  # default text/* + application/json behaviours without compressing already-binary
  # or already-compressed content.
  SERVER_COMPRESSION_ENABLED: "true"
  SERVER_COMPRESSION_MIN_RESPONSE_SIZE: "1024"
  SERVER_COMPRESSION_MIME_TYPES: "application/json,application/xml,text/plain,text/html,text/css,application/javascript,application/x-javascript"
  # Upstream keep-alive (backend WAF -> backend): keep idle HTTP/1.1 connections
  # open so the Caddy hop reuses sockets instead of re-handshaking per request.
  # keep-alive-timeout=60s holds idle sockets; max-keep-alive-requests caps reuse per
  # socket (100 is a sane cap that still amortizes TCP+TLS-less handshake cost);
  # connection-timeout=5s bounds how long a socket may stay half-open.
  SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT: "60000"
  SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS: "100"
  SERVER_TOMCAT_CONNECTION_TIMEOUT: "5000"
