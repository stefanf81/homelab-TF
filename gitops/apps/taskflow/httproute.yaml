apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskflow-route
  namespace: taskflow
spec:
  parentRefs:
    - name: taskflow-gateway
  hostnames:
    - "taskflow.local"
  rules:
    # Route API traffic to the backend service
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8080

    # Route Jaeger UI traffic
    - matches:
        - path:
            type: PathPrefix
            value: /jaeger
      backendRefs:
        - name: jaeger-ui
          port: 16686

    # Route default web traffic to the frontend service
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
