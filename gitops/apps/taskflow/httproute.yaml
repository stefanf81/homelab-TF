apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskflow-route
  namespace: taskflow
spec:
  parentRefs:
    - name: taskflow-gateway
      sectionName: https # serve only on :443; plaintext :80 is redirected by http-to-https-redirect
  hostnames:
    - "www.jokelab.dev"
  rules:
    # The administrator event stream is intentionally long lived (30 minutes).
    # It must not inherit the 10-second request timeout for regular API calls.
    - matches:
        - path:
            type: Exact
            value: /api/v1/appointments/events
      timeouts:
        backendRequest: "31m"
      backendRefs:
        - name: taskflow-backend-waf
          port: 8080

    # Route API traffic to the backend service
    - matches:
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        backendRequest: "10s" # Fail fast for hung backend calls instead of exhausting gateway connections
      backendRefs:
        - name: taskflow-backend-waf
          port: 8080

    # Jaeger UI is intentionally NOT exposed through the Gateway: there is no auth in front
    # of it, so exposing /jaeger would leak full distributed traces (SQL, tokens, PII) to
    # anyone who can reach the Gateway. Reach it instead via:
    #   kubectl port-forward -n taskflow svc/jaeger-ui 16686:16686
    # OTLP trace ingest (4317/4318) still flows backend -> jaeger internally; see
    # network-policy.yaml (restrict-jaeger-access).

    # Route default web traffic to the frontend service
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: taskflow-frontend-waf
          port: 8080
