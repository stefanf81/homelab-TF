apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      # Allow in-flight requests to drain on rollout. Pair with server.shutdown=graceful in the
      # backend's prod profile so Spring finishes active requests before the pod is killed.
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-for-db
          image: alpine:3.19.1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          command: ["sh", "-c", "until nc -z -w 2 db 5432 && nc -z -w 2 redis 6379; do echo 'Waiting for database and redis...'; sleep 2; done;"]
      containers:
        - name: backend
          image: ghcr.io/stefanf81/taskflow-backend:latest
          # Always re-pull :latest so freshly-pushed builds are picked up on rollout
          # (IfNotPresent would reuse the node-cached image when the tag is unchanged).
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SPRING_PROFILES_ACTIVE
            - name: APP_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: APP_CORS_ALLOWED_ORIGINS
            - name: SPRING_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_SECURITY_PASSWORD
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            # Heap 1.5 GB fixed (not container-auto-sized). StringDeduplication is low-risk and
            # modestly reduces heap for string-heavy workloads. Metaspace/direct-memory caps are
            # intentionally omitted until measured — hard caps risk OOM if the framework or client
            # libraries need more off-heap memory.
            # GC/startup perf: AlwaysPreTouch removes first-touch page faults on the fixed heap,
            # ParallelRefProcEnabled speeds GC reference processing, DisableExplicitGC blocks
            # stop-the-world Full GCs triggered by System.gc().
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms1536m -Xmx1536m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+UseStringDeduplication -XX:+AlwaysPreTouch -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC"
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              cpu: "4000m"
              memory: 2560Mi
            requests:
              cpu: "1000m"
              memory: 2048Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: taskflow
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: taskflow-backend
  type: ClusterIP
