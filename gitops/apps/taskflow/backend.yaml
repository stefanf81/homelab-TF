apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      # Allow in-flight requests to drain on rollout. Pair with server.shutdown=graceful in the
      # backend's prod profile so Spring finishes active requests before the pod is killed.
      terminationGracePeriodSeconds: 45
      initContainers:
        # NOTE: intentionally uses the mutable alpine:3.20.3 tag (not a Flux digest pin)
        # because this is a transient init container, not a served image. Pin to a digest
        # if you want fully hermetic boots: image: alpine:3.20.3@sha256:<digest>
        - name: wait-for-db
          image: alpine:3.20.3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          command: ["sh", "-c", "until nc -z -w 2 db 5432 && nc -z -w 2 redis 6379; do echo 'Waiting for database and redis...'; sleep 2; done;"]
      containers:
        - name: backend
          # Flux image automation pins :latest to its current digest (see ImagePolicy
          # digestReflectionPolicy: Always). The marker below makes Flux rewrite this
          # line to repo:latest@sha256:<digest> whenever a new :latest is pushed,
          # committing the exact digest to Git -> auditable, automatic rollout.
          image: ghcr.io/stefanf81/taskflow-backend:latest@sha256:11e58f6c3cc5729f9b7b5e1244f751f547fdc4ede8424231d53e19b05ade9615 # {"$imagepolicy": "flux-system:taskflow-backend"}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SPRING_PROFILES_ACTIVE
            - name: APP_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: APP_CORS_ALLOWED_ORIGINS
            - name: SPRING_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_SECURITY_PASSWORD
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            # Heap 1.5 GB fixed (not container-auto-sized). StringDeduplication is low-risk and
            # modestly reduces heap for string-heavy workloads.
            # Off-heap IS now capped (see docs/PERFORMANCE.md #1.1): with -XX:+ExitOnOutOfMemoryError a
            # single benign off-heap spike would otherwise kill the JVM and restart the pod. Capping
            # metaspace + direct memory keeps native usage bounded and predictable; the 2Gi Guaranteed
            # QoS (requests==limits below) gives the full 1Gi heap + ~1G off-heap headroom
            # (256Mi metaspace + 512Mi direct + ~256Mi for thread stacks/GC).
            # GC/startup perf: AlwaysPreTouch removes first-touch page faults on the fixed heap,
            # ParallelRefProcEnabled speeds GC reference processing, DisableExplicitGC blocks
            # stop-the-world Full GCs triggered by System.gc().
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms1024m -Xmx1024m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+UseStringDeduplication -XX:+AlwaysPreTouch -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC -XX:MaxMetaspaceSize=256m -XX:MaxDirectMemorySize=512m"
          ports:
            - containerPort: 8080
              name: http
          resources:
            # Guaranteed QoS: requests == limits so the full memory budget is reserved (no
            # eviction under node pressure) and CPU is never throttled. 2Gi total − 1Gi heap
            # − 256Mi metaspace − 512Mi direct ≈ 256Mi for thread stacks/GC/native libs.
            # Trimmed from 3Gi→2Gi (heap 1.5→1 GiB) to free ~1 GiB on the 14 GiB node; the
            # app must not need >1 GiB heap under load or this will OOM.
            limits:
              cpu: "2000m"
              memory: 2Gi
            requests:
              cpu: "2000m"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: taskflow
  # `app: taskflow-backend` label lets the Prometheus ServiceMonitor in
  # gitops/monitoring/app select this Service (ServiceMonitor matches Service
  # labels, not the pod selector).
  labels:
    app: taskflow-backend
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: taskflow-backend
  type: ClusterIP
