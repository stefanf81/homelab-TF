apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      # Allow in-flight requests to drain on rollout. Pair with server.shutdown=graceful in the
      # backend's prod profile so Spring finishes active requests before the pod is killed.
      terminationGracePeriodSeconds: 45
      initContainers:
        # NOTE: intentionally uses the mutable alpine:3.24.1 tag (not a Flux digest pin)
        # because this is a transient init container, not a served image. Pin to a digest
        # if you want fully hermetic boots: image: alpine:3.24.1@sha256:<digest>
        - name: wait-for-db
          image: alpine:3.24.1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          command: ["sh", "-c", "until nc -z -w 2 db 5432 && nc -z -w 2 redis 6379; do echo 'Waiting for database and redis...'; sleep 2; done;"]
      containers:
        - name: backend
          # Flux image automation pins :latest to its current digest (see ImagePolicy
          # digestReflectionPolicy: Always). The marker below makes Flux rewrite this
          # line to repo:latest@sha256:<digest> whenever a new :latest is pushed,
          # committing the exact digest to Git -> auditable, automatic rollout.
          image: ghcr.io/stefanf81/taskflow-backend:latest@sha256:ec1b3989ee08b043b49abd095069b9727d5633011d1ede9bc93fab8fd2dbb734 # {"$imagepolicy": "flux-system:taskflow-backend"}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SPRING_PROFILES_ACTIVE
            - name: APP_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: APP_CORS_ALLOWED_ORIGINS
            - name: SERVER_COMPRESSION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SERVER_COMPRESSION_ENABLED
            - name: SERVER_COMPRESSION_MIN_RESPONSE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SERVER_COMPRESSION_MIN_RESPONSE_SIZE
            - name: SERVER_COMPRESSION_MIME_TYPES
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SERVER_COMPRESSION_MIME_TYPES
            - name: SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT
            - name: SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS
            - name: SERVER_TOMCAT_CONNECTION_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SERVER_TOMCAT_CONNECTION_TIMEOUT
            - name: SPRING_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_SECURITY_PASSWORD
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            # JVM sizing is owned by the IMAGE (Dockerfile): -XX:MaxRAMPercentage=50.0
            # sizes the heap to 50% of the cgroup limit (1GiB at the 2Gi below), leaving 1GiB
            # for off-heap (metaspace + Netty/Lettuce direct buffers + thread stacks + GC).
            # This env block intentionally does NOT set -Xmx/-XX:MaxDirectMemorySize — doing so
            # would (a) recreate the rigid heap the Dockerfile deliberately replaced with
            # RAM%, and (b) be partially overridden anyway, since Dockerfile CMD args win over
            # JAVA_TOOL_OPTIONS for conflicting flags (JVM "last-wins" precedence).
            # StringDeduplication is low-risk and modestly reduces heap for string-heavy workloads.
            # Off-heap IS capped in the image (MaxDirectMemorySize=256m, MaxMetaspaceSize=256m):
            # with -XX:+ExitOnOutOfMemoryError a single benign off-heap spike would otherwise
            # kill the JVM and restart the pod. Capping keeps native usage bounded/predictable.
            # GC/startup perf: AlwaysPreTouch removes first-touch page faults, ParallelRefProcEnabled
            # speeds GC reference processing, DisableExplicitGC blocks Full GCs from System.gc().
            # GC logging to /tmp/gc.log with rotation (5 files × 10 MiB) — readable via
            # `kubectl exec -n taskflow deploy/taskflow-backend -- cat /tmp/gc.log.0`.
            # Heap dumps land in /tmp on OOM; both paths are writable (emptyDir tmp-volume).
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+ExitOnOutOfMemoryError -XX:+UseStringDeduplication -XX:+AlwaysPreTouch -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC -XX:MaxMetaspaceSize=256m -Xlog:gc*:file=/tmp/gc.log:time,uptime,level,tags:filecount=5,filesize=10m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/dump.hprof"
          ports:
            - containerPort: 8080
              name: http
          resources:
            # Guaranteed QoS: requests == limits so the full memory budget is reserved (no
            # eviction under node pressure) and CPU is never throttled. 2Gi total − 1Gi heap
            # (MaxRAMPercentage=50.0 in the image) − 256Mi metaspace − 256Mi direct ≈ 1GiB for
            # thread stacks/GC/native libs. Trimmed from 3Gi→2Gi to free ~1 GiB on the 14 GiB node;
            # the app must not need >1 GiB heap under load or this will OOM.
            limits:
              cpu: "2000m"
              memory: 2Gi
            requests:
              cpu: "2000m"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            # 15 × 5s = 75s budget. The CDS-trained, AOT-enabled image starts in <30s, so 100s
            # was excessive and only delayed surfacing a stuck startup. 75s still clears the
            # Spring context + Flyway migrate before the pod is declared failed.
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: taskflow
  # `app: taskflow-backend` label lets the Prometheus ServiceMonitor in
  # gitops/monitoring/app select this Service (ServiceMonitor matches Service
  # labels, not the pod selector).
  labels:
    app: taskflow-backend
spec:
  ports:
    - port: 8080
      targetPort: 8080
      # Advertise HTTP/2 (h2c) to the Cilium Gateway so it multiplexes requests to the
      # backend over a single connection. The backend already enables server.http2.enabled=true
      # (application.properties); without this the Gateway would speak HTTP/1.1 upstream.
      appProtocol: kubernetes.io/h2c
  selector:
    app: taskflow-backend
  type: ClusterIP
