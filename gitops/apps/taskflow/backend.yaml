apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow
  annotations:
    # Roll the pods when a referenced ConfigMap/Secret changes (Reloader).
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: taskflow-backend
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # One surge pod, never below one ready pod. The surge pod needs only the backend's
  # CPU request (500m) of free capacity now that requests reflect real usage.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      priorityClassName: taskflow-critical
      # The backend never calls the Kubernetes API.
      automountServiceAccountToken: false
      # User namespace: UID 10001 in the container maps to an unprivileged, per-pod
      # host UID range, so a container escape lands as nobody on the node.
      hostUsers: false
      # Do not inject <SERVICE>_PORT / <SERVICE>_SERVICE_HOST variables for every
      # Service in the namespace (db, redis, jaeger, ...); DNS is used instead.
      enableServiceLinks: false
      securityContext:
        # The mount hides the image directory; make it writable by the runtime UID/GID.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Allow in-flight requests to drain on rollout. Pair with server.shutdown=graceful in the
      # backend's prod profile so Spring finishes active requests before the pod is killed.
      terminationGracePeriodSeconds: 45
      initContainers:
        # Tag + digest pin: Renovate bumps both together.
        - name: wait-for-db
          image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          # Explicit values so the namespace LimitRange does not inject its defaults
          # into this short-lived container.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command: ["sh", "-c", "until nc -z -w 2 db 5432 && nc -z -w 2 redis 6379; do echo 'Waiting for database and redis...'; sleep 2; done;"]
      containers:
        - name: backend
          # Flux image automation pins :latest to its current digest (see ImagePolicy
          # digestReflectionPolicy: Always). The marker below makes Flux rewrite this
          # line to repo:latest@sha256:<digest> whenever a new :latest is pushed,
          # committing the exact digest to Git -> auditable, automatic rollout.
          image: ghcr.io/stefanf81/taskflow-backend:latest@sha256:c17319f7ed61d18d5eaf6490887f1154149a6d4ffa799a43f275068b517aad1b # {"$imagepolicy": "flux-system:taskflow-backend"}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: diagnostics
              mountPath: /var/log/taskflow
          # Every key of backend-config is exported 1:1, so a new key added to the
          # ConfigMap reaches the pod without a second edit here.
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            # Admin password (username `admin`). The prod profile refuses to start if it
            # is blank, `admin-password` or contains `CHANGE_ME`, and re-syncs the stored
            # admin hash from it on every boot: rotating this secret rotates the admin
            # password on the next restart. Never set APP_REQUIRE_STRONG_ADMIN_PASSWORD=false
            # here; that opt-out is for disposable CI/E2E stacks only.
            - name: SPRING_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_SECURITY_PASSWORD
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: APP_RSA_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-jwt-keys
                  key: APP_RSA_PRIVATE_KEY
            - name: APP_RSA_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-jwt-keys
                  key: APP_RSA_PUBLIC_KEY
            # JVM sizing is owned by the DEPLOYMENT (this JAVA_TOOL_OPTIONS), not the
            # image CMD. The image deliberately carries only environment-invariant flags
            # (the Java 25 AOT cache via -XX:AOTCache, ExitOnOOM) — setting sizing flags
            # in the CMD would silently win over this env (JVM "last-wins" precedence for
            # non-sticky flags) and recreate the precedence bug where this block was a no-op.
            # Never add -Xshare:* here: the JVM refuses to start when it is combined with
            # the image's -XX:AOTCache, regardless of argument order.
            #
            # Heap: -XX:MaxRAMPercentage=50.0 sizes the heap to 50% of the 2Gi cgroup
            # limit = 1 GiB, leaving ~1 GiB for off-heap (metaspace + Netty/Lettuce
            # direct buffers + thread stacks + GC + native). 50% (not 75%) is deliberate:
            # this workload uses Lettuce + OpenTelemetry direct buffers plus ~200 Tomcat
            # thread stacks, and 75% historically OOMKilled the 2 Gi pod under load.
            #
            # Off-heap caps: MaxDirectMemorySize=256m caps Netty/Lettuce/OTLP direct
            # buffers. MaxMetaspaceSize=256m caps class-metadata growth. With
            # ExitOnOutOfMemoryError, capping native usage keeps a benign off-heap spike
            # from killing the JVM and triggering a needless pod restart.
            #
            # CPU count: -XX:ActiveProcessorCount=2. The container has no CPU limit
            # (docs/PERF_DEEP_DIVE_2026-10.md §3), and without one the JVM would size GC
            # and JIT threads, ForkJoin pools and Netty/Lettuce event loops for every node
            # CPU. Pinning 2 keeps them as they were under the old 2-CPU limit.
            #
            # Behavioral tuning:
            #  - UseG1GC + MaxGCPauseMillis=100: latency-bounded GC for request/response.
            #  - AlwaysPreTouch: commits the heap at startup (steady-state trade-off —
            #    eliminates first-touch page faults at the cost of slower pod boot).
            #  - UseStringDeduplication: modest heap reduction for string-heavy workloads.
            #  - ParallelRefProcEnabled: speeds GC reference processing.
            #  - DisableExplicitGC: blocks Full GCs triggered by System.gc() calls.
            #  - GC logging to /var/log/taskflow/gc.log (5 files × 10 MiB).
            #  - HeapDumpOnOutOfMemoryError writes java_pid<pid>.hprof to the same disk-backed
            #    directory. It survives a container restart, NOT pod deletion. An existing
            #    dump is never overwritten: remove it after analysis so the next OOM can dump.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxRAMPercentage=50.0 -XX:MaxGCPauseMillis=100 -XX:+ExitOnOutOfMemoryError -XX:+UseStringDeduplication -XX:+AlwaysPreTouch -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC -XX:MaxDirectMemorySize=256m -XX:MaxMetaspaceSize=256m -Xlog:gc*:file=/var/log/taskflow/gc.log:time,uptime,level,tags:filecount=5,filesize=10m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/taskflow"
            # glibc-only allocator cap (Ubuntu 26.04 base since the Alpine->resolute
            # migration): arenas default to 8 x cores and the JVM's worker/carrier
            # threads spread native allocations across them, padding RSS. Measured
            # -72 MiB median with no throughput/GC cost (BENCHMARKS.md §51 in the
            # backend repo). Must be a plain env var — glibc reads it at process
            # start; it cannot be appended to JAVA_TOOL_OPTIONS.
            - name: MALLOC_ARENA_MAX
              value: "2"
            # Publish http_server_requests_seconds_bucket so the Taskflow Performance
            # p95 latency series works (Micrometer only exports _count/_sum/_max by
            # default). Spring Boot relaxed binding: dots -> underscores, dashes removed
            # (percentiles-histogram -> PERCENTILESHISTOGRAM); verified against
            # spring-boot-actuator-autoconfigure 3.5.6 MetricsProperties. The 5ms..10s
            # range keeps it at 48 buckets per series instead of 276 for the full range.
            - name: MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS
              value: "true"
            - name: MANAGEMENT_METRICS_DISTRIBUTION_MINIMUMEXPECTEDVALUE_HTTP_SERVER_REQUESTS
              value: "5ms"
            - name: MANAGEMENT_METRICS_DISTRIBUTION_MAXIMUMEXPECTEDVALUE_HTTP_SERVER_REQUESTS
              value: "10s"
          ports:
            - containerPort: 8080
              name: http
          # Let Cilium/Envoy drop the endpoint before Spring starts its graceful shutdown
          # (server.shutdown=graceful, 30s phase timeout): 10s + 30s fits the 45s grace period.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          # In-place resize: CPU changes apply without a restart; memory restarts the
          # container because the JVM sizes its heap (MaxRAMPercentage) at start-up.
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            # CPU: request sized to real usage, no limit. A CPU limit is a CFS quota that
            # throttles the JVM's bursts (JIT, GC, start-up) even on an idle node; the old
            # 2-CPU request reserved a third of the node and left no room for the rolling
            # update's surge pod. Under contention the request guarantees this share.
            # Memory: request == limit, so usage never exceeds the request and the pod is
            # the last eviction candidate (with taskflow-critical priority). 2Gi total − 1Gi
            # heap (MaxRAMPercentage=50.0 in JAVA_TOOL_OPTIONS — see env block above) −
            # 256Mi metaspace − 256Mi direct ≈ 1GiB for thread stacks/GC/native libs. The
            # app must not need >1 GiB heap under load or this will OOM. MALLOC_ARENA_MAX=2
            # (env above) additionally caps glibc arena padding with no throughput cost
            # (BENCHMARKS.md §51).
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            # 15 × 5s = 75s budget. The CDS-trained, AOT-enabled image starts in <30s, so 100s
            # was excessive and only delayed surfacing a stuck startup. 75s still clears the
            # Spring context + Flyway migrate before the pod is declared failed.
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: diagnostics
          # Node disk, never medium: Memory. Use a PVC if dumps must survive pod deletion.
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: taskflow
  # `app: taskflow-backend` lets the VMServiceScrape in gitops/monitoring/app
  # select this Service (scrapes select Service labels, not pod selectors).
  labels:
    app: taskflow-backend
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
      # Advertise HTTP/2 (h2c) to any L7 proxy that dials this Service directly. The
      # public routes go through taskflow-backend-waf, whose Caddy upstream is pinned to
      # HTTP/1.1, so this only matters if a route targets `backend` without the WAF. The
      # backend itself enables server.http2.enabled=true (application.properties).
      appProtocol: kubernetes.io/h2c
  selector:
    app: taskflow-backend
  type: ClusterIP
