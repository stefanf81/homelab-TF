# PostgreSQL exporter — scrapes the TaskFlow Postgres instance directly (no app
# change required) and exposes /metrics on :9187 for the ServiceMonitor in
# gitops/monitoring/app. Uses the SAME SOPS-encrypted db-secret the backend uses,
# so the DB password is never duplicated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: taskflow
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          # Pin a specific tag; rotate to a @sha256 digest for full hermeticity.
          image: prometheuscommunity/postgres-exporter:v0.15.0
          args:
            - "--db.host=db"
            - "--db.port=5432"
            - "--db.user=postgres"
            - "--db.password=$(POSTGRES_PASSWORD)"
            - "--db.database=taskflow"
            - "--auto-discover-databases"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 9187
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: taskflow
  labels:
    app: postgres-exporter
spec:
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
  selector:
    app: postgres-exporter
  type: ClusterIP
