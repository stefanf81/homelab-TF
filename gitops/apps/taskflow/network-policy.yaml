# Allows ingress to Postgres ONLY from the backend and the Postgres exporter.
# This policy is meaningful ONLY because default-deny-datastore-ingress.yaml
# denies all other ingress to this pod first — on its own it would just be an
# (redundant) allow rule. Together they enforce: nobody but these two talks to PG.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-db-access
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: postgres-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: taskflow-backend
        - podSelector:
            matchLabels:
              app: postgres-exporter
        - podSelector:
            matchLabels:
              app: trivy-epss-scanner
      ports:
        - protocol: TCP
          port: 5432
