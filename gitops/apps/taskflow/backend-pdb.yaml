# PodDisruptionBudget for the backend. With a single replica, minAvailable: 1 would
# permanently block the eviction API (node drains, k3s upgrades) because the only pod
# can never be removed. maxUnavailable: 1 allows a controlled maintenance restart; a
# brief outage is the accepted single-node tradeoff. unhealthyPodEvictionPolicy lets
# drains proceed even while a pod is unhealthy.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: taskflow-backend-pdb
  namespace: taskflow
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: taskflow-backend
