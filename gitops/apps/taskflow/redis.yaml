apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: taskflow
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          # Redis 8.10 — major upgrade from 7.4. Redis 8 integrates previously
          # separate modules (search, JSON, time series, probabilistic) into the
          # core binary, but we use the standard redis-server CMD (not redis-full.conf),
          # so none of those modules load and the cache behavior is identical to 7.x.
          # License: RSALv2 / SSPLv1 / AGPLv3 (tri-licensed).
          image: redis:8.10.0-alpine
          imagePullPolicy: IfNotPresent
          args:
            # Cap memory to leave headroom for Redis overhead; evict LRU keys on pressure.
            # No RDB persistence: /data is an emptyDir, so snapshots would NOT survive a Pod
            # replacement and may fail to write as UID 10001. Re-add --save only with a real PVC.
            - "--maxmemory"
            - "384mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            # Evict in a background thread (no main-thread stall) and sample more keys for accuracy.
            - "--lazyfree-lazy-eviction"
            - "yes"
            - "--maxmemory-samples"
            - "10"
            # Redis 8 I/O threading — parallelise socket reads/writes and protocol
            # parsing across 2 background threads. The 8.0 rewrite is substantially
            # lighter than the 7.x implementation; even with 500m CPU this improves
            # throughput during eviction bursts by keeping the main thread free.
            - "--io-threads"
            - "2"
            # Guard against client-connection memory blowup. Caps the combined output
            # buffers of all connected clients (Lettuce + redis_exporter) at 5% of
            # maxmemory (~19 MB here). Exceeding the cap drops the greediest connection
            # rather than OOM-killing the pod.
            - "--maxmemory-clients"
            - "5%"
            # Expiry-scan CPU budget. 1 = default (balanced). Lower reduces CPU stolen
            # from the backend at the cost of stale keys lingering slightly longer.
            # Raise to 4 only if TTL-based key buildup is observed.
            - "--active-expire-effort"
            - "1"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 6379
              name: redis
          resources:
            # Burstable QoS by design: CPU requests == limits so Redis is never CPU-throttled,
            # while the 256Mi memory request can burst to the 512Mi RSS cap. A throttled L2
            # cache would add latency spikes that stall the backend's hot path.
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 2
      volumes:
        - name: redis-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: taskflow
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-redis-access
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress to Redis ONLY from the backend and the Redis exporter.
    # Effective only because default-deny-datastore-ingress.yaml denies all other
    # ingress to this pod first.
    - from:
        - podSelector:
            matchLabels:
              app: taskflow-backend
        - podSelector:
            matchLabels:
              app: redis-exporter
      ports:
        - protocol: TCP
          port: 6379
