apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: taskflow
  annotations:
    # Roll the pods when a referenced ConfigMap/Secret changes (Reloader).
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      priorityClassName: taskflow-critical
      # No workload here talks to the Kubernetes API, so no token is mounted.
      automountServiceAccountToken: false
      # User namespace and no per-Service environment variables; see backend.yaml.
      hostUsers: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # Redis 8.10 — major upgrade from 7.4. Redis 8 integrates previously
          # separate modules (search, JSON, time series, probabilistic) into the
          # core binary, but we use the standard redis-server CMD (not redis-full.conf),
          # so none of those modules load and the cache behavior is identical to 7.x.
          # License: RSALv2 / SSPLv1 / AGPLv3 (tri-licensed).
          image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
          imagePullPolicy: IfNotPresent
          args:
            # Cap memory to leave headroom for Redis overhead; evict LRU keys on pressure.
            # used_memory peaked at 1.9 MB (2026-10-22), so 64mb is ~30x the working set.
            - "--maxmemory"
            - "64mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            # Explicitly disable RDB snapshots AND AOF: /data is an emptyDir, so
            # persistence would not survive a Pod replacement. Redis's compiled
            # defaults otherwise enable RDB (save 3600 1 / 300 100 / 60 10000) and
            # stop-writes-on-bgsave-error, causing pointless fork/COW memory spikes
            # in this small container and turning transient bgsave failures into
            # write errors (MISCONF). Re-add only together with a real PVC.
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            # Evict in a background thread (no main-thread stall) and sample more keys for accuracy.
            - "--lazyfree-lazy-eviction"
            - "yes"
            - "--maxmemory-samples"
            - "10"
            # Keep the default single I/O thread: extra threads cost latency/throughput
            # on small CPU budgets with one shared Lettuce connection (BENCHMARKS.md §59).
            # Guard against client-connection memory blowup. Caps the combined output
            # buffers of all connected clients (Lettuce + redis_exporter) at 5% of
            # maxmemory (~3 MB here). Exceeding the cap drops the greediest connection
            # rather than OOM-killing the pod.
            - "--maxmemory-clients"
            - "5%"
            # Expiry-scan CPU budget. 1 = default (balanced). Lower reduces CPU stolen
            # from the backend at the cost of stale keys lingering slightly longer.
            # Raise to 4 only if TTL-based key buildup is observed.
            - "--active-expire-effort"
            - "1"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          securityContext:
            # Persistence is off and /data is an emptyDir: nothing else is written.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 6379
              name: redis
          resources:
            # No CPU limit (a throttled L2 cache stalls the backend's hot path); the small
            # request reflects real use. Memory request == limit: maxmemory 64mb plus
            # overhead stays reserved and the pod is not an eviction candidate.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 2
      volumes:
        - name: redis-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: taskflow
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-redis-access
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress to Redis ONLY from the backend and the Redis exporter.
    # Effective only because default-deny.yaml denies all other
    # ingress to this pod first.
    - from:
        - podSelector:
            matchLabels:
              app: taskflow-backend
        - podSelector:
            matchLabels:
              app: redis-exporter
      ports:
        - protocol: TCP
          port: 6379
