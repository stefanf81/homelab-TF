apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: taskflow
  annotations:
    # Roll the pods when a referenced ConfigMap/Secret changes (Reloader).
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      priorityClassName: taskflow-critical
      # No workload here talks to the Kubernetes API, so no token is mounted.
      automountServiceAccountToken: false
      # User namespace and no per-Service environment variables; see backend.yaml.
      hostUsers: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Writes the ACL file Redis starts with (--aclfile below). Four users instead of
        # one all-powerful `default` user behind --requirepass:
        #   default   off: a connection that does not authenticate can do nothing
        #   taskflow  the backend: exactly the commands it sends, nothing else. Recorded
        #             with MONITOR and INFO commandstats while the backend (Spring Data
        #             Redis 4.2 / Lettuce 7.9) ran its API smoke, a restart and the
        #             revocation restore: HELLO/AUTH and CLIENT SETINFO on connect, GET,
        #             SET, DEL, INCR, PTTL, PEXPIRE, SCAN (cache clear), EVALSHA/EVAL
        #             (four Lua scripts; Redis checks the commands inside a script against
        #             this list too), PUBLISH/SUBSCRIBE/UNSUBSCRIBE on
        #             taskflow:token-revoked, PING, INFO (Spring Boot's Redis health
        #             indicator); CLIENT SETNAME for spring.data.redis.client-name.
        #             A list, not `+@all -@dangerous -@admin`: @all also grants every
        #             module command (Redis ACL docs) and the vector-set commands (VADD,
        #             VSIM, ...) belong to no category, so no `-@<category>` removes them.
        #             Cost: the backend treats a refused command like a Redis outage and
        #             falls back to per-JVM state (rate limits, login throttle, caches),
        #             so after a Spring Data/Lettuce upgrade that sends a new command, the
        #             backend logs "Redis unavailable" and Redis counts the refusal
        #             (redis_acl_access_denied_cmd_total in redis-exporter; ACL LOG shows
        #             which command). Add the command here; keys stay `~*` because cache
        #             names change with the app.
        #   exporter  the command list from the redis_exporter README for Redis >= 8.8
        #   admin     everything; for the operator only:
        #             kubectl -n taskflow exec -it deploy/redis -- redis-cli --user admin --askpass
        #   probe     no password, PING only (the kubelet probes below)
        # Passwords are stored as SHA-256 (`#<hex>`), so the file holds no clear text
        # and any character is safe in a password. The file lives in memory and is
        # rebuilt on every pod start: rotating a password is a Secret edit (Reloader
        # restarts the pod).
        - name: write-acl
          # Same image as the server (sh and sha256sum from its BusyBox).
          image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ceu
            - |
              umask 077
              hash() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
              for v in "$REDIS_PASSWORD" "$REDIS_EXPORTER_PASSWORD" "$REDIS_ADMIN_PASSWORD"; do
                [ -n "$v" ] || { echo "a Redis password in redis-secret is empty" >&2; exit 1; }
              done
              {
                echo "user default off"
                echo "user probe on nopass -@all +ping"
                echo "user taskflow on #$(hash "$REDIS_PASSWORD") ~* resetchannels &taskflow:* -@all +hello +auth +client|setinfo +client|setname +ping +info +get +set +del +incr +pttl +pexpire +scan +eval +evalsha +publish +subscribe +unsubscribe"
                echo "user exporter on #$(hash "$REDIS_EXPORTER_PASSWORD") -@all +@connection +memory -readonly +strlen +config|get +xinfo +pfcount -quit +zcard +type +xlen -readwrite -command +command|info +client -wait +scard +llen +hlen +arcount +get +eval +slowlog +cluster|info +cluster|slots +cluster|nodes -hello -echo +info +latency +scan -reset -auth -asking"
                echo "user admin on #$(hash "$REDIS_ADMIN_PASSWORD") ~* &* +@all"
              } > /acl/users.acl
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: REDIS_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_EXPORTER_PASSWORD
            - name: REDIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_ADMIN_PASSWORD
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          # Explicit values so the namespace LimitRange does not inject its defaults
          # into this short-lived container.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 16Mi
          volumeMounts:
            - name: acl
              mountPath: /acl
      containers:
        - name: redis
          # Redis 8.10 — major upgrade from 7.4. Redis 8 ships search, JSON, time series
          # and the probabilistic types as modules in the image, and the image's
          # docker-entrypoint.sh adds `--loadmodule` for every .so in
          # /usr/local/lib/redis/modules (checked on this digest: bf, search, timeseries
          # and ReJSON load with args alone). Starting redis-server directly skips that
          # script, so none of them load: about 150 fewer commands, 1.3 MB less
          # used_memory inside maxmemory and ~12 MB less RSS. The script does nothing
          # else for a non-root container. Vector sets are built in and always present
          # (the backend's ACL user cannot call them). License: RSALv2 / SSPLv1 / AGPLv3.
          image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
          imagePullPolicy: IfNotPresent
          command: ["redis-server"]
          args:
            # Cap memory to leave headroom for Redis overhead; evict LRU keys on pressure.
            # used_memory peaked at 1.9 MB (2026-10-22), so 64mb is ~30x the working set.
            - "--maxmemory"
            - "64mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            # Explicitly disable RDB snapshots AND AOF: /data is an emptyDir, so
            # persistence would not survive a Pod replacement. Redis's compiled
            # defaults otherwise enable RDB (save 3600 1 / 300 100 / 60 10000) and
            # stop-writes-on-bgsave-error, causing pointless fork/COW memory spikes
            # in this small container and turning transient bgsave failures into
            # write errors (MISCONF). Re-add only together with a real PVC.
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            # Evict in a background thread (no main-thread stall) and sample more keys for accuracy.
            - "--lazyfree-lazy-eviction"
            - "yes"
            - "--maxmemory-samples"
            - "10"
            # Keep the default single I/O thread: extra threads cost latency/throughput
            # on small CPU budgets with one shared Lettuce connection (BENCHMARKS.md §59).
            # Guard against client-connection memory blowup. Caps the combined output
            # buffers of all connected clients (Lettuce + redis_exporter); exceeding it
            # drops the greediest connection rather than OOM-killing the pod. 16mb, not
            # the earlier 5% of maxmemory (~3.2 MB): one reply larger than that would
            # have dropped the backend's single shared Lettuce connection mid-read once
            # cached values grow. 64mb maxmemory + 16mb clients stays inside 128Mi.
            - "--maxmemory-clients"
            - "16mb"
            # Expiry-scan CPU budget. 1 = default (balanced). Lower reduces CPU stolen
            # from the backend at the cost of stale keys lingering slightly longer.
            # Raise to 4 only if TTL-based key buildup is observed.
            - "--active-expire-effort"
            - "1"
            # Users and passwords: see the write-acl init container. No --requirepass
            # (it put the password into this process's command line), and this
            # container carries no secret in its environment either.
            - "--aclfile"
            - "/acl/users.acl"
          securityContext:
            # Persistence is off and /data is an emptyDir: nothing else is written.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 6379
              name: redis
          resources:
            # No CPU limit (a throttled L2 cache stalls the backend's hot path); the small
            # request reflects real use. Memory request == limit: maxmemory 64mb plus
            # overhead stays reserved and the pod is not an eviction candidate.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: redis-storage
              mountPath: /data
            - name: acl
              mountPath: /acl
              readOnly: true
          # Exec probes default to a 1s timeout, and each one forks redis-cli. On a
          # busy node (everything starting after a reboot) three slow forks would
          # restart Redis, and a restart empties the cache (no persistence).
          # They log in as `probe` (PING only). redis-cli sends AUTH only when it has a
          # password, and a nopass user accepts any, hence the dummy --pass.
          livenessProbe:
            exec:
              command: ["redis-cli", "--user", "probe", "--pass", "probe", "--no-auth-warning", "ping"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["redis-cli", "--user", "probe", "--pass", "probe", "--no-auth-warning", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "--user", "probe", "--pass", "probe", "--no-auth-warning", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        # Nothing is written here while persistence is off. The limit is above
        # maxmemory, so even a manual SAVE by the admin user cannot get the pod
        # evicted for exceeding it.
        - name: redis-storage
          emptyDir:
            sizeLimit: 128Mi
        - name: acl
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: taskflow
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-redis-access
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress to Redis ONLY from the backend and the Redis exporter.
    # Effective only because default-deny.yaml denies all other
    # ingress to this pod first.
    - from:
        - podSelector:
            matchLabels:
              app: taskflow-backend
        - podSelector:
            matchLabels:
              app: redis-exporter
      ports:
        - protocol: TCP
          port: 6379
