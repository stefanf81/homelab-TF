# PostgreSQL data on the database StorageClass (proxmox-csi-db: Proxmox
# `cache: none`, `noatime`; defined in
# gitops/infrastructure/controllers/proxmox-csi/release.yaml).
#
# Migrated from the legacy `postgres-pvc` (proxmox-csi, `cache: writethrough`) on
# 2026-11-11. The legacy PV carries `reclaimPolicy: Retain`, so its Proxmox disk
# remains intact until removed manually by the operator.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: taskflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-csi-db
  resources:
    requests:
      storage: 10Gi
