apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: taskflow
  annotations:
    configmap.reloader.stakater.com/reload: jaeger-config
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      # No workload here talks to the Kubernetes API, so no token is mounted.
      automountServiceAccountToken: false
      # User namespace and no per-Service environment variables; see backend.yaml.
      hostUsers: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
          imagePullPolicy: IfNotPresent
          env:
            # Go soft memory limit: headroom below the 256Mi limit for the trace cap
            # (max_traces in jaeger-config.yaml).
            - name: GOMEMLIMIT
              value: "200MiB"
          args:
            # Replaces the image's built-in all-in-one config, which also listened on
            # the Jaeger v1, Zipkin, OTLP gRPC and other unused ports (jaeger-config.yaml).
            - "--config=/etc/jaeger/config.yaml"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 13133
              name: health
            - containerPort: 16686
              name: ui
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
          resources:
            # No CPU limit: throttling OTLP ingestion back-pressures the backend's trace
            # exporter. Memory may burst from 64Mi up to the 256Mi RSS cap
            # (14d peak 63Mi, 2026-10-22).
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /status
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: config
          configMap:
            name: jaeger-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: taskflow
spec:
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: jaeger
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: taskflow
spec:
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
  selector:
    app: jaeger
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-jaeger-access
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    # Allow ONLY the backend to submit OTLP trace data. The Jaeger UI (16686) is
    # NOT in this list, and default-deny.yaml now denies all
    # other ingress to this pod — so no in-cluster pod can reach the UI. Admin
    # access still works via `kubectl port-forward svc/jaeger-ui 16686:16686`
    # because that traffic originates from the node (Cilium host exemption), not
    # from another pod. There is no Gateway route for the UI.
    - from:
        - podSelector:
            matchLabels:
              app: taskflow-backend
      ports:
        - protocol: TCP
          port: 4318
