apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: taskflow
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.20.0
          imagePullPolicy: IfNotPresent
          env:
            # v2 built-in all-in-one config uses ${env:JAEGER_LISTEN_HOST:-localhost}
            # for all endpoints. Setting this to 0.0.0.0 binds OTLP, UI, healthcheck,
            # and all other ports to the pod's network interface (was localhost).
            - name: JAEGER_LISTEN_HOST
              value: "0.0.0.0"
          args:
            # Cap retained spans so the in-memory store can't exhaust the 256Mi limit under trace load.
            - "--set=extensions.jaeger_storage.backends.some_storage.memory.max_traces=5000"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 13133
              name: health
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            # Guaranteed QoS: requests == limits so OTLP trace ingestion is never
            # CPU-throttled under node pressure (throttling here back-pressures the
            # backend's trace exporter and adds latency). 256Mi still caps RSS.
            limits:
              cpu: "250m"
              memory: 256Mi
            requests:
              cpu: "250m"
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /status
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 10
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: taskflow
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: jaeger
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: taskflow
spec:
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
  selector:
    app: jaeger
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-jaeger-access
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    # Allow ONLY the backend to submit OTLP trace data. The Jaeger UI (16686) is
    # NOT in this list, and default-deny-datastore-ingress.yaml now denies all
    # other ingress to this pod — so no in-cluster pod can reach the UI. Admin
    # access still works via `kubectl port-forward svc/jaeger-ui 16686:16686`
    # because that traffic originates from the node (Cilium host exemption), not
    # from another pod. The Gateway route for /jaeger was already removed (#2).
    - from:
        - podSelector:
            matchLabels:
              app: taskflow-backend
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
