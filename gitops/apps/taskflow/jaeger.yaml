apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          imagePullPolicy: IfNotPresent
          args:
            # Cap retained spans so the in-memory store can't exhaust the 256Mi limit under trace load.
            - "--memory.max-traces=5000"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            limits:
              cpu: "500m"
              memory: 256Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            periodSeconds: 10
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: taskflow
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: jaeger
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: taskflow
spec:
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
  selector:
    app: jaeger
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-jaeger-access
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    # Allow ONLY the backend to submit OTLP trace data. The Jaeger UI (16686) is
    # NOT in this list, and default-deny-datastore-ingress.yaml now denies all
    # other ingress to this pod — so no in-cluster pod can reach the UI. Admin
    # access still works via `kubectl port-forward svc/jaeger-ui 16686:16686`
    # because that traffic originates from the node (Cilium host exemption), not
    # from another pod. The Gateway route for /jaeger was already removed (#2).
    - from:
        - podSelector:
            matchLabels:
              app: taskflow-backend
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
