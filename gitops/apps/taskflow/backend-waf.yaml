# MANUAL RELOAD REQUIRED: Caddy runs with `admin off` and the Deployment is not
# restarted automatically when this ConfigMap changes. After editing the
# Caddyfile, apply the change:
#   kubectl -n taskflow rollout restart deployment/taskflow-backend-waf
#
# Audit pipeline: Coraza writes JSON audit records directly to stdout
# (SecAuditLog /dev/stdout); Alloy performs credential redaction at ingest.
# There is intentionally no FIFO/redactor sidecar — a stalled reader could
# otherwise block every audited request while /waf-healthz stayed green.
#
# Rate limiting: caddy-ratelimit keys on Caddy's validated {client_ip} (real
# visitor, resolved from X-Forwarded-For via trusted_proxies). Coraza remains
# first (`order coraza_waf first`), so the limiter runs after WAF inspection and
# before reverse_proxy, and /waf-healthz is never limited. Enabled 2026-09-26
# after the runbook client-IP verification passed; see the rate-limit.conf key
# below and docs/TASKFLOW_WAF_RUNBOOK.md ("Rate limiting").
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-backend-waf-config
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-backend-waf
    app.kubernetes.io/component: waf
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/protects: taskflow-backend
data:
  Caddyfile: |
    {
        admin off
        auto_https off
        order coraza_waf first
        order log_append before coraza_waf
        servers {
            # trusted_proxies has two roles: (1) the immediate peer must be
            # trusted before Caddy parses client-IP headers at all, and
            # (2) trusted hops are skipped when walking X-Forwarded-For from
            # right to left.
            #
            # OBSERVED PEER (verified 2026-09-26): 10.42.0.148/32 is the
            # cilium_host address that SNATs host->pod traffic. The Cilium Envoy
            # dials the WAFs from the host namespace, so every Gateway request
            # arrives from this single address (confirmed against access logs and
            # `ip -4 addr show cilium_host` in the cilium-agent). Re-run the
            # runbook Stage 0 if the node is replaced or client-IP resolution
            # degrades; trusting a wider range (e.g. the Pod CIDR) would let an
            # in-cluster pod that reaches the Gateway be skipped as a trusted hop.
            #
            # The Cloudflare ranges are a Git-reviewed snapshot (retrieved
            # 2026-09-22) of https://www.cloudflare.com/ips-v4 and
            # https://www.cloudflare.com/ips-v6, so the right-to-left walk skips
            # the Cloudflare edge hop. Refresh periodically; a stale range
            # degrades identity to the Cloudflare edge address for affected
            # requests (coarser buckets), it does not break routing.
            # This list is duplicated in the other WAF ConfigMap: update both
            # together (the image test suite fails if they diverge).
            trusted_proxies static 10.42.0.148/32 \
                173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 \
                141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 \
                197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 \
                104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 \
                2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 \
                2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
            trusted_proxies_strict
            # X-Forwarded-For only. CF-Connecting-IP is NOT consulted: Cilium
            # Envoy forwards a client-supplied value verbatim, so on the direct
            # path a client could otherwise choose its own rate-limit identity.
            client_ip_headers X-Forwarded-For
        }
    }

    :8080 {
        log {
            output stdout
            format filter {
                request>uri query {
                    replace access_token REDACTED
                    replace refresh_token REDACTED
                    replace id_token REDACTED
                    replace code REDACTED
                    replace state REDACTED
                    replace password REDACTED
                    replace secret REDACTED
                }
                request>headers>Authorization delete
                request>headers>Proxy-Authorization delete
                request>headers>Cookie delete
            }
        }

        handle /waf-healthz {
            respond "healthy" 200
        }

        handle {
            log_append <client_ip {client_ip}
            # Late (no "<"): evaluated after downstream handlers complete, so a
            # 429 generated by the rate limiter carries the zone that rejected
            # it. Empty for requests that were not rate limited.
            log_append rate_limit_zone {http.rate_limit.exceeded.name}

            coraza_waf {
                load_owasp_crs

                directives `
                    Include @coraza.conf-recommended
                    Include @crs-setup.conf.example
                    Include /etc/coraza/backend-exclusions.conf

                    SecRuleEngine On
                    SecAction "id:1000001,phase:1,pass,nolog,setvar:tx.blocking_paranoia_level=2"

                    SecRequestBodyAccess On
                    SecResponseBodyAccess Off
                    SecAuditEngine RelevantOnly
                    SecAuditLog /dev/stdout
                    SecAuditLogFormat JSON
                    SecAuditLogParts ABFHZ

                    SecRequestBodyLimit 10485760
                    SecRequestBodyNoFilesLimit 1048576

                    Include @owasp_crs/*.conf
                `
            }

            # Rate limiting: the zones live in the ConfigMap's rate-limit.conf
            # key (mounted next to this file) and are enabled (2026-09-26).
            # Tuning and rollback: docs/TASKFLOW_WAF_RUNBOOK.md ("Rate limiting").
            import /etc/caddy/rate-limit.conf

            reverse_proxy http://backend.taskflow.svc.cluster.local:8080 {
                transport http {
                    versions 1.1
                }
                header_up Host {http.request.host}
                header_up X-Real-IP {client_ip}
                header_up X-Forwarded-Proto https
            }
        }
    }
  backend-exclusions.conf: |
    # No backend CRS exclusions are configured initially.
    # Add only request-scoped exclusions after observing a legitimate false positive.
  rate-limit.conf: |
    # API zone: at most 300 requests per 60s per real client IP, IPv6 grouped
    # per /64. A long-lived SSE connection counts as one event, so
    # /api/v1/appointments/events is unaffected. disable_metrics avoids per-IP
    # Prometheus series. Tuning and rollback:
    # docs/TASKFLOW_WAF_RUNBOOK.md ("Rate limiting").
    rate_limit {
        disable_metrics

        zone api {
            key         {client_ip}
            events      300
            window      1m
            ipv6_prefix 64
        }

        # Authentication endpoints get a tighter budget. Every matching zone is
        # enforced (not just the first), so a login attempt is limited to 20/min
        # even though it also matches the api zone above.
        zone authentication {
            match {
                path /api/v1/auth/*
            }
            key         {client_ip}
            events      20
            window      1m
            ipv6_prefix 64
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend-waf
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-backend-waf
    app.kubernetes.io/component: waf
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/protects: taskflow-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: taskflow-backend-waf
  template:
    metadata:
      labels:
        app: taskflow-backend-waf
        app.kubernetes.io/name: taskflow-backend-waf
        app.kubernetes.io/component: waf
        app.kubernetes.io/part-of: taskflow
        app.kubernetes.io/protects: taskflow-backend
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 100
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: waf
          image: ghcr.io/stefanf81/taskflow-caddy-coraza:2.11.4-coraza2.6.0-r3@sha256:944074acac9fcc9fbeaf1aed373a283dfe579086414ad75948fb1f012512f6bd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: coraza-config
              mountPath: /etc/coraza
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-runtime-config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /waf-healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /waf-healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 768Mi
      volumes:
        - name: caddy-config
          configMap:
            name: taskflow-backend-waf-config
            items:
              - key: Caddyfile
                path: Caddyfile
              - key: rate-limit.conf
                path: rate-limit.conf
        - name: coraza-config
          configMap:
            name: taskflow-backend-waf-config
            items:
              - key: backend-exclusions.conf
                path: backend-exclusions.conf
            defaultMode: 0444
        - name: caddy-data
          emptyDir:
            sizeLimit: 128Mi
        - name: caddy-runtime-config
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-backend-waf
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-backend-waf
    app.kubernetes.io/component: waf
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/protects: taskflow-backend
spec:
  type: ClusterIP
  selector:
    app: taskflow-backend-waf
  ports:
    - name: http
      port: 8080
      targetPort: http
