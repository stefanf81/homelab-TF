# Redis exporter — scrapes the TaskFlow Redis instance directly using the SOPS-encrypted
# Redis password and exposes /metrics on :9121 for the ServiceMonitor
# in gitops/monitoring/app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: taskflow
  annotations:
    # Roll the pods when a referenced ConfigMap/Secret changes (Reloader).
    reloader.stakater.com/auto: "true"
  labels:
    app: redis-exporter
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      # No workload here talks to the Kubernetes API, so no token is mounted.
      automountServiceAccountToken: false
      # User namespace and no per-Service environment variables; see backend.yaml.
      hostUsers: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-exporter
          # Tag + digest pin: Renovate bumps both together.
          image: oliver006/redis_exporter:v1.96.0@sha256:3d57b9eb142a62ffc600063606a41cd471cd53d81bed10be5b56b3a8918f2c26
          args:
            - "--redis.addr=redis:6379"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 9121
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: taskflow
  labels:
    app: redis-exporter
spec:
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121
  selector:
    app: redis-exporter
  type: ClusterIP
