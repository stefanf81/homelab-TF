# =============================================================================
# Full-namespace default-deny (INGRESS) + zero-trust allow-list
# =============================================================================
# Extends the data-tier isolation in default-deny.yaml to the WHOLE taskflow
# namespace. By default NO pod in this namespace accepts any ingress; every
# permitted path must be explicitly re-opened below. This is the zero-trust
# posture: a compromised pod in any other namespace cannot reach these workloads.
#
# SCOPE NOTE: only INGRESS is default-denied here. EGRESS is intentionally left
# allow-all (DNS, the backend's outbound API calls, etc.) because tightening
# egress safely requires enumerating every outbound dependency and cannot be
# validated against this cluster from here. That is a separate follow-up.
#
# ROLLBACK (if the Gateway allow is wrong and the app goes dark):
#   kubectl --kubeconfig kubeconfig.yaml -n taskflow delete -f namespace-default-deny.yaml
# The data-tier isolation in default-deny.yaml remains in force, but
# frontend/backend return to allow-all ingress and the app works again.
# -----------------------------------------------------------------------------
---
# 1) Deny ALL ingress to every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-ingress
  namespace: taskflow
spec:
  podSelector: {} # selects ALL pods in this namespace
  policyTypes:
    - Ingress
  # no ingress rules => deny all ingress
---
# 2) Allow the Cilium Gateway (Envoy proxy carries the reserved:ingress identity)
#    to reach only the dedicated WAF workloads on their serving port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-to-waf
  namespace: taskflow
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - taskflow-frontend-waf
          - taskflow-backend-waf
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: reserved:ingress
              operator: Exists
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# 3) Keep the two WAF egress paths isolated from one another and from unrelated
#    workloads. DNS is the only additional egress required by Caddy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: isolate-taskflow-frontend-waf
  namespace: taskflow
spec:
  endpointSelector:
    matchLabels:
      app: taskflow-frontend-waf
  egress:
    - toEndpoints:
        - matchLabels:
            app: taskflow-frontend
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# 4) The backend WAF has its own egress allow-list and cannot reach the frontend.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: isolate-taskflow-backend-waf
  namespace: taskflow
spec:
  endpointSelector:
    matchLabels:
      app: taskflow-backend-waf
  egress:
    - toEndpoints:
        - matchLabels:
            app: taskflow-backend
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# 5) The original applications accept public traffic only from their matching WAF.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-frontend-waf-to-frontend
  namespace: taskflow
spec:
  endpointSelector:
    matchLabels:
      app: taskflow-frontend
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: taskflow-frontend-waf
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# 6) The backend application accepts public traffic only from its matching WAF.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-backend-waf-to-backend
  namespace: taskflow
spec:
  endpointSelector:
    matchLabels:
      app: taskflow-backend
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: taskflow-backend-waf
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# 7) Allow VictoriaMetrics vmagent (and ONLY vmagent, never other pods in
#    `monitoring` such as internet-exposed Grafana, Loki or Alloy) to scrape the
#    metrics endpoints on their exact ports.
#
#    SECURITY INVARIANT: backend.yaml / configmap.yaml trusts X-Real-IP from the
#    Pod CIDR (APP_TRUSTED_PROXY_REGEX) on :8080. Opening :8080 to the whole
#    `monitoring` namespace would let any compromised pod there (e.g. Grafana)
#    call /api/** directly — bypassing Coraza WAF + Caddy rate limits — and forge
#    X-Real-IP headers. Keep pure L4 rules here (no L7 `rules.http` on :8080):
#    attaching an L7 rule on :8080 would also redirect WAF -> backend traffic
#    through Cilium's host Envoy proxy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vmagent-to-backend
  namespace: taskflow
spec:
  endpointSelector:
    matchLabels:
      app: taskflow-backend
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": vmagent
            "k8s:app.kubernetes.io/instance": victoria-metrics-k8s-stack
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vmagent-to-postgres-exporter
  namespace: taskflow
spec:
  endpointSelector:
    matchLabels:
      app: postgres-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": vmagent
            "k8s:app.kubernetes.io/instance": victoria-metrics-k8s-stack
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vmagent-to-redis-exporter
  namespace: taskflow
spec:
  endpointSelector:
    matchLabels:
      app: redis-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": vmagent
            "k8s:app.kubernetes.io/instance": victoria-metrics-k8s-stack
      toPorts:
        - ports:
            - port: "9121"
              protocol: TCP
---
# 8) Allow cert-manager HTTP-01 solver pods to receive challenge traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cert-manager-solver
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8089
