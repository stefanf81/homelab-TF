apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: taskflow
  labels:
    app.kubernetes.io/name: postgres-db
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  # The shared RWO volume must never be mounted by old and new PostgreSQL pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      priorityClassName: taskflow-critical
      # Room for the shutdown checkpoint (the image stops Postgres with SIGINT, a fast shutdown).
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        # Skip recursive chown when permissions already match (k8s ≥1.28).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent
          args:
            # Memory — trimmed limit to 1024Mi (from 1536Mi) for the memory-constrained
            # node; shared_buffers + concurrent work_mem still fit for a low-traffic homelab.
            # Budget: docs/PERF_DEEP_DIVE_2026-10.md §5.1.
            - "-c"
            - "shared_buffers=384MB"
            - "-c"
            # effective_cache_size is a PLANNER HINT for how much data is cached. The container is
            # capped at 1024Mi; Postgres RSS (~384 shared + ~300 for 30 backends) leaves only ~300Mi
            # of real OS page cache, so 1152MB was overstated and could steer the planner to
            # suboptimal plans. Set to ~700MB to match reality (see docs/PERFORMANCE.md #2.1).
            - "effective_cache_size=700MB"
            - "-c"
            - "work_mem=8MB"
            - "-c"
            - "maintenance_work_mem=64MB"
            # Autovacuum workers default to maintenance_work_mem each (3 × 64MB). 32MB per
            # worker goes a long way with PostgreSQL 17+'s radix-tree TID store and keeps
            # the worst case inside the 1024Mi cap; index builds keep 64MB.
            - "-c"
            - "autovacuum_work_mem=32MB"
            # Fewer connections → less per-connection memory pressure.
            # One backend's Hikari pool has a maximum size of 25, leaving headroom for
            # psql, Flyway migrations, and the postgres-exporter. Backend scaling is
            # intentionally disabled until connection pooling is redesigned.
            - "-c"
            - "max_connections=50"
            # SSD/Proxmox CSI tuning: planner assumes flash + parallel I/O.
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            # Fewer checkpoints → fewer full-page images in WAL; max_wal_size=2GB already
            # allows 15 minutes at this write rate. Longer crash recovery is covered by
            # the startup probe budget below.
            - "-c"
            - "checkpoint_timeout=15min"
            - "-c"
            - "wal_buffers=16MB"
            - "-c"
            # zstd compression of full-page images in WAL: less write I/O for little CPU.
            - "wal_compression=zstd"
            - "-c"
            - "max_wal_size=2GB"
            # synchronous_commit=on (the default): a commit is acknowledged only after its
            # WAL is flushed to the local disk. This is about the primary's own disk, not
            # replicas. With off, a crash can lose up to 3 × wal_writer_delay (~600ms) of
            # transactions users already saw as confirmed bookings. Cost: one fdatasync per
            # write transaction; measure it with pg_test_fsync / pgbench
            # (docs/PERF_DEEP_DIVE_2026-10.md §5.4) and set "off" only if it matters.
            - "-c"
            - "synchronous_commit=on"
            # JIT only compiles plans above jit_above_cost, but a misestimated short OLTP
            # query can pay tens of milliseconds for it. Also matches the CNPG images.
            - "-c"
            - "jit=off"
            # Query visibility: per-statement timing (run `CREATE EXTENSION
            # pg_stat_statements;` once in the taskflow database after this rollout),
            # I/O timing per query and WAL fsync timing in pg_stat_io.
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "pg_stat_statements.track_utility=off"
            - "-c"
            - "track_io_timing=on"
            - "-c"
            - "track_wal_io_timing=on"
            # Logs: slow statements, temp files (work_mem too small) and lock waits
            # longer than deadlock_timeout (1s).
            - "-c"
            - "log_min_duration_statement=500ms"
            - "-c"
            - "log_temp_files=0"
            - "-c"
            - "log_lock_waits=on"
          securityContext:
            # postgres:18-alpine runs as UID/GID 70 by design. Do NOT "normalize" this to
            # 10001 — the PGDATA volume ownership depends on UID 70, and changing it will
            # prevent PostgreSQL from starting. fsGroup 70 + OnRootMismatch handles perms.
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: taskflow
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/18/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            # Guaranteed QoS: requests == limits so PostgreSQL is never CPU-throttled
            # under load, which directly protects query latency. The 1024Mi budget fits
            # 384 shared_buffers + ~240Mi peak work_mem + connection overhead + OS page cache.
            limits:
              cpu: "1000m"
              memory: 1024Mi
            requests:
              cpu: "1000m"
              memory: 1024Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql
            # Parallel query and parallel vacuum use POSIX shared memory; the container
            # default /dev/shm is 64MB. Memory-backed, counted against the limit only when used.
            - name: dshm
              mountPath: /dev/shm
          # pg_isready reports "rejecting connections" during crash recovery. The startup
          # budget (120 × 5s = 10 min) lets WAL replay finish instead of killing Postgres
          # mid-recovery in a loop; liveness only starts after startup succeeds. Exec
          # probes default to a 1s timeout, too short during a checkpoint or vacuum.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: taskflow
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-db
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-db-pdb
  namespace: taskflow
spec:
  # With a single-replica database, minAvailable: 1 would block the eviction API
  # (node drains, k3s upgrades) forever. maxUnavailable: 1 allows a controlled
  # maintenance restart; a brief database outage is the accepted tradeoff.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: postgres-db
