apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: taskflow
  labels:
    app.kubernetes.io/name: postgres-db
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # The shared RWO volume must never be mounted by old and new PostgreSQL pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      priorityClassName: taskflow-critical
      # Room for the shutdown checkpoint (the image stops Postgres with SIGINT, a fast shutdown).
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      # No per-Service environment variables (see backend.yaml). hostUsers stays at the
      # default here: the PGDATA volume is owned by host UID 70, and moving it into a
      # user namespace needs an idmapped mount of the proxmox-csi volume (test first).
      enableServiceLinks: false
      securityContext:
        fsGroup: 70
        # Skip recursive chown when permissions already match (k8s ≥1.28).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
          imagePullPolicy: IfNotPresent
          args:
            # Memory — sized to the data, not a guess: all databases total ~17 MB and the
            # container peaked at 102Mi over 14 days (2026-10-22), so 128MB of shared_buffers
            # still holds the whole dataset several times over. Raise shared_buffers and the
            # 768Mi limit together if the data approaches ~100 MB.
            # Budget method: docs/reports/PERF_DEEP_DIVE_2026-10.md §5.1 (worked
            # there for the earlier 512Mi limit).
            - "-c"
            - "shared_buffers=128MB"
            - "-c"
            # effective_cache_size is a PLANNER HINT for how much data is cached (shared_buffers
            # plus OS page cache). Inside the 768Mi cap that is ~128 shared + ~256 page cache, so
            # ~384MB matches reality (see docs/PERFORMANCE.md #2.1).
            - "effective_cache_size=384MB"
            - "-c"
            - "work_mem=8MB"
            - "-c"
            - "maintenance_work_mem=64MB"
            # Autovacuum workers default to maintenance_work_mem each (3 × 64MB). 32MB per
            # worker goes a long way with PostgreSQL 17+'s radix-tree TID store and keeps
            # the worst case (shared_buffers + wal_buffers + 3 autovacuum workers + 25
            # pooled connections + /dev/shm) inside the 768Mi cap; index builds keep 64MB.
            - "-c"
            - "autovacuum_work_mem=32MB"
            # One backend's Hikari pool keeps 25 connections open (minimum == maximum), and
            # a RollingUpdate (maxSurge: 1, maxUnavailable: 0) overlaps the surge pod's 25
            # connections with the old pod's 25 connections during its preStop drain
            # (25 + 25 + 2 postgres-exporter = 52 > 50). 80 gives clean headroom for
            # rolling updates, Flyway migrations, postgres-exporter, and admin psql.
            - "-c"
            - "max_connections=80"
            # SSD/Proxmox CSI tuning: planner assumes flash + parallel I/O.
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            # Fewer checkpoints → fewer full-page images in WAL; max_wal_size=2GB already
            # allows 15 minutes at this write rate. Longer crash recovery is covered by
            # the startup probe budget below.
            - "-c"
            - "checkpoint_timeout=15min"
            - "-c"
            - "wal_buffers=16MB"
            - "-c"
            # lz4 is the lowest-CPU WAL codec in the PG 18.6 audit (BENCHMARKS.md §59/60).
            - "wal_compression=lz4"
            - "-c"
            - "max_wal_size=2GB"
            # synchronous_commit=on (the default): a commit is acknowledged only after its
            # WAL is flushed to the local disk. This is about the primary's own disk, not
            # replicas. With off, a crash can lose up to 3 × wal_writer_delay (~600ms) of
            # transactions users already saw as confirmed bookings. Cost: one fdatasync per
            # write transaction; measure it with pg_test_fsync / pgbench
            # (docs/reports/PERF_DEEP_DIVE_2026-10.md §5.4) and set "off" only if it matters.
            - "-c"
            - "synchronous_commit=on"
            # jit is not set: off by default since PostgreSQL 19 (a misestimated short OLTP
            # query could pay tens of milliseconds for compilation).
            # Query visibility: per-statement timing (run `CREATE EXTENSION
            # pg_stat_statements;` once in the taskflow database after this rollout),
            # I/O timing per query and WAL fsync timing in pg_stat_io.
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "pg_stat_statements.track_utility=off"
            - "-c"
            - "track_io_timing=on"
            - "-c"
            - "track_wal_io_timing=on"
            # Logs: slow statements and temp files (work_mem too small). Lock waits longer
            # than deadlock_timeout (1s) are logged by default since PostgreSQL 19
            # (log_lock_waits).
            - "-c"
            - "log_min_duration_statement=500ms"
            - "-c"
            - "log_temp_files=0"
          securityContext:
            # The postgres alpine images run as UID/GID 70 by design. Do NOT "normalize" this
            # to 10001 — the PGDATA volume ownership depends on UID 70, and changing it will
            # prevent PostgreSQL from starting. fsGroup 70 + OnRootMismatch handles perms.
            # Writes go only to PGDATA, the socket directory and /tmp (all mounted below).
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: taskflow
            - name: POSTGRES_USER
              value: postgres
            # The image's default for this major (<major>/docker under the volume). The
            # major here and in the image tag must match (scripts/check-postgres-major.rb
            # fails CI otherwise): a newer server cannot start on this directory. With
            # this layout the image also refuses to initialise a new major's directory
            # while another major's <major>/docker exists, instead of starting empty.
            - name: PGDATA
              value: /var/lib/postgresql/19/docker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            # No CPU limit: checkpoints, autovacuum and parallel query burst and a CFS
            # quota throttles them even on an idle node; the request guarantees the share
            # under contention. Memory request == limit (last eviction candidate). The
            # 768Mi budget covers 128Mi shared_buffers + 16Mi wal_buffers + 3×32Mi
            # autovacuum_work_mem + ~25 pooled connections × work_mem + /dev/shm tmpfs
            # without risking cgroup OOM mid-commit.
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql
            # Parallel query and parallel vacuum use POSIX shared memory. 64Mi is the same
            # size as the runtime's default /dev/shm, so this mount only makes the size
            # explicit; it does not add room. Enough today (a parallel hash at
            # work_mem=8MB needs ~48MB). Raise it (128Mi fits the 768Mi budget below) if
            # the logs show "could not resize shared memory segment". Memory-backed,
            # counted against the limit only when used.
            - name: dshm
              mountPath: /dev/shm
            # Unix socket and postmaster lock file (pg_isready probes use the socket).
            # The image's socket directory is /run/postgresql (since the 18.7 image; it
            # used /var/run/postgresql, a symlink to /run on Alpine, before that).
            - name: run
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
          # pg_isready reports "rejecting connections" during crash recovery. The startup
          # budget (120 × 5s = 10 min) lets WAL replay finish instead of killing Postgres
          # mid-recovery in a loop; liveness only starts after startup succeeds. Exec
          # probes default to a 1s timeout, too short during a checkpoint or vacuum.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: taskflow
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-db
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-db-pdb
  namespace: taskflow
spec:
  # With a single-replica database, minAvailable: 1 would block the eviction API
  # (node drains, k3s upgrades) forever. maxUnavailable: 1 allows a controlled
  # maintenance restart; a brief database outage is the accepted tradeoff.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: postgres-db
