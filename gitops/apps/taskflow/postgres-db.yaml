apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      securityContext:
        fsGroup: 70
        # Skip recursive chown when permissions already match (k8s ≥1.28).
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          args:
            # Memory — raised limit to 1536Mi so shared_buffers + concurrent work_mem fit comfortably.
            - "-c"
            - "shared_buffers=384MB"
            - "-c"
            - "effective_cache_size=1152MB"
            - "-c"
            - "work_mem=8MB"
            - "-c"
            - "maintenance_work_mem=64MB"
            # Fewer connections → less per-connection memory pressure.
            - "-c"
            - "max_connections=30"
            # SSD/Longhorn tuning: planner assumes flash + parallel I/O; longer, smoother checkpoints.
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            - "-c"
            - "checkpoint_timeout=900"
            - "-c"
            - "wal_buffers=16MB"
            - "-c"
            - "max_wal_size=2GB"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: taskflow
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            limits:
              cpu: "2000m"
              # Raised from 1024Mi → 1536Mi so shared_buffers + concurrent work_mem fit without OOM.
              memory: 1536Mi
            requests:
              cpu: "500m"
              memory: 768Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres-data
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            failureThreshold: 2
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: taskflow
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-db
  type: ClusterIP
