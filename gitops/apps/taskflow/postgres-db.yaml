apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      securityContext:
        fsGroup: 70
        # Skip recursive chown when permissions already match (k8s ≥1.28).
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:18.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            # Memory — trimmed limit to 1024Mi (from 1536Mi) for the memory-constrained
            # node; shared_buffers + concurrent work_mem still fit for a low-traffic homelab.
            - "-c"
            - "shared_buffers=384MB"
            - "-c"
            # effective_cache_size is a PLANNER HINT for how much data is cached. The container is
            # capped at 1024Mi; Postgres RSS (~384 shared + ~300 for 30 backends) leaves only ~300Mi
            # of real OS page cache, so 1152MB was overstated and could steer the planner to
            # suboptimal plans. Set to ~700MB to match reality (see docs/PERFORMANCE.md #2.1).
            - "effective_cache_size=700MB"
            - "-c"
            - "work_mem=8MB"
            - "-c"
            - "maintenance_work_mem=64MB"
            # PostgreSQL 17 VACUUM uses a compact radix-tree index memory structure that needs
            # up to ~20x less memory than PG16. Allow up to 4 parallel workers for VACUUM /
            # CREATE INDEX so maintenance finishes faster while staying inside the 1024Mi cap
            # (peak ~4 × maintenance_work_mem during parallel vacuum). This is the zero-config
            # win unlocked by the PG17 engine upgrade (see docs/PERFORMANCE.md #3.1).
            - "-c"
            - "max_parallel_maintenance_workers=2"
            # Fewer connections → less per-connection memory pressure.
            # Raised 30 → 50: a single backend's Hikari pool is maximum-pool-size=25
            # (see application-prod.properties), so 25/50 leaves headroom for
            # psql, Flyway migrations, and the postgres-exporter. Scaling the backend
            # to a 2nd replica (25×2=50) would otherwise exhaust the old 30 and stall.
            - "-c"
            - "max_connections=50"
            # SSD/Proxmox CSI tuning: planner assumes flash + parallel I/O; longer, smoother checkpoints.
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            - "-c"
            - "checkpoint_timeout=300"
            - "-c"
            - "wal_buffers=16MB"
            - "-c"
            # zstd WAL compression reduces write I/O by 40-60% at minimal CPU cost.
            # Safe for a single-node homelab with no replication (no standby decode cost).
            - "wal_compression=zstd"
            - "-c"
            # synchronous_commit=off skips the per-transaction WAL fsync on commit.
            # On a single-node cluster with Proxmox CSI (local SSD), the "commit is
            # acknowledged only after WAL hits disk on ALL replicas" guarantee buys
            # nothing — there are no replicas. Disabling it removes 1-5ms of fsync
            # latency per write transaction, improving write throughput 5-20×.
            # Crash-safety is unchanged: a power loss may lose the last ~0.5s of
            # transactions (wal_writer_delay), which is acceptable for a homelab.
            - "synchronous_commit=off"
            - "-c"
            - "max_wal_size=2GB"
          securityContext:
            # postgres:17-alpine runs as UID/GID 70 by design. Do NOT "normalize" this to
            # 10001 — the PGDATA volume ownership depends on UID 70, and changing it will
            # prevent PostgreSQL from starting. fsGroup 70 + OnRootMismatch handles perms.
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: taskflow
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/18/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            # Guaranteed QoS: requests == limits so PostgreSQL is never CPU-throttled
            # under load, which directly protects query latency. The 1024Mi budget fits
            # 384 shared_buffers + ~240Mi peak work_mem + connection overhead + OS page cache.
            limits:
              cpu: "1000m"
              memory: 1024Mi
            requests:
              cpu: "1000m"
              memory: 1024Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            failureThreshold: 2
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: taskflow
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-db
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-db-pdb
  namespace: taskflow
spec:
  # With a single-replica database, setting minAvailable: 1 blocks voluntary
  # evictions (e.g. node drains, k3s upgrades) from accidentally terminating the
  # database. The administrator must explicitly delete the pod or drain with force.
  minAvailable: 1
  selector:
    matchLabels:
      app: postgres-db
