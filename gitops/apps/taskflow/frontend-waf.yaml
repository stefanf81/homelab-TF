apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-frontend-waf-config
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-frontend-waf
    app.kubernetes.io/component: waf
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/protects: taskflow-frontend
data:
  Caddyfile: |
    {
        admin off
        auto_https off
        order coraza_waf first
        servers {
            trusted_proxies static private_ranges
            trusted_proxies_strict
            client_ip_headers X-Forwarded-For
        }
    }

    :8080 {
        log {
            output stdout
            format filter {
                request>uri query {
                    replace access_token REDACTED
                    replace refresh_token REDACTED
                    replace id_token REDACTED
                    replace code REDACTED
                    replace state REDACTED
                    replace password REDACTED
                    replace secret REDACTED
                }
                request>headers>Authorization delete
                request>headers>Proxy-Authorization delete
                request>headers>Cookie delete
            }
        }

        handle /waf-healthz {
            respond "healthy" 200
        }

        handle {
            coraza_waf {
                load_owasp_crs

                directives `
                    Include @coraza.conf-recommended
                    Include @crs-setup.conf.example
                    Include /etc/coraza/frontend-exclusions.conf

                    SecRuleEngine DetectionOnly
                    SecAction "id:1000001,phase:1,pass,nolog,setvar:tx.paranoia_level=1"

                    SecRequestBodyAccess On
                    SecResponseBodyAccess Off
                    SecAuditEngine RelevantOnly
                    SecAuditLog /var/run/coraza/audit.pipe
                    SecAuditLogFormat JSON
                    SecAuditLogParts ABFHZ

                    SecRequestBodyLimit 10485760
                    SecRequestBodyNoFilesLimit 1048576

                    Include @owasp_crs/*.conf
                `
            }

            reverse_proxy http://frontend.taskflow.svc.cluster.local:8080 {
                header_up Host {http.request.host}
                header_up X-Real-IP {client_ip}
                header_up X-Forwarded-Proto https
            }
        }
    }
  frontend-exclusions.conf: |
    # No frontend CRS exclusions are configured initially.
    # Add only request-scoped exclusions after observing a legitimate false positive.
  audit-redactor.sh: |
    #!/bin/sh
    set -eu

    jq_filter='
      def sensitive_header:
        ascii_downcase as $name |
        $name == "authorization" or $name == "proxy-authorization" or $name == "cookie";
      def redact_headers:
        with_entries(if (.key | sensitive_header) then .value = ["REDACTED"] else . end);
      def redact_uri:
        split("?") as $parts |
        if ($parts | length) < 2 then . else
          $parts[0] + "?" + (
            ($parts[1:] | join("?") | split("&")) |
            map(
              if test("^(access_token|refresh_token|id_token|code|state|password|secret)(=|$)"; "i")
              then split("=")[0] + "=REDACTED"
              else .
              end
            ) |
            join("&")
          )
        end;
      if (.transaction.request.headers? | type) == "object"
      then .transaction.request.headers |= redact_headers
      else .
      end |
      if (.transaction.request.uri? | type) == "string"
      then .transaction.request.uri |= redact_uri
      else .
      end
    '

    cat /var/run/coraza/audit.pipe | while IFS= read -r record; do
        printf '%s\n' "$record" | jq -ce "$jq_filter" 2>/dev/null || true
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-frontend-waf
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-frontend-waf
    app.kubernetes.io/component: waf
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/protects: taskflow-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: taskflow-frontend-waf
  template:
    metadata:
      labels:
        app: taskflow-frontend-waf
        app.kubernetes.io/name: taskflow-frontend-waf
        app.kubernetes.io/component: waf
        app.kubernetes.io/part-of: taskflow
        app.kubernetes.io/protects: taskflow-frontend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 100
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: create-audit-pipe
          image: ghcr.io/stefanf81/taskflow-caddy-coraza:2.11.4-coraza2.5.0-r1@sha256:4266cd64d3d5204a05709f8770ba10de52a78e2f93e8d7740c24bfde916dffd8
          command: ["/bin/sh", "-c", "if [ ! -p /var/run/coraza/audit.pipe ]; then rm -f /var/run/coraza/audit.pipe && mkfifo /var/run/coraza/audit.pipe; fi"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: audit-pipe
              mountPath: /var/run/coraza
      containers:
        - name: waf
          image: ghcr.io/stefanf81/taskflow-caddy-coraza:2.11.4-coraza2.5.0-r1@sha256:4266cd64d3d5204a05709f8770ba10de52a78e2f93e8d7740c24bfde916dffd8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: coraza-config
              mountPath: /etc/coraza
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-runtime-config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            - name: audit-pipe
              mountPath: /var/run/coraza
          readinessProbe:
            httpGet:
              path: /waf-healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /waf-healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: audit-log-redactor
          image: ghcr.io/stefanf81/taskflow-caddy-coraza:2.11.4-coraza2.5.0-r1@sha256:4266cd64d3d5204a05709f8770ba10de52a78e2f93e8d7740c24bfde916dffd8
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/etc/coraza/audit-redactor.sh"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: coraza-config
              mountPath: /etc/coraza
              readOnly: true
            - name: audit-pipe
              mountPath: /var/run/coraza
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: caddy-config
          configMap:
            name: taskflow-frontend-waf-config
            items:
              - key: Caddyfile
                path: Caddyfile
        - name: coraza-config
          configMap:
            name: taskflow-frontend-waf-config
            items:
              - key: frontend-exclusions.conf
                path: frontend-exclusions.conf
              - key: audit-redactor.sh
                path: audit-redactor.sh
            defaultMode: 0555
        - name: caddy-data
          emptyDir: {}
        - name: caddy-runtime-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: audit-pipe
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-frontend-waf
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-frontend-waf
    app.kubernetes.io/component: waf
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/protects: taskflow-frontend
spec:
  type: ClusterIP
  selector:
    app: taskflow-frontend-waf
  ports:
    - name: http
      port: 8080
      targetPort: http
