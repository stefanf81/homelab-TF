# The image's default upstream is `backend` with Docker's embedded DNS (127.0.0.11) as
# runtime resolver, written for Docker Compose. Neither exists in a pod, so nginx logged
# "backend could not be resolved" every 30 seconds. This file is mounted over
# /etc/nginx/upstream-server.conf, the image's per-deployment override (docs/deployment/README.md
# in taskflow-enterprise, option A): a plain server line, with neither `resolve` nor
# `resolver`. nginx resolves the name once at startup through the pod's /etc/resolv.conf,
# and the ClusterIP stays fixed for the Service's lifetime. Do NOT add `resolve` without an
# upstream-level `resolver`: images from 2026-11-01 on fail to start without one.
# This works with the old and the new image. NetworkPolicy only admits backend-waf to the
# backend and the Gateway routes /api to backend-waf, so this proxy path is not used.
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-frontend-upstream
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-frontend
    app.kubernetes.io/part-of: taskflow
data:
  upstream-server.conf: |
    server backend.taskflow.svc.cluster.local:8080;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-frontend
  namespace: taskflow
  annotations:
    configmap.reloader.stakater.com/reload: taskflow-frontend-upstream
  labels:
    app.kubernetes.io/name: taskflow-frontend
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: taskflow-frontend
  template:
    metadata:
      labels:
        app: taskflow-frontend
    spec:
      priorityClassName: taskflow-critical
      automountServiceAccountToken: false
      # User namespace (container UIDs map to an unprivileged host range) and no
      # per-Service environment variables; see backend.yaml.
      hostUsers: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          # Flux image automation pins :latest to its current digest (see ImagePolicy
          # digestReflectionPolicy: Always). The marker below makes Flux rewrite this
          # line to repo:latest@sha256:<digest> whenever a new :latest is pushed,
          # committing the exact digest to Git -> auditable, automatic rollout.
          image: ghcr.io/stefanf81/taskflow-frontend:latest@sha256:11f1287047f1c60c35a1eba52c4bcdfea631a9ca0251ade2299448f690cab7a6 # {"$imagepolicy": "flux-system:taskflow-frontend"}
          imagePullPolicy: IfNotPresent
          securityContext:
            # The image creates and runs as its dedicated nginx-runtime UID/GID 10001.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: var-cache-volume
              mountPath: /var/cache/nginx
            - name: var-run-volume
              mountPath: /var/run
            - name: upstream-config
              mountPath: /etc/nginx/upstream-server.conf
              subPath: upstream-server.conf
              readOnly: true
          ports:
            - containerPort: 8080
              name: http
          # Keep serving while the endpoint is removed from the WAF's upstream.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            # nginx serving static files idles near zero CPU: small request, no CPU limit
            # (no throttling jitter during traffic spikes), memory capped at 256Mi.
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: var-cache-volume
          emptyDir: {}
        - name: var-run-volume
          emptyDir: {}
        - name: upstream-config
          configMap:
            name: taskflow-frontend-upstream
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: taskflow
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: taskflow-frontend
  type: ClusterIP
