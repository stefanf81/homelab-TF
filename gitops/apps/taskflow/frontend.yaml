apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-frontend
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-frontend
  template:
    metadata:
      labels:
        app: taskflow-frontend
    spec:
      containers:
        - name: frontend
          # Flux image automation pins :latest to its current digest (see ImagePolicy
          # digestReflectionPolicy: Always). The marker below makes Flux rewrite this
          # line to repo:latest@sha256:<digest> whenever a new :latest is pushed,
          # committing the exact digest to Git -> auditable, automatic rollout.
          image: ghcr.io/stefanf81/taskflow-frontend:latest@sha256:37d1f7d47caeb33b182016b18d780e1be1d7fef149a1a10ecc5910447373a9f1 # {"$imagepolicy": "flux-system:taskflow-frontend"}
          imagePullPolicy: IfNotPresent
          securityContext:
            # UID/GID 101 is the unprivileged "nginx" user inside the nginx:alpine base
            # image (not the project's 10001 convention). It is correct here because the
            # image's nginx master/drop privileges expect 101. Keep in sync if you swap images.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: var-cache-volume
              mountPath: /var/cache/nginx
            - name: var-run-volume
              mountPath: /var/run
          ports:
            - containerPort: 8080
              name: http
          resources:
            # Guaranteed QoS: requests == locks the full CPU/memory budget for nginx,
            # preventing latency jitter from CPU throttling during traffic spikes.
            limits:
              cpu: "250m"
              memory: 256Mi
            requests:
              cpu: "250m"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: var-cache-volume
          emptyDir: {}
        - name: var-run-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: taskflow
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: taskflow-frontend
  type: ClusterIP
