apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: taskflow-jokelab-cert
  namespace: taskflow
spec:
  secretName: taskflow-tls-secret
  dnsNames:
    - "${DOMAIN}"
    - "www.${DOMAIN}"
    - "grafana.${DOMAIN}"
    - "kyverno.${DOMAIN}"
    - "hubble.${DOMAIN}"
  issuerRef:
    name: letsencrypt-http01-production
    kind: ClusterIssuer
