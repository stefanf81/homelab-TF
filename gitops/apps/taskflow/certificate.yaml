apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: taskflow-jokelab-cert
  namespace: taskflow
spec:
  secretName: taskflow-tls-secret
  # ECDSA P-256 instead of the RSA-2048 default: cheaper TLS handshakes at the
  # Gateway, and accepted by Cloudflare "Full (strict)". Changing the algorithm
  # makes cert-manager issue a new certificate once; the old Secret keeps serving
  # until the new one is ready. Always is the default since cert-manager v1.18.
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - "${DOMAIN}"
    - "www.${DOMAIN}"
    - "grafana.${DOMAIN}"
    - "kyverno.${DOMAIN}"
    - "hubble.${DOMAIN}"
  issuerRef:
    name: letsencrypt-http01-production
    kind: ClusterIssuer
