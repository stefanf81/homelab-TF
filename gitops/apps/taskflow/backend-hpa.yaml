# HorizontalPodAutoscaler for the backend.
#
# NOTE: HPA scales on the `metrics.k8s.io` CPU API, which is served by metrics-server.
# metrics-server IS deployed via gitops/monitoring/platform/metrics-server-release.yaml
# (chart 3.13.1) — it lives outside the VictoriaMetrics stack on purpose, because
# vmagent scrapes app/DB metrics, not the Kubernetes resource metrics API. With
# metrics-server present, this HPA is live and scales on CPU at 70% utilization.
#
# minReplicas stays at 1: bump to 2 once a 2nd replica is safe (see postgres-db.yaml
# max_connections=50 headroom). Scale-down is deliberately slow (300s stabilization)
# to avoid flapping on the single-node cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskflow-backend
  namespace: taskflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskflow-backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale up promptly under load, scale down slowly to avoid flapping on a tiny node.
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
