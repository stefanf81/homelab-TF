apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-epss-scripts
  namespace: taskflow
data:
  upload.py: |
    import os
    import ssl
    import urllib.request
    import json
    import gzip
    import io
    import psycopg2

    def run():
        print("Starting EPSS enrichment pipeline...")
        
        # 1. Fetch VulnerabilityReports from Kubernetes API
        try:
            with open('/var/run/secrets/kubernetes.io/serviceaccount/token', 'r') as f:
                token = f.read().strip()
            
            ca_cert_path = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
            ssl_context = ssl.create_default_context(cafile=ca_cert_path)
            
            api_host = os.environ['KUBERNETES_SERVICE_HOST']
            api_port = os.environ['KUBERNETES_SERVICE_PORT']
            url = f"https://{api_host}:{api_port}/apis/aquasecurity.github.io/v1alpha1/vulnerabilityreports"
            
            print(f"Connecting to Kubernetes API: {url}")
            req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
            
            with urllib.request.urlopen(req, context=ssl_context) as response:
                vuln_reports = json.loads(response.read().decode())
        except Exception as e:
            print(f"Error fetching VulnerabilityReports: {e}")
            return
            
        print(f"Found {len(vuln_reports.get('items', []))} VulnerabilityReports in cluster.")
        
        # 2. Download latest EPSS scores from FIRST
        epss_data = {}
        try:
            print("Downloading latest EPSS scores from FIRST...")
            epss_url = "https://epss.cyber.dhs.gov/epss-csv-latest.gz"
            req = urllib.request.Request(epss_url, headers={"User-Agent": "Mozilla/5.0"})
            
            with urllib.request.urlopen(req) as response:
                compressed_file = io.BytesIO(response.read())
                with gzip.GzipFile(fileobj=compressed_file) as decompressed:
                    for line in decompressed:
                        line_str = line.decode('utf-8').strip()
                        if line_str.startswith("#") or line_str.startswith("cve"):
                            continue
                        parts = line_str.split(',')
                        if len(parts) >= 3:
                            cve = parts[0]
                            score = float(parts[1])
                            percentile = float(parts[2])
                            epss_data[cve] = {"score": score, "percentile": percentile}
            print(f"Loaded {len(epss_data)} EPSS CVE mappings from FIRST.")
        except Exception as e:
            print(f"Error downloading EPSS dataset: {e}")
            return

        # 3. Consolidate and enrich vulnerabilities
        consolidated_vulns = []
        
        for item in vuln_reports.get('items', []):
            metadata = item.get('metadata', {})
            ns = metadata.get('namespace', 'unknown')
            labels = metadata.get('labels', {})
            
            workload_kind = labels.get('trivy-operator.resource.kind', 'unknown')
            workload_name = labels.get('trivy-operator.resource.name', 'unknown')
            container_name = labels.get('trivy-operator.container.name', 'unknown')
            
            report = item.get('report', {})
            artifact = report.get('artifact', {})
            image_repo = artifact.get('repository', 'unknown')
            image_tag = artifact.get('tag', 'unknown')
            image_full = f"{image_repo}:{image_tag}"
            
            vulnerabilities = report.get('vulnerabilities', [])
            for v in vulnerabilities:
                cve = v.get('vulnerabilityID', 'unknown')
                pkg_name = v.get('pkgName', 'unknown')
                installed_ver = v.get('installedVersion', 'unknown')
                fixed_ver = v.get('fixedVersion', 'unknown')
                severity = v.get('severity', 'UNKNOWN')
                
                # Enrich with EPSS score
                epss_info = epss_data.get(cve, {"score": 0.0, "percentile": 0.0})
                
                consolidated_vulns.append({
                    "VulnerabilityID": cve,
                    "PkgName": pkg_name,
                    "InstalledVersion": installed_ver,
                    "FixedVersion": fixed_ver,
                    "Severity": severity,
                    "EPSSScore": epss_info["score"],
                    "EPSSPercentile": epss_info["percentile"],
                    "Namespace": ns,
                    "Workload": workload_name,
                    "WorkloadKind": workload_kind,
                    "Container": container_name,
                    "Image": image_full
                })

        # Group consolidated vulnerabilities into the matching Results schema for Grafana compatibility
        consolidated_report = {
            "Results": [
              {
                "Target": "Kubernetes Workloads",
                "Vulnerabilities": consolidated_vulns
              }
            ]
        }
        
        print(f"Consolidated and enriched {len(consolidated_vulns)} vulnerabilities.")

        # 4. Upload to PostgreSQL database
        try:
            print("Uploading enriched report to PostgreSQL...")
            data = json.dumps(consolidated_report)
            
            conn = psycopg2.connect(
                host="db",
                dbname="taskflow",
                user="postgres",
                password=os.environ["POSTGRES_PASSWORD"]
            )
            cur = conn.cursor()
            cur.execute("CREATE TABLE IF NOT EXISTS vulnerability_reports (id serial PRIMARY KEY, report JSONB, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);")
            cur.execute("TRUNCATE TABLE vulnerability_reports;")
            cur.execute("INSERT INTO vulnerability_reports (report) VALUES (%s);", [data])
            conn.commit()
            cur.close()
            conn.close()
            print("Upload complete. Vulnerabilities successfully written to Postgres.")
        except Exception as e:
            print(f"Error uploading to database: {e}")

    if __name__ == "__main__":
        run()
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-cronjob
  namespace: taskflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-cronjob-role
rules:
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-cronjob-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-cronjob-role
subjects:
  - kind: ServiceAccount
    name: trivy-cronjob
    namespace: taskflow
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-epss-scanner
  namespace: taskflow
spec:
  schedule: "0 */6 * * *" # Every 6 hours
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: trivy-epss-scanner
        spec:
          serviceAccountName: trivy-cronjob
          restartPolicy: OnFailure
          volumes:
            - name: scripts
              configMap:
                name: trivy-epss-scripts
                defaultMode: 0755
          containers:
            - name: postgres-upload
              image: python:3.11-alpine
              command:
                - /bin/sh
                - -c
                - "apk add --no-cache postgresql-dev gcc python3-dev musl-dev && pip install psycopg2-binary && python /scripts/upload.py"
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "500m"
                  memory: "1024Mi"
