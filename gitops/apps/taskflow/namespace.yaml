apiVersion: v1
kind: Namespace
metadata:
  name: taskflow
---
# Default resource guardrails for the namespace. Catches a misconfigured Deployment that
# requests unbounded resources before it can starve the single k3s node.
apiVersion: v1
kind: LimitRange
metadata:
  name: taskflow-limits
  namespace: taskflow
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
