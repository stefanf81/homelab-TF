apiVersion: v1
kind: Namespace
metadata:
  name: taskflow
  labels:
    # Pod Security Admission: every TaskFlow pod (and cert-manager's HTTP-01 solver
    # pods created here) already meets the restricted profile; enforce it so a
    # regression is rejected by the API server itself, with no webhook involved.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# Default resource guardrails for the namespace. Catches a misconfigured Deployment that
# requests unbounded memory before it can starve the single k3s node.
#
# Deliberately no CPU default limit and no CPU max: long-running TaskFlow workloads run
# without CPU limits (docs/PERF_DEEP_DIVE_2026-10.md §3). A CPU `default` would inject
# a limit into them, and a CPU `max` makes the LimitRanger reject every container that
# has no CPU limit ("maximum cpu usage per Container is 4.  No limit is specified").
# CPU requests still get a default, and memory stays bounded.
apiVersion: v1
kind: LimitRange
metadata:
  name: taskflow-limits
  namespace: taskflow
spec:
  limits:
    - type: Container
      default:
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        memory: 4Gi
