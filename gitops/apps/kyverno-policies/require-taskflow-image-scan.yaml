apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-taskflow-image-scan
  annotations:
    policies.kyverno.io/title: Require TaskFlow Image Scan Attestation
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The TaskFlow backend and frontend images must carry the Trivy scan report
      as a signed vulnerability attestation (cosign vuln predicate) from
      stefanf81/taskflow-enterprise's .github/workflows/pushdockerimage.yml on
      main. The publish workflow writes it only for a digest that passed the
      scan gate, after checking that the report names that digest and lists no
      vulnerabilities.
spec:
  # Deny, like verify-taskflow-images: the deployed digests (publish run
  # 45242783629, 2026-11-23, the first with this attestation) were checked on
  # GHCR to carry it. Every earlier digest lacks it, so a rollback to one needs
  # this set back to [Audit] first. Same failurePolicy as verify-taskflow-images.
  validationActions: [Deny]
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 20
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: taskflow
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  # Same image selection as verify-taskflow-images.
  matchImageReferences:
    - glob: "ghcr.io/stefanf81/taskflow-backend:*"
    - glob: "ghcr.io/stefanf81/taskflow-backend@*"
    - glob: "ghcr.io/stefanf81/taskflow-frontend:*"
    - glob: "ghcr.io/stefanf81/taskflow-frontend@*"
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - subject: https://github.com/stefanf81/taskflow-enterprise/.github/workflows/pushdockerimage.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    # `trivy ... --format cosign-vuln` output, attested by actions/attest.
    - name: scan
      intoto:
        type: https://cosign.sigstore.dev/attestation/vuln/v1
  variables:
    - name: releaseImages
      expression: >-
        images.containers + images.initContainers + images.ephemeralContainers
  validations:
    - expression: >-
        variables.releaseImages.all(image,
          verifyAttestationSignatures(image, attestations.scan, [attestors.release]) > 0)
      message: >-
        TaskFlow images must carry a Trivy scan attestation from
        pushdockerimage.yml on main.
    # extractPayload returns the whole in-toto statement; it reads the
    # attestation verified by the expression above.
    - expression: >-
        variables.releaseImages.all(image,
          extractPayload(image, attestations.scan).predicate.scanner.uri.startsWith('pkg:github/aquasecurity/trivy@'))
      message: TaskFlow image scan attestations must come from Trivy.
