apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-homelab-images
  annotations:
    policies.kyverno.io/title: Verify Images Built in This Repository
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The images this repository builds (taskflow-caddy-coraza for both WAFs,
      abuseipdb-sync) must come out of the reusable publish workflow
      .github/workflows/publish-image.yaml, run from main: a cosign signature
      with the `scan=passed` annotation, a SLSA build provenance attestation and
      the Trivy scan report as a signed vulnerability attestation, all signed
      keyless by that workflow.
spec:
  # Audit until both images have been republished by publish-image.yaml and
  # their Deployments pinned to the new digests: the digests deployed when this
  # was written (taskflow-caddy-coraza r13, abuseipdb-sync 0.3.5-r9) are
  # unsigned and would fail. Then switch to [Deny] (docs/KYVERNO_POLICY_ENGINE.md §8).
  validationActions: [Audit]
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 20
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  # The WAFs run in `taskflow`, the synchronizer in `abuseipdb`.
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [taskflow, abuseipdb]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/stefanf81/taskflow-caddy-coraza:*"
    - glob: "ghcr.io/stefanf81/taskflow-caddy-coraza@*"
    - glob: "ghcr.io/stefanf81/abuseipdb-sync:*"
    - glob: "ghcr.io/stefanf81/abuseipdb-sync@*"
  # taskflow-caddy-coraza is a private GHCR package. Kyverno reads signatures
  # with its own credentials, not the Pod's imagePullSecrets, from Secrets in
  # its own namespace: a copy of taskflow/ghcr-pull-secret in `kyverno`, made by
  # hand like the original (gitops/FLUX_BOOTSTRAP.md §3). A missing Secret is
  # skipped, so abuseipdb-sync (public) still verifies without it.
  credentials:
    secrets: [ghcr-pull-secret]
  attestors:
    # The certificate of a reusable workflow names the reusable workflow
    # (job_workflow_ref), not its caller: both build workflows publish through
    # publish-image.yaml, so both images share this one identity.
    - name: release
      cosign:
        keyless:
          identities:
            - subject: https://github.com/stefanf81/homelab-TF/.github/workflows/publish-image.yaml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
    # Same identity, plus the annotation `cosign sign -a scan=passed` writes
    # into the signed statement. Separate from `release`: requiring it there
    # would also reject the attestations, which carry no annotation.
    - name: scannedRelease
      cosign:
        keyless:
          identities:
            - subject: https://github.com/stefanf81/homelab-TF/.github/workflows/publish-image.yaml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
        annotations:
          scan: passed
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
    - name: scan
      intoto:
        type: https://cosign.sigstore.dev/attestation/vuln/v1
  # Kyverno fills `images` with matchImageReferences hits only.
  variables:
    - name: releaseImages
      expression: >-
        images.containers + images.initContainers + images.ephemeralContainers
  validations:
    - expression: >-
        variables.releaseImages.all(image,
          verifyImageSignatures(image, [attestors.scannedRelease]) > 0)
      message: >-
        Images built in this repository must carry a cosign signature with
        scan=passed from publish-image.yaml on main.
    - expression: >-
        variables.releaseImages.all(image,
          verifyAttestationSignatures(image, attestations.provenance, [attestors.release]) > 0)
      message: >-
        Images built in this repository must carry a SLSA provenance
        attestation from publish-image.yaml on main.
    - expression: >-
        variables.releaseImages.all(image,
          verifyAttestationSignatures(image, attestations.scan, [attestors.release]) > 0)
      message: >-
        Images built in this repository must carry a Trivy scan attestation
        from publish-image.yaml on main.
    # extractPayload reads the scan attestation verified above.
    - expression: >-
        variables.releaseImages.all(image,
          extractPayload(image, attestations.scan).predicate.scanner.uri.startsWith('pkg:github/aquasecurity/trivy@'))
      message: Scan attestations must come from Trivy.
