apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hubble-ui-oauth2-proxy
  namespace: hubble-ui
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: oauth2-proxy
  install:
    createNamespace: true
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    replicaCount: 1
    # Single replica + chart default minAvailable: 1 blocks every node drain.
    podDisruptionBudget:
      enabled: false
    config:
      existingSecret: hubble-ui-github-oauth
      configFile: |-
        provider = "github"
        redirect_url = "https://hubble.${DOMAIN}/oauth2/callback"
        upstreams = ["http://hubble-ui.kube-system.svc.cluster.local:80"]
        http_address = "0.0.0.0:4180"
        # Host-only __Host- cookie (no cookie_domains): forces Secure + Path=/ and
        # omits Domain, so the session cookie is never sent to www.${DOMAIN} or
        # grafana.${DOMAIN} and never collides with kyverno.${DOMAIN}'s proxy.
        cookie_name = "__Host-o2p-hubble"
        cookie_secure = true
        cookie_samesite = "lax"
        whitelist_domains = ["hubble.${DOMAIN}"]
        reverse_proxy = true
        set_xauthrequest = true
        skip_provider_button = true
        email_domains = ["*"]
        # SECURITY: restrict logins to this GitHub username. With no org/repo
        # configured, oauth2-proxy rejects every user not listed here.
        github_users = ["stefanf81"]
        scope = "user:email read:org"
    ingress:
      enabled: false
    resources:
      requests:
        cpu: "10m"
        memory: "64Mi"
      limits:
        memory: "256Mi"
