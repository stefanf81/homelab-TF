apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter-ui-oauth2-proxy
  namespace: policy-reporter
  annotations:
    # ACTION REQUIRED (one-time): create a GitHub OAuth App with
    #   Homepage URL: https://kyverno.jokelab.dev
    #   Callback URL: https://kyverno.jokelab.dev/oauth2/callback
    # then replace the two PLACEHOLDER values in policy-reporter-ui-oauth-secrets.yaml
    # and re-encrypt with sops. Until then, login fails closed (UI inaccessible).
    docs.jokelab.dev/action-required: "github-oauth-app"
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: oauth2-proxy
  install:
    createNamespace: false
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    replicaCount: 1
    # Single replica + chart default minAvailable: 1 blocks every node drain.
    podDisruptionBudget:
      enabled: false
    config:
      existingSecret: policy-reporter-ui-github-oauth
      configFile: |-
        provider = "github"
        redirect_url = "https://kyverno.${DOMAIN}/oauth2/callback"
        upstreams = ["http://policy-reporter-ui.policy-reporter.svc.cluster.local:8080"]
        http_address = "0.0.0.0:4180"
        # Host-only __Host- cookie (no cookie_domains): forces Secure + Path=/ and
        # omits Domain, so the session cookie is never sent to www.${DOMAIN} or
        # grafana.${DOMAIN} and never collides with hubble.${DOMAIN}'s proxy.
        cookie_name = "__Host-o2p-kyverno"
        cookie_secure = true
        cookie_samesite = "lax"
        whitelist_domains = ["kyverno.${DOMAIN}"]
        reverse_proxy = true
        set_xauthrequest = true
        skip_provider_button = true
        email_domains = ["*"]
        # SECURITY: the Policy Reporter UI's built-in GitHub OAuth has no
        # user/org allow-list, so the UI is fronted by this proxy instead.
        # With no org/repo configured, oauth2-proxy rejects every user not listed.
        github_users = ["stefanf81"]
        scope = "user:email read:org"
    ingress:
      enabled: false
    resources:
      requests:
        cpu: "10m"
        memory: "64Mi"
      limits:
        memory: "256Mi"
