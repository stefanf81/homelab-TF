# Ingress isolation for the policy-reporter namespace.
#
# Without a namespace-wide default-deny, selecting only oauth2-proxy leaves
# policy-reporter-ui:8080 and policy-reporter:8080 (REST API) open to every pod
# in the cluster, allowing any compromised workload to read all VulnerabilityReport,
# ExposedSecretReport and Falco PolicyReport data without authenticating.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: policy-reporter-ingress-default-deny
  namespace: policy-reporter
spec:
  endpointSelector: {}
  ingress:
    # Intra-namespace calls: oauth2-proxy -> policy-reporter-ui -> policy-reporter
    # REST API and the Kyverno/Trivy enrichment plugins.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": policy-reporter
    # Kubelet probes and admin `kubectl port-forward`.
    - fromEntities:
        - host
---
# Allow the Cilium Gateway to reach only the oauth2-proxy in the policy-reporter
# namespace. The UI service itself stays cluster-internal (the HTTPRoute targets
# the proxy, not the UI).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-to-policy-reporter-ui
  namespace: policy-reporter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: reserved:ingress
              operator: Exists
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
---
# Allow VictoriaMetrics vmagent (and only vmagent) to scrape policy-reporter /metrics.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vmagent-to-policy-reporter
  namespace: policy-reporter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: policy-reporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": vmagent
            "k8s:app.kubernetes.io/instance": victoria-metrics-k8s-stack
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
