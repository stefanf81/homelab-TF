apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-updater
    app.kubernetes.io/part-of: infrastructure
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Renovate needs cluster DNS plus HTTPS access to GitHub, registries, and Helm
# repositories. It has no inbound or Kubernetes API access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-https
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-updater
    app.kubernetes.io/part-of: infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: renovate
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
---
# The namespace-scoped operator needs only DNS and the Cilium API-server entity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-operator-kubernetes-api
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-updater
    app.kubernetes.io/part-of: infrastructure
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: renovate-operator
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
