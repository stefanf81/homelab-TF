apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hubble-ui
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
    - name: taskflow-app
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/infrastructure/controllers/hubble-ui
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
