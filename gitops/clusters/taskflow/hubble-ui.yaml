apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hubble-ui
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
    # The HTTPRoute only needs taskflow-gateway to exist: applied once, not healthy.
    - name: taskflow-app
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
  interval: 10m
  retryInterval: 5m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/platform/hubble-ui
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Substitutes DOMAIN from cluster-vars.yaml.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
