# Policy Reporter + UI: web dashboard for Kyverno ClusterPolicyReports.
# UI reachable at https://kyverno.jokelab.dev (Cilium Gateway + Let's Encrypt, same pattern as Grafana).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policy-reporter
  namespace: flux-system
spec:
  # Gateway (taskflow-app) must exist before the HTTPRoute is programmed, and
  # Kyverno's PolicyReport CRDs must exist before Policy Reporter can read them.
  dependsOn:
    - name: infra-controllers
    - name: taskflow-app
    # The Trivy adapter watches VulnerabilityReport/ConfigAuditReport CRDs owned by
    # trivy-operator; without this ordering it crash-loops until they exist.
    - name: trivy-operator
  interval: 30m
  retryInterval: 5m
  path: ./gitops/infrastructure/controllers/policy-reporter
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  # Decrypt the SOPS-encrypted GitHub OAuth secret (reuses the same age key as monitoring).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
