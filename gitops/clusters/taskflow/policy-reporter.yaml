# Policy Reporter + UI: web dashboard for Kyverno PolicyReports.
# UI reachable at https://kyverno.jokelab.dev (Cilium Gateway + Let's Encrypt, same pattern as Grafana).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policy-reporter
  namespace: flux-system
spec:
  # Kyverno's PolicyReport CRDs must exist before Policy Reporter can read them.
  # The HTTPRoute only needs taskflow-gateway to exist: taskflow-app is required to
  # have applied once, not to be healthy.
  dependsOn:
    - name: infra-controllers
    - name: taskflow-app
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
    # The Trivy adapter watches VulnerabilityReport/ConfigAuditReport CRDs owned by
    # trivy-operator; without this ordering it crash-loops until they exist.
    - name: trivy-operator
  interval: 30m
  retryInterval: 5m
  path: ./gitops/platform/policy-reporter
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  # Decrypt the SOPS-encrypted GitHub OAuth secret (reuses the same age key as monitoring).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Substitutes DOMAIN from cluster-vars.yaml.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
