apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-logging
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
    - name: taskflow-app
  interval: 30m
  path: ./gitops/monitoring/logging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
