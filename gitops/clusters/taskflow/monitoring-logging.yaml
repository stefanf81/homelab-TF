apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-logging
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
    - name: taskflow-app
    # Alloy renders namespace-scoped Roles in every platform namespace it tails;
    # ensure all of them exist before installing/upgrading the Alloy HelmRelease.
    - name: trivy-operator
    - name: policy-reporter
    - name: hubble-ui
    - name: reloader
    - name: renovate
  interval: 30m
  retryInterval: 5m
  path: ./gitops/monitoring/logging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
