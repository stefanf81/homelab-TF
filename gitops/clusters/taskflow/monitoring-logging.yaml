apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-logging
  namespace: flux-system
spec:
  dependsOn:
    # VMServiceScrape CRDs: the full Ready check.
    - name: monitoring
    # Alloy renders namespace-scoped Roles in every namespace it tails, so these
    # namespaces must exist before installing/upgrading the Alloy HelmRelease. Only
    # existence: each dependency is required to have applied once (readyExpr), not to
    # be healthy, so one unhealthy workload does not freeze log collection.
    - name: taskflow-app
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
    - name: trivy-operator
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
    - name: policy-reporter
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
    - name: hubble-ui
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
    - name: reloader
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
    - name: renovate
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
    - name: falco
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
  interval: 30m
  retryInterval: 5m
  path: ./gitops/monitoring/logging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
