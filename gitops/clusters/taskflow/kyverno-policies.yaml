apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  # CRDs must exist before ClusterPolicies can be applied.
  dependsOn:
    - name: infra-controllers
  interval: 30m
  path: ./gitops/apps/kyverno-policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
