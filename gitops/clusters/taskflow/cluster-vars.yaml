# Per-cluster values substituted into manifests by Kustomizations that declare
# `postBuild.substituteFrom: cluster-vars` (infra-controllers, infra-configs,
# taskflow-app, monitoring, policy-reporter, hubble-ui, abuseipdb).
# Use ${NAME} in a manifest; flux's substitution also rewrites `${...}` text, so
# write a literal one as `$${...}`. scripts/validate-gitops.sh applies the same
# values before schema validation and fails if a path uses a variable without
# the postBuild block.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  # Public DNS zone; hostnames are <name>.${DOMAIN}.
  DOMAIN: jokelab.dev
  # Cilium LB-IPAM address of the shared Gateway (must be inside the pool below).
  GATEWAY_IP: 192.168.50.201
  # Cilium LoadBalancer IP pool (infrastructure/configs/cilium/ippool.yaml).
  LB_POOL_START: 192.168.50.200
  LB_POOL_STOP: 192.168.50.250
  # k3s node address (keep equal to ip_address in terraform.tfvars): Cilium
  # k8sServiceHost and the CoreDNS hosts entry.
  NODE_IP: 192.168.50.55
  # Node / LAN subnet, also covers the LB pool (abuseipdb protected-cidrs).
  LAN_CIDR: 192.168.50.0/24
