apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: taskflow-app
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  path: ./gitops/apps/taskflow
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  # Decrypt SOPS-encrypted manifests (e.g. *-secrets.yaml) using the age key
  # stored in the sops-age Secret (see apps/taskflow/sops-age-secrets.yaml).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
