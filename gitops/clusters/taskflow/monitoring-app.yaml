# App-layer ServiceMonitors for TaskFlow. Depends on `monitoring` so the
# ServiceMonitor CRD is already registered when these are applied (Flux ordering
# safety — a CR cannot be created before its CRD exists).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-app
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
  interval: 30m
  path: ./gitops/monitoring/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
