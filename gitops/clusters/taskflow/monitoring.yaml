# Monitoring platform: VictoriaMetrics (VMSingle + vmagent) operator and its CRDs.
#
# Grafana is available via the public Gateway at https://grafana.jokelab.dev/.
# VMSingle has no public HTTPRoute; access it from inside the cluster or with port-forwarding.
# (Grafana admin and GitHub OAuth credentials come from the SOPS-encrypted gitops/monitoring/platform/grafana-secrets.yaml)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  # CRDs (VMServiceScrape, VMSingle, ...) must exist before the app-layer
  # VMServiceScrapes in gitops/monitoring/app are applied. The platform HTTPRoute also
  # targets taskflow-gateway, so wait for taskflow-app before programming that route.
  dependsOn:
    - name: infra-controllers
    - name: taskflow-app
  interval: 30m
  path: ./gitops/monitoring/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  # Decrypt the SOPS-encrypted Grafana admin secret (reuses the same age key as taskflow-app).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
