# Monitoring platform: VictoriaMetrics (VMSingle + vmagent) operator and its CRDs.
#
# Reach the UIs via the public Gateway:
#   Grafana:         https://paintlab.duckdns.org/grafana
#   VictoriaMetrics: https://paintlab.duckdns.org/vmsingle
# (Grafana admin login comes from the SOPS-encrypted gitops/monitoring/platform/grafana-secrets.yaml)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  # CRDs (VMServiceScrape, VMSingle, ...) must exist before the app-layer
  # VMServiceScrapes in gitops/monitoring/app are applied.
  dependsOn:
    - name: infra-controllers
  interval: 30m
  path: ./gitops/monitoring/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  # Decrypt the SOPS-encrypted Grafana admin secret (reuses the same age key as taskflow-app).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
