# Monitoring platform: VictoriaMetrics (VMSingle + vmagent) operator and its CRDs.
#
# Grafana is available via the public Gateway at https://grafana.jokelab.dev/.
# VMSingle has no public HTTPRoute; access it from inside the cluster or with port-forwarding.
# (Grafana admin and GitHub OAuth credentials come from the SOPS-encrypted gitops/monitoring/platform/grafana-secrets.yaml)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  # CRDs (VMServiceScrape, VMSingle, ...) must exist before the app-layer
  # VMServiceScrapes in gitops/monitoring/app are applied. The platform HTTPRoute
  # targets taskflow-gateway, which only has to exist: taskflow-app is required to
  # have applied once, not to be healthy, so a stuck app rollout does not freeze the
  # monitoring stack (readyExpr replaces the built-in Ready check; see
  # docs/ARCHITECTURE.md §4.1).
  dependsOn:
    - name: infra-controllers
    - name: taskflow-app
      readyExpr: >-
        has(dep.status) && has(dep.status.inventory) &&
        has(dep.status.inventory.entries) && size(dep.status.inventory.entries) > 0
  interval: 30m
  retryInterval: 5m
  path: ./gitops/monitoring/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  # Decrypt the SOPS-encrypted Grafana admin secret (reuses the same age key as taskflow-app).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Substitutes DOMAIN from cluster-vars.yaml.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
